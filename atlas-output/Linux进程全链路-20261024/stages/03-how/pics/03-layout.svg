<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="820" fill="#0a0c10"/>
  <text x="600" y="32" text-anchor="middle" fill="#e6edf3" font-size="20">hello 的地址空间:左边是程序看到的布局,右边是内核手里的账(mm_struct → VMA 串 → 页表)</text>
  <text x="600" y="52" text-anchor="middle" fill="#8b949e" font-size="12">x86-64,非 PIE 编译,地址为示意值(待核 #1);每一行 /proc/pid/maps = 一个 vm_area_struct</text>

  <!-- left: address column, high at top -->
  <g font-size="12">
    <text x="30" y="92" fill="#8b949e">高地址</text>
    <!-- kernel half -->
    <rect x="110" y="70" width="300" height="70" fill="#5f1e1e" stroke="#c04040"/>
    <text x="260" y="98" text-anchor="middle" fill="#ff8888">内核半区 0xffff8000_00000000 ~</text>
    <text x="260" y="118" text-anchor="middle" fill="#ff8888">128 TiB,PGD[256..511],所有进程共享</text>
    <text x="260" y="134" text-anchor="middle" fill="#c9d1d9" font-size="11">PTE 的 U/S=0:ring 3 碰一下就是 #PF</text>
    <!-- hole -->
    <rect x="110" y="140" width="300" height="30" fill="#161b22" stroke="#30363d"/>
    <text x="260" y="160" text-anchor="middle" fill="#8b949e" font-size="11">非规范地址洞(硬件不认)</text>
    <!-- user half -->
    <text x="420" y="188" fill="#8b949e" font-size="11">0x0000_7fff_ffff_ffff ← 用户半区顶</text>
    <rect x="110" y="176" width="300" height="24" fill="#161b22" stroke="#30363d"/>
    <text x="260" y="193" text-anchor="middle" fill="#8b949e" font-size="11">[vsyscall] [vdso] [vvar]</text>

    <rect x="110" y="200" width="300" height="34" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="260" y="214" text-anchor="middle" fill="#c088ff">环境变量 envp 字符串 / 命令行 argv 字符串</text>
    <text x="260" y="228" text-anchor="middle" fill="#c088ff" font-size="11">execve 时 create_elf_tables 摆的;auxv 也在这</text>

    <rect x="110" y="234" width="300" height="56" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="260" y="254" text-anchor="middle" fill="#c088ff">[stack]  向下长,默认上限 8 MiB</text>
    <text x="260" y="270" text-anchor="middle" fill="#c088ff" font-size="11">mm->start_stack;rsp 指进来</text>
    <text x="260" y="284" text-anchor="middle" fill="#c088ff" font-size="11">VM_GROWSDOWN:碰到下方未映射页会自动长</text>
    <text x="420" y="248" fill="#8b949e" font-size="11">0x7ffc_xxxx_xxxx(ASLR)</text>

    <rect x="110" y="290" width="300" height="24" fill="#161b22" stroke="#30363d"/>
    <text x="260" y="307" text-anchor="middle" fill="#8b949e" font-size="11">(空,留给栈长和 mmap 随机化)</text>

    <rect x="110" y="314" width="300" height="78" fill="#5f3a1e" stroke="#c08040"/>
    <text x="260" y="334" text-anchor="middle" fill="#ffaa55">mmap 区  向下长</text>
    <text x="260" y="350" text-anchor="middle" fill="#ffaa55" font-size="11">ld-linux-x86-64.so.2 的 4 段</text>
    <text x="260" y="366" text-anchor="middle" fill="#ffaa55" font-size="11">libc.so.6 的 r-- / r-x / r-- / rw- 四段 + bss</text>
    <text x="260" y="382" text-anchor="middle" fill="#ffaa55" font-size="11">malloc 大块(≥128 KiB)、mmap(2)、共享内存都落这</text>
    <text x="420" y="330" fill="#8b949e" font-size="11">0x7f.._....(mm->mmap_base)</text>

    <rect x="110" y="392" width="300" height="24" fill="#161b22" stroke="#30363d"/>
    <text x="260" y="409" text-anchor="middle" fill="#8b949e" font-size="11">(大片空洞,128 TiB 几乎全是空)</text>

    <rect x="110" y="416" width="300" height="44" fill="#1e5f3a" stroke="#40c060"/>
    <text x="260" y="434" text-anchor="middle" fill="#88ff88">[heap]  向上长,brk() 推 mm->brk</text>
    <text x="260" y="452" text-anchor="middle" fill="#88ff88" font-size="11">malloc 小块从这拿;全是匿名页,第一次碰给零页</text>
    <text x="420" y="430" fill="#8b949e" font-size="11">0x0040_6000 ~ 0x0042_7000(mm->start_brk ~ brk)</text>

    <rect x="110" y="460" width="300" height="40" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="260" y="476" text-anchor="middle" fill="#88c0ff">.data + .bss   rw-p</text>
    <text x="260" y="492" text-anchor="middle" fill="#88c0ff" font-size="11">counter=7 在 .data(文件里有);buf[1024] 在 .bss(文件里没有,只记长度)</text>
    <text x="420" y="474" fill="#8b949e" font-size="11">0x0040_4000 ~ 0x0040_6000</text>

    <rect x="110" y="500" width="300" height="30" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="260" y="519" text-anchor="middle" fill="#88c0ff">.rodata   r--p   "hi\n"、.eh_frame</text>
    <text x="420" y="514" fill="#8b949e" font-size="11">0x0040_2000 ~ 0x0040_3000</text>

    <rect x="110" y="530" width="300" height="30" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="260" y="549" text-anchor="middle" fill="#88c0ff">.text   r-xp   main 在 0x401136</text>
    <text x="420" y="544" fill="#8b949e" font-size="11">0x0040_1000 ~ 0x0040_2000</text>

    <rect x="110" y="560" width="300" height="30" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="260" y="579" text-anchor="middle" fill="#88c0ff">ELF 头 + 段表 + .interp   r--p</text>
    <text x="420" y="574" fill="#8b949e" font-size="11">0x0040_0000 ~ 0x0040_1000</text>

    <rect x="110" y="590" width="300" height="30" fill="#161b22" stroke="#30363d"/>
    <text x="260" y="609" text-anchor="middle" fill="#8b949e" font-size="11">0 ~ 0x40_0000 不映射:NULL 指针在这里炸(mmap_min_addr)</text>
    <text x="30" y="616" fill="#8b949e">低地址 0</text>
  </g>

  <!-- middle: mm_struct -->
  <rect x="470" y="200" width="210" height="300" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
  <text x="575" y="222" text-anchor="middle" fill="#88c0ff" font-size="14">struct mm_struct</text>
  <g fill="#c9d1d9" font-size="11">
    <text x="482" y="246">pgd        ──→ 页表根(CR3 装它)</text>
    <text x="482" y="266">mm_mt      ──→ VMA 的 maple tree</text>
    <text x="482" y="286">map_count   = 20 左右</text>
    <text x="482" y="306">start_code / end_code</text>
    <text x="482" y="326">start_data / end_data</text>
    <text x="482" y="346">start_brk / brk</text>
    <text x="482" y="366">start_stack</text>
    <text x="482" y="386">arg_start / arg_end</text>
    <text x="482" y="406">env_start / env_end</text>
    <text x="482" y="426">mmap_base</text>
    <text x="482" y="446">mm_users (线程数) / mm_count</text>
    <text x="482" y="466">total_vm / rss_stat</text>
    <text x="482" y="486" fill="#8b949e">task_struct->mm 指向它</text>
  </g>

  <!-- right: VMA list -->
  <text x="930" y="92" text-anchor="middle" fill="#e6edf3" font-size="14">VMA 串(mm_mt 里按地址排好,每段一条)</text>
  <g font-size="11">
    <rect x="720" y="100" width="420" height="40" rx="4" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="730" y="116" fill="#c088ff">vma [stack]  7ffc1000-7ffc3000 rw-p  anon  VM_GROWSDOWN</text>
    <text x="730" y="132" fill="#8b949e">vm_file=NULL  vm_ops=NULL  → 缺页给零页</text>

    <rect x="720" y="148" width="420" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="730" y="164" fill="#ffaa55">vma libc.so.6 .text  7f..a000-7f..c000 r-xp  pgoff=0x28000</text>
    <text x="730" y="180" fill="#8b949e">vm_file=libc  vm_ops=filemap  → 缺页从 page cache 拿,十个进程共用</text>

    <rect x="720" y="196" width="420" height="40" rx="4" fill="#1e5f3a" stroke="#40c060"/>
    <text x="730" y="212" fill="#88ff88">vma [heap]  00406000-00427000 rw-p  anon</text>
    <text x="730" y="228" fill="#8b949e">brk() 只改 vm_end;页还是碰了才给</text>

    <rect x="720" y="244" width="420" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="730" y="260" fill="#88c0ff">vma .data+.bss  00404000-00406000 rw-p  hello pgoff=0x3000</text>
    <text x="730" y="276" fill="#8b949e">MAP_PRIVATE:写了就 COW 出私有页;bss 尾巴是匿名零页</text>

    <rect x="720" y="292" width="420" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="730" y="308" fill="#88c0ff">vma .rodata  00402000-00403000 r--p  hello pgoff=0x2000</text>
    <text x="730" y="324" fill="#8b949e">写它 → #PF 带 W 位 → VMA 没 VM_WRITE → SIGSEGV</text>

    <rect x="720" y="340" width="420" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="730" y="356" fill="#88c0ff">vma .text  00401000-00402000 r-xp  hello pgoff=0x1000</text>
    <text x="730" y="372" fill="#8b949e">第一次取指 → 缺页 → 从 page cache 拿 hello 文件的第 1 页</text>

    <rect x="720" y="388" width="420" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="730" y="404" fill="#88c0ff">vma ELF 头  00400000-00401000 r--p  hello pgoff=0</text>
    <text x="730" y="420" fill="#8b949e">…(ld.so 四段、vdso、vvar 略)</text>
  </g>

  <!-- vma struct fields -->
  <rect x="720" y="450" width="420" height="130" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="930" y="470" text-anchor="middle" fill="#e6edf3" font-size="13">struct vm_area_struct 的关键字段</text>
  <g fill="#c9d1d9" font-size="11">
    <text x="732" y="492">vm_start / vm_end   这段管哪个地址区间(页对齐,左闭右开)</text>
    <text x="732" y="510">vm_flags            VM_READ/WRITE/EXEC/SHARED/GROWSDOWN… = maps 的 rwxp</text>
    <text x="732" y="528">vm_file + vm_pgoff  后面是哪个文件的第几页;NULL = 匿名</text>
    <text x="732" y="546">vm_ops->fault       缺页时谁来供页(文件: filemap_fault;匿名: 内核给零页)</text>
    <text x="732" y="564">vm_mm               回指 mm_struct;anon_vma 记反向映射(回收时用)</text>
  </g>

  <!-- arrows mm -> vma, mm -> pgd -->
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4080c0"/></marker>
  </defs>
  <g stroke="#4080c0" stroke-width="1.5" fill="none" marker-end="url(#a2)">
    <path d="M680,262 C700,262 700,120 716,120"/>
    <path d="M680,262 L716,262"/>
    <path d="M680,262 C700,262 700,404 716,404"/>
    <path d="M410,560 C440,560 440,545 466,545"/>
    <path d="M680,242 C700,242 700,640 716,640"/>
  </g>
  <text x="430" y="540" fill="#8b949e" font-size="10">这一段 ↔ 这一条</text>

  <!-- bottom: page table -->
  <rect x="720" y="600" width="420" height="200" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="930" y="622" text-anchor="middle" fill="#e6edf3" font-size="13">页表(pgd):和 VMA 是两本独立的账</text>
  <g fill="#c9d1d9" font-size="11">
    <text x="732" y="646">VMA 记"应该有什么"(合法范围、权限、来源);</text>
    <text x="732" y="664">页表记"现在真有什么"(哪页已经在物理内存、在哪)。</text>
    <text x="732" y="688">execve 刚结束:VMA 20 条,页表几乎全空 → 第一条指令就缺页。</text>
    <text x="732" y="712">缺页处理 = 查 VMA 判合法 → 供页 → 填一条 PTE。</text>
    <text x="732" y="736">/proc/pid/maps 读 VMA;/proc/pid/smaps 的 Rss 走页表数。</text>
    <text x="732" y="760" fill="#ffaa55">4 KiB 页;hello 20 GB 堆也只占 VMA 一条,页表 40 MB。</text>
    <text x="732" y="784" fill="#8b949e">线程:同一本 mm_struct,所以同一串 VMA 同一张页表。</text>
  </g>

  <!-- left bottom legend -->
  <g font-size="11" fill="#8b949e">
    <text x="110" y="650">颜色:</text>
    <rect x="160" y="640" width="14" height="12" fill="#1e3a5f" stroke="#4080c0"/><text x="180" y="650">文件映射(hello 自己)</text>
    <rect x="330" y="640" width="14" height="12" fill="#5f3a1e" stroke="#c08040"/><text x="350" y="650">mmap 区(共享库 / 大块)</text>
    <rect x="160" y="664" width="14" height="12" fill="#1e5f3a" stroke="#40c060"/><text x="180" y="674">堆(匿名)</text>
    <rect x="330" y="664" width="14" height="12" fill="#3a1e5f" stroke="#8040c0"/><text x="350" y="674">栈 + 参数环境(匿名)</text>
    <rect x="160" y="688" width="14" height="12" fill="#5f1e1e" stroke="#c04040"/><text x="180" y="698">内核半区(ring 3 不可见)</text>
    <text x="110" y="730">读法:自上而下是地址从高到低;PIE 编译时 0x400000 那几段整体挪到 0x5555_5555_4000 附近,其余不变。</text>
    <text x="110" y="750">栈向下长、堆向上长、mmap 区从 mmap_base 向下长;三者中间全是空洞,碰了就是 SIGSEGV。</text>
    <text x="110" y="770">每个进程一张图;线程共用一张图,各自只多一块栈(在 mmap 区里,由 pthread 用 mmap 申请)。</text>
  </g>
</svg>
