<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="JetBrains Mono, Consolas, monospace">
<rect width="1200" height="560" fill="#0a0c10"/>
<text x="600" y="30" fill="#e0e6f0" font-size="18" font-weight="bold" text-anchor="middle">三条主线并排:创建差最大,写时拷差在「有没有 fork」,调度是两种世界观</text>
<text x="600" y="50" fill="#9aa4b2" font-size="11" text-anchor="middle">左 Linux 6.12(hello),右 Windows NT(hello.exe);中间一列是这一行两边差多少、差从哪来</text>

<text x="300" y="80" fill="#88c0ff" font-size="13" font-weight="bold" text-anchor="middle">Linux 6.12</text>
<text x="900" y="80" fill="#c088ff" font-size="13" font-weight="bold" text-anchor="middle">Windows NT</text>
<text x="600" y="80" fill="#9aa4b2" font-size="11" text-anchor="middle">差异 / 来源</text>

<!-- row 1: 创建 -->
<text x="40" y="118" fill="#ffaa55" font-size="12" font-weight="bold">① 创建</text>
<rect x="80" y="96" width="440" height="120" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="1.5"/>
<text x="92" y="116" fill="#88c0ff" font-size="12" font-weight="bold">fork 复制 → [窗] → execve 换</text>
<text x="92" y="134" fill="#c8d4e4" font-size="10">copy_process:复制 mm / 页表 / 文件表(20 GB 堆 100~200 ms)</text>
<text x="92" y="150" fill="#c8d4e4" font-size="10">窗口里 dup2 / chdir / sigprocmask … 普通系统调用配置子进程</text>
<text x="92" y="166" fill="#c8d4e4" font-size="10">begin_new_exec :996 = 判据① 不可回头点;之前只读之后只建</text>
<text x="92" y="182" fill="#c8d4e4" font-size="10">ld.so → _start → main;hello 全程 ~500 μs</text>
<text x="92" y="204" fill="#ff8888" font-size="10">多线程下 fork 半残;clone 一个入口两种用途</text>

<rect x="680" y="96" width="440" height="120" rx="6" fill="#3a1e5f" stroke="#8040c0" stroke-width="1.5"/>
<text x="692" y="116" fill="#c088ff" font-size="12" font-weight="bold">CreateProcess 一次造好(NtCreateUserProcess)</text>
<text x="692" y="134" fill="#d8c8f0" font-size="10">7 阶段:校验 → section(SEC_IMAGE)→ EPROCESS + PEB → ETHREAD</text>
<text x="692" y="150" fill="#d8c8f0" font-size="10">→ 通知 CSRSS → 放行 → LdrInitializeThunk 加载 DLL → 入口</text>
<text x="692" y="166" fill="#d8c8f0" font-size="10">窗口 = 参数表:句柄继承 / 标准流 / 目录 / 优先级类 / 属性列表</text>
<text x="692" y="182" fill="#d8c8f0" font-size="10">没有旧地址空间 → 没有不可回头点;一次毫秒级,不随父大小长</text>
<text x="692" y="204" fill="#ff8888" font-size="10">内核藏着 fork(SectionHandle=NULL),只给 POSIX / WSL1</text>

<rect x="535" y="110" width="130" height="92" rx="6" fill="#5f1e1e" stroke="#c04040" stroke-width="1.5"/>
<text x="600" y="130" fill="#ff8888" font-size="11" font-weight="bold" text-anchor="middle">差异最大</text>
<text x="600" y="148" fill="#ffb0b0" font-size="9" text-anchor="middle">两步 vs 一步</text>
<text x="600" y="162" fill="#ffb0b0" font-size="9" text-anchor="middle">窗 vs 参数表</text>
<text x="600" y="180" fill="#ffb0b0" font-size="9" text-anchor="middle">来源:1969 PDP-7</text>
<text x="600" y="194" fill="#ffb0b0" font-size="9" text-anchor="middle">vs VMS $CREPRC</text>

<!-- row 2: 调度 -->
<text x="40" y="258" fill="#ffaa55" font-size="12" font-weight="bold">② 调度</text>
<rect x="80" y="236" width="440" height="120" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="1.5"/>
<text x="92" y="256" fill="#88c0ff" font-size="12" font-weight="bold">EEVDF:一条平均线 + lag + deadline</text>
<text x="92" y="274" fill="#c8d4e4" font-size="10">eligible = vruntime ≤ V;在 eligible 里挑 deadline 最早(:907)</text>
<text x="92" y="290" fill="#c8d4e4" font-size="10">权重 40 级 1.25 倍等比;slice 3 ms @ 8 核;lag 夹 ±2 slice</text>
<text x="92" y="306" fill="#c8d4e4" font-size="10">睡醒按欠账放回,不看设备;cgroup 层级份额</text>
<text x="92" y="322" fill="#c8d4e4" font-size="10">每核 rq(2003);切换存 6 + rsp(SysV ABI)</text>
<text x="92" y="344" fill="#ff8888" font-size="10">没有级,霸不住;「急」要靠短 slice / PREEMPT_SHORT 模拟</text>

<rect x="680" y="236" width="440" height="120" rx="6" fill="#3a1e5f" stroke="#8040c0" stroke-width="1.5"/>
<text x="692" y="256" fill="#c088ff" font-size="12" font-weight="bold">32 级严格抢占 + 同级轮转 + 动态加分</text>
<text x="692" y="274" fill="#d8c8f0" font-size="10">级最高者永远先跑;更高级就绪立刻抢;1~15 加分,16~31 不加</text>
<text x="692" y="290" fill="#d8c8f0" font-size="10">IO 完成 +1~8 / 前台 / 输入 +2 / 饿 4 s → 15;每片减 1 回基线</text>
<text x="692" y="306" fill="#d8c8f0" font-size="10">时间片 2 或 12 个时钟中断(~31 / ~187 ms);按线程不按进程</text>
<text x="692" y="322" fill="#d8c8f0" font-size="10">每核就绪队列(Win7,2009);切换存 8 + 10 XMM + rsp</text>
<text x="692" y="344" fill="#ff8888" font-size="10">优先级反转;REALTIME 可真霸台;开发者要懂调度</text>

<rect x="535" y="250" width="130" height="92" rx="6" fill="#5f3a1e" stroke="#c08040" stroke-width="1.5"/>
<text x="600" y="270" fill="#ffaa55" font-size="11" font-weight="bold" text-anchor="middle">两种世界观</text>
<text x="600" y="288" fill="#ffd0a0" font-size="9" text-anchor="middle">账 vs 级</text>
<text x="600" y="302" fill="#ffd0a0" font-size="9" text-anchor="middle">守恒量 vs 经验值</text>
<text x="600" y="320" fill="#ffd0a0" font-size="9" text-anchor="middle">来源:服务器公平</text>
<text x="600" y="334" fill="#ffd0a0" font-size="9" text-anchor="middle">vs VMS + 桌面</text>

<!-- row 3: 缺页与 COW -->
<text x="40" y="398" fill="#ffaa55" font-size="12" font-weight="bold">③ 写时拷</text>
<rect x="80" y="376" width="440" height="120" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="1.5"/>
<text x="92" y="396" fill="#88c0ff" font-size="12" font-weight="bold">判据③:独占才复用(do_wp_page :3724)</text>
<text x="92" y="414" fill="#c8d4e4" font-size="10">文件私有页:首写必拷(wp_page_copy)</text>
<text x="92" y="430" fill="#c8d4e4" font-size="10">匿名页:PageAnonExclusive ∨ 锁下 ref_count == 1;三轮补丁</text>
<text x="92" y="446" fill="#c8d4e4" font-size="10">minor / major = MAJOR ∨ TRIED;全局 LRU + cgroup;THP 透明</text>
<text x="92" y="462" fill="#c8d4e4" font-size="10">超售 overcommit;Redis 让你设 =1 并预留翻倍内存</text>
<text x="92" y="484" fill="#ff8888" font-size="10">判据复杂的根源:fork 让匿名页也被共享</text>

<rect x="680" y="376" width="440" height="120" rx="6" fill="#3a1e5f" stroke="#8040c0" stroke-width="1.5"/>
<text x="692" y="396" fill="#c088ff" font-size="12" font-weight="bold">页归 section 对象;PAGE_WRITECOPY 首写必拷</text>
<text x="692" y="414" fill="#d8c8f0" font-size="10">prototype PTE 指向 section 的页;进程 PTE 只是「看一眼」</text>
<text x="692" y="430" fill="#d8c8f0" font-size="10">私有页从不共享(无 fork)→ 没有「独占才复用」这道题</text>
<text x="692" y="446" fill="#d8c8f0" font-size="10">soft / hard 定义同;按进程 working set 修剪;大页显式不透明</text>
<text x="692" y="462" fill="#d8c8f0" font-size="10">commit charge 预扣整个视图;不超售;没有 OOM killer</text>
<text x="692" y="484" fill="#ff8888" font-size="10">代价:做不了「借 20 GB 只碰 200 MB」</text>

<rect x="535" y="390" width="130" height="92" rx="6" fill="#1e5f3a" stroke="#40c060" stroke-width="1.5"/>
<text x="600" y="410" fill="#88ff88" font-size="11" font-weight="bold" text-anchor="middle">一半同一半无</text>
<text x="600" y="428" fill="#b0ffb0" font-size="9" text-anchor="middle">文件页:一样</text>
<text x="600" y="442" fill="#b0ffb0" font-size="9" text-anchor="middle">匿名页:NT 没有</text>
<text x="600" y="460" fill="#b0ffb0" font-size="9" text-anchor="middle">来源:有没有 fork</text>
<text x="600" y="474" fill="#b0ffb0" font-size="9" text-anchor="middle">(事一决定事三)</text>

<!-- footer -->
<line x1="80" y1="516" x2="1120" y2="516" stroke="#2a2f3a" stroke-width="1"/>
<text x="600" y="536" fill="#9aa4b2" font-size="10" text-anchor="middle">三行之外(syscall 门 / 中断 / 对象引用计数归零才释放 / 每核队列)两边几乎重合 —— 那些是约束逼出来的;三行里的差异全部追到「有没有 fork」+ VMS 血统</text>
</svg>
