  <text x="600.0" y="30" text-anchor="middle" fill="#8892a0" font-size="13">limactl shell cg — root@lima-cg(Ubuntu 26.04.1 · Linux 7.0.0-38 · 4 核 8G)</text>
  <text x="28" y="64" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 1. 先跑:一个父 shell 起 8 个吃 CPU 的子进程</text>
  <text x="28" y="85" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">setsid bash -c &#x27;for i in {1..8}; do yes &gt;/dev/null &amp; done; echo $$ &gt; /tmp/parent.pid; wait&#x27; &amp;</tspan></text>
  <text x="28" y="106" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">cat /tmp/parent.pid</tspan></text>
  <text x="28" y="127" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">2993</text>
  <text x="28" y="148" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">pgrep -P 2993 | xargs</tspan></text>
  <text x="28" y="169" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">2995 2996 2997 2998 2999 3000 3001 3002</text>
  <text x="28" y="190" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">cat /proc/2993/cgroup</tspan></text>
