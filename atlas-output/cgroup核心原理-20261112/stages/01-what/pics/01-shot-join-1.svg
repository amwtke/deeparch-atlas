  <text x="28" y="232" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="253" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 2. 后建组,只把父进程写进去,再设限</text>
  <text x="28" y="274" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">mkdir /sys/fs/cgroup/demo</tspan></text>
  <text x="28" y="295" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">echo 2993 &gt; /sys/fs/cgroup/demo/cgroup.procs</tspan></text>
  <text x="28" y="316" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">echo &quot;50000 100000&quot; &gt; /sys/fs/cgroup/demo/cpu.max</tspan></text>
  <text x="28" y="337" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="358" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 3. 名单:组里只有父进程,子进程没跟过来</text>
  <text x="28" y="379" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">cat /sys/fs/cgroup/demo/cgroup.procs</tspan></text>
  <text x="28" y="400" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">2993</text>
  <text x="28" y="421" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">cat /proc/2993/cgroup</tspan></text>
