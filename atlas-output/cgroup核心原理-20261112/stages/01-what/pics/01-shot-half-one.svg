  <text x="28" y="568" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">bash -c &#x27;echo $$ &gt; /sys/fs/cgroup/half/cgroup.procs; exec &quot;$@&quot;&#x27; _ python3 work.py 111111111</tspan></text>
