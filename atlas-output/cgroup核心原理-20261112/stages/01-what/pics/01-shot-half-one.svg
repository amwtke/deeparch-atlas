  <text x="600.0" y="30" text-anchor="middle" fill="#8892a0" font-size="13">limactl shell cg — root@lima-cg(Ubuntu 26.04.1 · Linux 7.0.0-38 · 4 核 8G)</text>
  <text x="28" y="64" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">cat work.py</tspan></text>
  <text x="28" y="85" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">import sys, time</text>
  <text x="28" y="106" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">def burn(n):                      # 纯计算:做 n 次乘加</text>
  <text x="28" y="127" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">    x = 0</text>
  <text x="28" y="148" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">    for i in range(n):</text>
  <text x="28" y="169" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">        x += i * i</text>
  <text x="28" y="190" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">    return x</text>
  <text x="28" y="211" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">t0 = time.monotonic(); c0 = time.process_time()</text>
  <text x="28" y="232" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">burn(int(sys.argv[1]))</text>
  <text x="28" y="253" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">t1 = time.monotonic(); c1 = time.process_time()</text>
  <text x="28" y="274" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">print(f&quot;墙上时间={t1-t0:.2f}s  CPU时间={c1-c0:.2f}s&quot;, flush=True)</text>
  <text x="28" y="295" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="316" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 不设限,直接跑</text>
  <text x="28" y="337" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">python3 work.py 111111111</tspan></text>
  <rect x="22" y="343" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="358" xml:space="preserve" style="white-space:pre" fill="#88c0ff">墙上时间=2.05s  CPU时间=2.05s</text>
  <text x="28" y="379" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="400" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 建一个 0.5 核的组;先入组、后变身,再跑同一份活</text>
  <text x="28" y="421" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">mkdir /sys/fs/cgroup/half</tspan></text>
  <text x="28" y="442" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">echo &quot;50000 100000&quot; &gt; /sys/fs/cgroup/half/cpu.max</tspan></text>
  <text x="28" y="463" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">grep -E &#x27;usage_usec|nr_periods|nr_throttled|throttled_usec&#x27; /sys/fs/cgroup/half/cpu.stat</tspan></text>
  <text x="28" y="484" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">usage_usec 0</text>
  <text x="28" y="505" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">nr_periods 0</text>
