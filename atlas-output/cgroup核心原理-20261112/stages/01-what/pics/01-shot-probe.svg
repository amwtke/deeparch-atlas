  <text x="28" y="295" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 组里先放 3 个烧 CPU 的任务,再让第 4 个进程跑探针</text>
  <text x="28" y="316" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">for i in 1 2 3; do bash -c &#x27;echo $$ &gt; /sys/fs/cgroup/half/cgroup.procs; exec &quot;$@&quot;&#x27; _ python3 work.py 999999999 &gt;/dev</tspan></text>
