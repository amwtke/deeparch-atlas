<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="700" fill="#0a0c10"/>
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#8892a0"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4080c0"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="600" y="32" text-anchor="middle" fill="#e0e6f0" font-size="20">cgroup 的外形:一棵树 + 一排控制器</text>
  <text x="600" y="54" text-anchor="middle" fill="#8892a0" font-size="12">host01(4 核 8G)上的组 · 竖着是一棵目录树(核心,只有一套)· 横着是一排控制器(每种资源一列)· 示意图</text>

  <!-- top band: management programs -->
  <rect x="30" y="68" width="1140" height="30" rx="6" fill="none" stroke="#5c6675" stroke-dasharray="6,4"/>
  <text x="46" y="88" fill="#a0a8b4" font-size="12">上面:管理程序决定每组分多少,把数写进这些文件(docker / runc · systemd · kubelet,§4)</text>
  <g stroke="#8892a0" stroke-width="1.2" marker-end="url(#ag)">
    <line x1="495" y1="99" x2="495" y2="114"/>
    <line x1="655" y1="99" x2="655" y2="114"/>
    <line x1="815" y1="99" x2="815" y2="114"/>
    <line x1="975" y1="99" x2="975" y2="114"/>
    <line x1="1115" y1="99" x2="1115" y2="114"/>
  </g>

  <!-- column headers -->
  <g font-size="12">
    <text x="30" y="132" fill="#c088ff">组 = 目录(竖着这棵树属于核心)</text>
    <text x="495" y="132" text-anchor="middle" fill="#88ff88">cgroup.procs</text>
    <text x="655" y="132" text-anchor="middle" fill="#ffaa55">cpu.max</text>
    <text x="815" y="132" text-anchor="middle" fill="#ffaa55">memory.max</text>
    <text x="975" y="132" text-anchor="middle" fill="#ffaa55">io.max</text>
    <text x="1115" y="132" text-anchor="middle" fill="#ffaa55">pids.max</text>
  </g>

  <!-- tree lines (directory containment: solid) -->
  <g stroke="#8040c0" stroke-width="1.5" fill="none">
    <path d="M44,180 L44,373 L60,373"/>
    <path d="M44,205 L60,205"/>
    <path d="M74,222 L74,331 L90,331"/>
    <path d="M74,247 L90,247"/>
    <path d="M74,289 L90,289"/>
  </g>

  <!-- row 0: root -->
  <rect x="30" y="146" width="380" height="34" rx="6" fill="#3a1e5f" stroke="#8040c0" stroke-width="2"/>
  <text x="42" y="168" fill="#c088ff" font-size="12">/sys/fs/cgroup/</text>
  <text x="402" y="168" text-anchor="end" fill="#c088ff" font-size="11">根组 = 整台机器 host01</text>
  <text x="430" y="168" fill="#8892a0" font-size="11">根上没有 .max 文件:整台机器的硬件本身就是上限</text>

  <!-- row 1: system.slice -->
  <rect x="60" y="188" width="350" height="34" rx="6" fill="#3a1e5f" stroke="#8040c0"/>
  <text x="72" y="210" fill="#c088ff" font-size="12">system.slice/</text>
  <text x="402" y="210" text-anchor="end" fill="#c088ff" font-size="11">系统服务和容器挂在下面</text>
  <text x="430" y="210" fill="#8892a0" font-size="11">(中间一层,格子略)</text>

  <!-- row 2: job -->
  <rect x="90" y="230" width="320" height="34" rx="6" fill="#3a1e5f" stroke="#8040c0" stroke-width="1.5"/>
  <text x="102" y="252" fill="#c088ff" font-size="12">docker-9f2c…e1.scope/</text>
  <text x="402" y="252" text-anchor="end" fill="#c088ff" font-size="11">容器 job(report)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="424" y="233" width="142" height="28" rx="3" fill="#1e5f3a" stroke="#40c060"/>
    <text x="495" y="252" fill="#88ff88">4321 4350…4357</text>
    <rect x="584" y="233" width="142" height="28" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="655" y="252" fill="#ffaa55">50000 100000</text>
    <rect x="744" y="233" width="142" height="28" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="815" y="252" fill="#ffaa55">536870912</text>
    <rect x="904" y="233" width="142" height="28" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="975" y="251" fill="#ffaa55" font-size="11">253:0 wbps=10485760*</text>
    <rect x="1064" y="233" width="102" height="28" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="1115" y="252" fill="#ffaa55">20*</text>
  </g>

  <!-- row 3: db -->
  <rect x="90" y="272" width="320" height="34" rx="6" fill="#3a1e5f" stroke="#8040c0" stroke-width="1.5"/>
  <text x="102" y="294" fill="#c088ff" font-size="12">docker-77ab…c4.scope/</text>
  <text x="402" y="294" text-anchor="end" fill="#c088ff" font-size="11">容器 db(mysqld)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="424" y="275" width="142" height="28" rx="3" fill="#1e5f3a" stroke="#40c060"/>
    <text x="495" y="294" fill="#88ff88">2210</text>
    <rect x="584" y="275" width="142" height="28" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="655" y="294" fill="#ffaa55">200000 100000</text>
    <rect x="744" y="275" width="142" height="28" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="815" y="294" fill="#ffaa55">4294967296</text>
    <rect x="904" y="275" width="142" height="28" rx="3" fill="#2a1d10" stroke="#7a5530"/>
    <text x="975" y="294" fill="#b08a60">(空)</text>
    <rect x="1064" y="275" width="102" height="28" rx="3" fill="#2a1d10" stroke="#7a5530"/>
    <text x="1115" y="294" fill="#b08a60">max</text>
  </g>

  <!-- row 4: sshd.service -->
  <rect x="90" y="314" width="320" height="34" rx="6" fill="#3a1e5f" stroke="#8040c0"/>
  <text x="102" y="336" fill="#c088ff" font-size="12">sshd.service/</text>
  <text x="402" y="336" text-anchor="end" fill="#c088ff" font-size="11">普通服务也是一个组</text>
  <g font-size="12" text-anchor="middle">
    <rect x="424" y="317" width="142" height="28" rx="3" fill="#1e5f3a" stroke="#40c060"/>
    <text x="495" y="336" fill="#88ff88">…</text>
    <rect x="584" y="317" width="142" height="28" rx="3" fill="#2a1d10" stroke="#7a5530"/>
    <text x="655" y="336" fill="#b08a60">max 100000</text>
    <rect x="744" y="317" width="142" height="28" rx="3" fill="#2a1d10" stroke="#7a5530"/>
    <text x="815" y="336" fill="#b08a60">max</text>
    <rect x="904" y="317" width="142" height="28" rx="3" fill="#2a1d10" stroke="#7a5530"/>
    <text x="975" y="336" fill="#b08a60">(空)</text>
    <rect x="1064" y="317" width="102" height="28" rx="3" fill="#2a1d10" stroke="#7a5530"/>
    <text x="1115" y="336" fill="#b08a60">…</text>
  </g>

  <!-- row 5: user session -->
  <rect x="60" y="356" width="350" height="34" rx="6" fill="#3a1e5f" stroke="#8040c0"/>
  <text x="72" y="378" fill="#c088ff" font-size="12">user.slice/…/session-6.scope/</text>
  <text x="402" y="378" text-anchor="end" fill="#c088ff" font-size="11">你登录的 shell</text>
  <g font-size="12" text-anchor="middle">
    <rect x="424" y="359" width="142" height="28" rx="3" fill="#1e5f3a" stroke="#40c060"/>
    <text x="495" y="378" fill="#88ff88">…</text>
    <rect x="584" y="359" width="142" height="28" rx="3" fill="#2a1d10" stroke="#7a5530"/>
    <text x="655" y="378" fill="#b08a60">max 100000</text>
    <rect x="744" y="359" width="142" height="28" rx="3" fill="#2a1d10" stroke="#7a5530"/>
    <text x="815" y="378" fill="#b08a60">max</text>
    <rect x="904" y="359" width="142" height="28" rx="3" fill="#2a1d10" stroke="#7a5530"/>
    <text x="975" y="378" fill="#b08a60">(空)</text>
    <rect x="1064" y="359" width="102" height="28" rx="3" fill="#2a1d10" stroke="#7a5530"/>
    <text x="1115" y="378" fill="#b08a60">…</text>
  </g>

  <!-- controllers row -->
  <rect x="30" y="410" width="536" height="64" rx="6" fill="#3a1e5f" stroke="#8040c0" stroke-width="1.5"/>
  <text x="46" y="433" fill="#c088ff" font-size="13">核心:这棵树 + 成员名单 + 文件接口(只有一套)</text>
  <text x="46" y="451" fill="#c088ff" font-size="11">只管「谁和谁一组」,不处理 CPU、内存这些资源</text>
  <text x="46" y="467" fill="#8892a0" font-size="11">超了怎么办,由右边各控制器各自决定</text>

  <g text-anchor="middle">
    <rect x="584" y="410" width="142" height="64" rx="6" fill="#5f3a1e" stroke="#c08040" stroke-width="1.5"/>
    <text x="655" y="431" fill="#ffaa55" font-size="13">cpu 控制器</text>
    <text x="655" y="449" fill="#c9a070" font-size="11">记 CPU 时间</text>
    <text x="655" y="466" fill="#ff8888" font-size="11">超了:停到下个周期</text>

    <rect x="744" y="410" width="142" height="64" rx="6" fill="#5f3a1e" stroke="#c08040" stroke-width="1.5"/>
    <text x="815" y="431" fill="#ffaa55" font-size="13">memory 控制器</text>
    <text x="815" y="449" fill="#c9a070" font-size="11">记占用的内存</text>
    <text x="815" y="466" fill="#ff8888" font-size="11">超了:先回收,再杀</text>

    <rect x="904" y="410" width="142" height="64" rx="6" fill="#5f3a1e" stroke="#c08040" stroke-width="1.5"/>
    <text x="975" y="431" fill="#ffaa55" font-size="13">io 控制器</text>
    <text x="975" y="449" fill="#c9a070" font-size="11">记读写字节</text>
    <text x="975" y="466" fill="#ff8888" font-size="11">超了:请求排队</text>

    <rect x="1064" y="410" width="102" height="64" rx="6" fill="#5f3a1e" stroke="#c08040" stroke-width="1.5"/>
    <text x="1115" y="431" fill="#ffaa55" font-size="13">pids 控制器</text>
    <text x="1115" y="449" fill="#c9a070" font-size="11">记进程个数</text>
    <text x="1115" y="466" fill="#ff8888" font-size="11">超了:fork 失败</text>
  </g>

  <!-- hook connectors (logical: dashed) -->
  <g stroke="#4080c0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ab)">
    <line x1="495" y1="474" x2="495" y2="498"/>
    <line x1="655" y1="474" x2="655" y2="498"/>
    <line x1="815" y1="474" x2="815" y2="498"/>
    <line x1="975" y1="474" x2="975" y2="498"/>
    <line x1="1115" y1="474" x2="1115" y2="498"/>
  </g>

  <!-- roads row -->
  <text x="30" y="514" fill="#88c0ff" font-size="12">下面:内核本来就要走的代码路径</text>
  <text x="30" y="531" fill="#7fa8d0" font-size="11">(§6 点名,第三节展开)</text>
  <g text-anchor="middle" font-size="12">
    <rect x="424" y="500" width="142" height="36" rx="6" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="495" y="523" fill="#88c0ff">fork · 退出</text>
    <rect x="584" y="500" width="142" height="36" rx="6" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="655" y="523" fill="#88c0ff">调度器结算</text>
    <rect x="744" y="500" width="142" height="36" rx="6" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="815" y="523" fill="#88c0ff">缺页</text>
    <rect x="904" y="500" width="142" height="36" rx="6" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="975" y="523" fill="#88c0ff">提交 IO</text>
    <rect x="1064" y="500" width="102" height="36" rx="6" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="1115" y="523" fill="#88c0ff">fork</text>
  </g>

  <!-- the other five controllers -->
  <rect x="584" y="552" width="582" height="26" rx="4" fill="none" stroke="#7a5530" stroke-dasharray="4,3"/>
  <text x="875" y="569" text-anchor="middle" fill="#c9a070" font-size="11">这一排其实有 9 个控制器,另外 5 个:cpuset · hugetlb · rdma · misc · dmem(§3)</text>

  <!-- legend -->
  <g font-size="11">
    <text x="30" y="608" fill="#8892a0" font-size="12">图例</text>
    <rect x="30" y="618" width="14" height="14" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="52" y="630" fill="#c088ff">树 / 核心</text>
    <rect x="170" y="618" width="14" height="14" fill="#1e5f3a" stroke="#40c060"/>
    <text x="192" y="630" fill="#88ff88">成员名单(入组)</text>
    <rect x="350" y="618" width="14" height="14" fill="#5f3a1e" stroke="#c08040"/>
    <text x="372" y="630" fill="#ffaa55">控制器 · 写了数的上限</text>
    <rect x="560" y="618" width="14" height="14" fill="#2a1d10" stroke="#7a5530"/>
    <text x="582" y="630" fill="#b08a60">没写数(不设限)</text>
    <rect x="730" y="618" width="14" height="14" fill="#5f1e1e" stroke="#c04040"/>
    <text x="752" y="630" fill="#ff8888">超了之后的办法</text>
    <rect x="900" y="618" width="14" height="14" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="922" y="630" fill="#88c0ff">内核本来就要走的代码路径</text>
    <text x="30" y="658" fill="#8892a0">实线 = 目录的父子关系 · 虚线 = 控制器接入哪条代码路径 · 「…」= 图里略去</text>
    <text x="30" y="680" fill="#8892a0">* job 的 io.max、pids.max 借用 §3 实验里写的数;CPU、内存两格来自 §0 的 docker 命令;db、sshd 的数是设想的</text>
  </g>
</svg>
