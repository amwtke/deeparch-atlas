<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" font-family="JetBrains Mono, Consolas, monospace" font-size="14">
  <rect width="1200" height="572" fill="#0a0c10"/>
  <rect x="8" y="8" width="1184" height="556" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M8,42 L1192,42" stroke="#30363d"/>
  <circle cx="30" cy="25" r="6" fill="#ff5f56"/><circle cx="50" cy="25" r="6" fill="#ffbd2e"/><circle cx="70" cy="25" r="6" fill="#27c93f"/>
  <text x="600.0" y="30" text-anchor="middle" fill="#8892a0" font-size="13">limactl shell cg — root@lima-cg(Ubuntu 26.04.1 · Linux 7.0.0-38 · 4 核 8G)· 沙箱组 host01</text>
  <text x="28" y="64" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 这台虚拟机上还有别的真服务在跑,实验不能碰它们</text>
  <text x="28" y="85" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">ps -eo rss,comm --sort=-rss | head -4</tspan></text>
  <text x="28" y="106" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">  RSS COMMAND</text>
  <rect x="22" y="112" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="127" xml:space="preserve" style="white-space:pre" fill="#88c0ff">1132952 clickhouse-serv</text>
  <rect x="22" y="133" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="148" xml:space="preserve" style="white-space:pre" fill="#88c0ff">742880 mysqld</text>
  <text x="28" y="169" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">119840 ClickHouseWatch</text>
  <text x="28" y="190" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">free -m | head -2</tspan></text>
  <text x="28" y="211" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">               total        used        free      shared  buff/cache   available</text>
  <text x="28" y="232" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">Mem:            7914        2273        3442           1        2812        5640</text>
  <text x="28" y="253" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="274" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 圈一个沙箱组当作文中的那台机器:内存上限 3G,不限 CPU</text>
  <text x="28" y="295" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">mkdir /sys/fs/cgroup/host01</tspan></text>
  <text x="28" y="316" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">echo 3G &gt; /sys/fs/cgroup/host01/memory.max</tspan></text>
  <text x="28" y="337" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">cat /sys/fs/cgroup/host01/memory.max</tspan></text>
  <rect x="22" y="343" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="358" xml:space="preserve" style="white-space:pre" fill="#88c0ff">3221225472</text>
  <text x="28" y="379" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="400" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 把当前 shell 搬进去;之后它起的所有进程都生在沙箱里</text>
  <text x="28" y="421" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">echo $$ &gt; /sys/fs/cgroup/host01/cgroup.procs</tspan></text>
  <text x="28" y="442" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">cat /proc/self/cgroup</tspan></text>
  <rect x="22" y="448" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="463" xml:space="preserve" style="white-space:pre" fill="#88c0ff">0::/host01</text>
  <text x="28" y="484" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">nproc</tspan></text>
  <text x="28" y="505" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">4</text>
  <text x="600.0" y="550" text-anchor="middle" fill="#5c6675" font-size="11">实跑留档 2026-11-13 · Lima 虚拟机 cg · 日志原文 src/logs/env.log · 提示符由留档脚本打印,命令与输出为真实执行结果</text>
</svg>
