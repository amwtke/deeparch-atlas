  <text x="600.0" y="781" text-anchor="middle" fill="#5c6675" font-size="11">实跑留档 2026-11-13 · Lima 虚拟机 cg · 日志原文 src/logs/ulimit.log · 提示符由留档脚本打印,命令与输出为真实执行结果</text>
