  <text x="600.0" y="30" text-anchor="middle" fill="#8892a0" font-size="13">limactl shell cg — root@lima-cg(Ubuntu 26.04.1 · Linux 7.0.0-38 · 4 核 8G)· 沙箱组 host01</text>
  <text x="28" y="64" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">cat db.py | head -5</tspan></text>
  <text x="28" y="85" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"># 扮演 mysqld 的替身:4 个「连接」进程,各自不停地做查询;一次查询 = 一小段定量的纯计算</text>
  <text x="28" y="106" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">import os, time</text>
  <text x="28" y="127" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">CONN = 4            # 4 个连接</text>
  <text x="28" y="148" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">DUR = 8             # 跑 8 秒</text>
  <text x="28" y="169" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">K = 270000          # 一次查询 = 27 万次乘加,本机独占一颗核时约 5 ms</text>
  <text x="28" y="190" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="211" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 1. 只有 db-sim 在跑</text>
  <text x="28" y="232" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">python3 db.py</tspan></text>
  <rect x="22" y="238" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="253" xml:space="preserve" style="white-space:pre" fill="#88c0ff">查询 5518 次(690 次/秒)  平均 5.8 ms  p99 7.7 ms</text>
  <rect x="22" y="259" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="274" xml:space="preserve" style="white-space:pre" fill="#88c0ff">这段时间的 CPU:db-sim×4 合计 398%</text>
  <text x="28" y="295" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="316" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 2. report 起 8 个 worker,db-sim 再跑一遍</text>
  <text x="28" y="337" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">python3 report.py cpu 8 &amp;</tspan></text>
  <text x="28" y="358" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">python3 db.py</tspan></text>
  <rect x="22" y="364" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
