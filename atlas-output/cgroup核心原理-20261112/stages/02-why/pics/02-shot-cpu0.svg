  <rect x="22" y="385" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="400" xml:space="preserve" style="white-space:pre" fill="#88c0ff">这段时间的 CPU:db-sim×4 合计 132%   report-w×8 合计 266%</text>
  <text x="600.0" y="445" text-anchor="middle" fill="#5c6675" font-size="11">实跑留档 2026-11-13 · Lima 虚拟机 cg · 日志原文 src/logs/cpu0.log · 提示符由留档脚本打印,命令与输出为真实执行结果</text>
