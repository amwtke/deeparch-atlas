  <text x="28" y="904" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="925" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 4. 换成程序自己申请的内存(匿名页,这台机器没有 swap):db 占 700M,report 要 600M</text>
  <text x="28" y="946" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo 1 &gt; /proc/sys/vm/drop_caches</tspan></text>
  <text x="28" y="967" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup db python3 hold.py db-sim 700 &amp;</tspan></text>
