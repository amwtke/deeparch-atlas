  <text x="28" y="169" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="190" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 1. 先试按比例:内存有没有 weight 这个旋钮</text>
  <text x="28" y="211" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">ls /sys/fs/cgroup/host01/db/ | grep -E &#x27;^(cpu|memory)\.(weight|max|high|low|min)$&#x27;</tspan></text>
