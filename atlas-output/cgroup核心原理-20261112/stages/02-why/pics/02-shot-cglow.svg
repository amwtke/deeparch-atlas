  <text x="28" y="631" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 3. 清掉页缓存,给 db 组 memory.low = 700M,同样的顺序再来一遍</text>
  <text x="28" y="652" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo 1 &gt; /proc/sys/vm/drop_caches</tspan></text>
  <text x="28" y="673" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo 700M &gt; /sys/fs/cgroup/host01/db/memory.low</tspan></text>
  <text x="28" y="694" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup db cat /var/tmp/db.dat &gt; /dev/null</tspan></text>
