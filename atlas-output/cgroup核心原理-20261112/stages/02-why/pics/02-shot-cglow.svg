  <text x="28" y="358" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="379" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 2. 不设保护:db 先把自己的 700M 数据文件读进页缓存,然后 report 也读 700M</text>
  <text x="28" y="400" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup db cat /var/tmp/db.dat &gt; /dev/null</tspan></text>
  <text x="28" y="421" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./memof</tspan></text>
  <rect x="22" y="427" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
