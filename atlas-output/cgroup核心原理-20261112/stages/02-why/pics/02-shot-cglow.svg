  <text x="28" y="106" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">ls -l --block-size=M /var/tmp/db.dat /var/tmp/rep.dat | awk &#x27;{print $5, $9}&#x27;</tspan></text>
