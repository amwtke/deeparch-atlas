  <text x="28" y="232" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 2. 普通用户 lima 在 report 组里:想把自己挪去 db 组,想改自己组的上限</text>
  <text x="28" y="253" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup report runuser -u lima -- bash -c &#x27;echo $$ &gt; /sys/fs/cgroup/host01/db/cgroup.procs&#x27;</tspan></text>
  <rect x="22" y="259" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="274" xml:space="preserve" style="white-space:pre" fill="#88c0ff">bash: line 1: /sys/fs/cgroup/host01/db/cgroup.procs: Permission denied</text>
  <text x="28" y="295" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup report runuser -u lima -- bash -c &#x27;echo max &gt; /sys/fs/cgroup/host01/report/cpu.max&#x27;</tspan></text>
  <rect x="22" y="301" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="316" xml:space="preserve" style="white-space:pre" fill="#88c0ff">bash: line 1: /sys/fs/cgroup/host01/report/cpu.max: Permission denied</text>
  <text x="28" y="337" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">ls -l /sys/fs/cgroup/host01/report/cgroup.procs /sys/fs/cgroup/host01/report/cpu.max</tspan></text>
  <text x="28" y="358" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">-rw-r--r-- 1 root root 0 Nov 13 18:39 /sys/fs/cgroup/host01/report/cgroup.procs</text>
  <text x="28" y="379" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">-rw-r--r-- 1 root root 0 Nov 13 18:39 /sys/fs/cgroup/host01/report/cpu.max</text>
  <text x="28" y="400" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="421" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 3. 按组一次杀光,一个不漏</text>
