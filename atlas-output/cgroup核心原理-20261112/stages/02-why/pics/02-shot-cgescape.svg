  <text x="600.0" y="30" text-anchor="middle" fill="#8892a0" font-size="13">limactl shell cg — root@lima-cg(Ubuntu 26.04.1 · Linux 7.0.0-38 · 4 核 8G)· 沙箱组 host01</text>
  <text x="28" y="64" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 1. 同一个作业放进 report 组:setsid 换得了会话,换不了组</text>
  <text x="28" y="85" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup report setsid bash -c &#x27;sleep 301 &amp; sleep 302 &amp; setsid sleep 303 &amp; wait&#x27; &amp;</tspan></text>
