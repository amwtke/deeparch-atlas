<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 593" font-family="JetBrains Mono, Consolas, monospace" font-size="14">
  <rect width="1200" height="593" fill="#0a0c10"/>
  <rect x="8" y="8" width="1184" height="577" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M8,42 L1192,42" stroke="#30363d"/>
  <circle cx="30" cy="25" r="6" fill="#ff5f56"/><circle cx="50" cy="25" r="6" fill="#ffbd2e"/><circle cx="70" cy="25" r="6" fill="#27c93f"/>
  <text x="600.0" y="30" text-anchor="middle" fill="#8892a0" font-size="13">limactl shell cg — root@lima-cg(Ubuntu 26.04.1 · Linux 7.0.0-38 · 4 核 8G)· 沙箱组 host01</text>
  <text x="28" y="64" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 1. v2 只认进程:把副线程的 tid 写进 cgroup.procs,整个进程一起搬</text>
  <text x="28" y="85" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">python3 two_threads.py &amp;</tspan></text>
  <text x="28" y="106" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">进程 pid = 45927(主线程的 tid 也是它)</text>
  <text x="28" y="127" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">副线程 tid = 45929</text>
  <text x="28" y="148" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">echo 45929 &gt; /sys/fs/cgroup/host01/report/cgroup.procs</tspan></text>
  <text x="28" y="169" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">grep -H . /proc/45927/task/*/cgroup</tspan></text>
  <rect x="22" y="175" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="190" xml:space="preserve" style="white-space:pre" fill="#88c0ff">/proc/45927/task/45927/cgroup:0::/host01/report</text>
  <rect x="22" y="196" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="211" xml:space="preserve" style="white-space:pre" fill="#88c0ff">/proc/45927/task/45929/cgroup:0::/host01/report</text>
  <text x="28" y="232" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="253" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 2. v2 不许「组里有进程、同时又给子组分资源」</text>
  <text x="28" y="274" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">mkdir -p /sys/fs/cgroup/host01/db/sub</tspan></text>
  <text x="28" y="295" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">echo $$ &gt; /sys/fs/cgroup/host01/db/cgroup.procs</tspan></text>
  <text x="28" y="316" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">echo +memory &gt; /sys/fs/cgroup/host01/db/cgroup.subtree_control</tspan></text>
  <rect x="22" y="322" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="337" xml:space="preserve" style="white-space:pre" fill="#88c0ff">bash: line 19: echo: write error: Device or resource busy</text>
  <text x="28" y="358" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="379" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 把进程挪到叶子上,再开就可以了</text>
  <text x="28" y="400" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">echo $$ &gt; /sys/fs/cgroup/host01/db/sub/cgroup.procs</tspan></text>
  <text x="28" y="421" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">echo +memory &gt; /sys/fs/cgroup/host01/db/cgroup.subtree_control &amp;&amp; echo 成功</tspan></text>
  <rect x="22" y="427" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="442" xml:space="preserve" style="white-space:pre" fill="#88c0ff">成功</text>
  <text x="28" y="463" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="484" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 反过来:已经给子组分资源的组,不再收进程</text>
  <text x="28" y="505" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">echo $$ &gt; /sys/fs/cgroup/host01/db/cgroup.procs</tspan></text>
  <rect x="22" y="511" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="526" xml:space="preserve" style="white-space:pre" fill="#88c0ff">bash: line 19: echo: write error: Device or resource busy</text>
  <text x="600.0" y="571" text-anchor="middle" fill="#5c6675" font-size="11">实跑留档 2026-11-13 · Lima 虚拟机 cg · 日志原文 src/logs/v2rule.log · 提示符由留档脚本打印,命令与输出为真实执行结果</text>
</svg>
