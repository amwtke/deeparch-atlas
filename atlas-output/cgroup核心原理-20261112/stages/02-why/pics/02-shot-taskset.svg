  <text x="28" y="190" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="211" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 2. report 由普通用户 lima 来跑,worker 里多了一行 sched_setaffinity</text>
  <text x="28" y="232" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg:/tmp# </tspan><tspan fill="#e0e6f0">runuser -u lima -- taskset -c 3 python3 report.py cpu 8 unpin &amp;</tspan></text>
