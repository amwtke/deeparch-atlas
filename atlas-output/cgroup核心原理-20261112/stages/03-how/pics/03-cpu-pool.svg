<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="640" fill="#0a0c10"/>
  <text x="600" y="34" text-anchor="middle" fill="#e0e6f0" font-size="20">CPU 的账:一个全组总额度 + 每颗核一份本地额度</text>
  <text x="600" y="56" text-anchor="middle" fill="#8892a0" font-size="12">report 组,cpu.max = 50000 100000,7 个 worker 落在 4 颗核上(1 / 1 / 2 / 3)。数字取自实跑留档 t3</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c08040"/></marker>
  </defs>

  <!-- pool -->
  <rect x="380" y="78" width="440" height="66" fill="#5f3a1e" stroke="#c08040" stroke-width="2"/>
  <text x="600" y="100" text-anchor="middle" fill="#ffaa55" font-size="14">report 组的总额度(全组一个,带锁)</text>
  <text x="600" y="120" text-anchor="middle" fill="#e0e6f0" font-size="12">周期定时器每 100 ms 把它补到 50 ms</text>
  <text x="600" y="136" text-anchor="middle" fill="#8892a0" font-size="10">(内核里:task_group 上的 cfs_bandwidth.runtime)</text>

  <!-- arrows pool -> cores -->
  <g stroke="#c08040" stroke-width="1.3" stroke-dasharray="6,4" fill="none" marker-end="url(#a1)">
    <path d="M440,144 L170,196"/>
    <path d="M540,144 L450,196"/>
    <path d="M660,144 L750,196"/>
    <path d="M760,144 L1030,196"/>
  </g>
  <text x="600" y="176" text-anchor="middle" fill="#ffaa55" font-size="12">本地额度用完才来领,一次领 5 ms,先到先得</text>

  <!-- 4 cores -->
  <g font-size="11">
    <!-- core 0 -->
    <rect x="40" y="198" width="260" height="170" fill="none" stroke="#30363d"/>
    <text x="52" y="216" fill="#8892a0" font-size="12">核 0</text>
    <rect x="52" y="226" width="236" height="40" fill="#5f3a1e" stroke="#c08040"/>
    <text x="170" y="243" text-anchor="middle" fill="#ffaa55">report 组在这颗核上的本地额度</text>
    <text x="170" y="258" text-anchor="middle" fill="#e0e6f0">这个周期共领到约 12 ms</text>
    <rect x="52" y="278" width="236" height="26" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="170" y="295" text-anchor="middle" fill="#88c0ff">worker 7538</text>
    <text x="170" y="352" text-anchor="middle" fill="#88ff88" font-size="13">1 个进程:12.3%</text>

    <!-- core 1 -->
    <rect x="320" y="198" width="260" height="170" fill="none" stroke="#30363d"/>
    <text x="332" y="216" fill="#8892a0" font-size="12">核 1</text>
    <rect x="332" y="226" width="236" height="40" fill="#5f3a1e" stroke="#c08040"/>
    <text x="450" y="243" text-anchor="middle" fill="#ffaa55">本地额度</text>
    <text x="450" y="258" text-anchor="middle" fill="#e0e6f0">约 12 ms</text>
    <rect x="332" y="278" width="236" height="26" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="450" y="295" text-anchor="middle" fill="#88c0ff">worker 7539</text>
    <text x="450" y="352" text-anchor="middle" fill="#88ff88" font-size="13">1 个进程:12.3%</text>

    <!-- core 2 -->
    <rect x="600" y="198" width="260" height="170" fill="none" stroke="#30363d"/>
    <text x="612" y="216" fill="#8892a0" font-size="12">核 2</text>
    <rect x="612" y="226" width="236" height="40" fill="#5f3a1e" stroke="#c08040"/>
    <text x="730" y="243" text-anchor="middle" fill="#ffaa55">本地额度</text>
    <text x="730" y="258" text-anchor="middle" fill="#e0e6f0">约 12 ms</text>
    <rect x="612" y="278" width="114" height="26" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="669" y="295" text-anchor="middle" fill="#88c0ff">7537</text>
    <rect x="734" y="278" width="114" height="26" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="791" y="295" text-anchor="middle" fill="#88c0ff">7541</text>
    <text x="730" y="352" text-anchor="middle" fill="#88ff88" font-size="13">2 个进程:各 6.0%</text>

    <!-- core 3 -->
    <rect x="880" y="198" width="280" height="170" fill="none" stroke="#30363d"/>
    <text x="892" y="216" fill="#8892a0" font-size="12">核 3</text>
    <rect x="892" y="226" width="256" height="40" fill="#5f3a1e" stroke="#c08040"/>
    <text x="1020" y="243" text-anchor="middle" fill="#ffaa55">本地额度</text>
    <text x="1020" y="258" text-anchor="middle" fill="#e0e6f0">约 12 ms</text>
    <rect x="892" y="278" width="80" height="26" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="932" y="295" text-anchor="middle" fill="#88c0ff">7536</text>
    <rect x="980" y="278" width="80" height="26" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="1020" y="295" text-anchor="middle" fill="#88c0ff">7540</text>
    <rect x="1068" y="278" width="80" height="26" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="1108" y="295" text-anchor="middle" fill="#88c0ff">7542</text>
    <text x="1020" y="352" text-anchor="middle" fill="#88ff88" font-size="13">3 个进程:各 4.0%</text>
  </g>
  <text x="1160" y="386" text-anchor="end" fill="#8892a0" font-size="11">同一颗核上的 worker 轮流用这颗核上的本地额度,所以核上进程越多,每个进程分到的越少</text>

  <!-- timeline -->
  <text x="40" y="402" fill="#e0e6f0" font-size="14">一个周期(100 ms)里发生的事,四颗核各一条</text>
  <!-- axis: x from 100 to 1140 = 1040px for 100ms => 10.4 px/ms -->
  <g font-size="11">
    <line x1="100" y1="540" x2="1140" y2="540" stroke="#8892a0"/>
    <g stroke="#8892a0">
      <line x1="100" y1="540" x2="100" y2="546"/><line x1="204" y1="540" x2="204" y2="546"/>
      <line x1="308" y1="540" x2="308" y2="546"/><line x1="620" y1="540" x2="620" y2="546"/>
      <line x1="1140" y1="540" x2="1140" y2="546"/>
    </g>
    <text x="100" y="560" text-anchor="middle" fill="#8892a0">0 ms</text>
    <text x="204" y="560" text-anchor="middle" fill="#8892a0">10</text>
    <text x="308" y="560" text-anchor="middle" fill="#8892a0">20</text>
    <text x="620" y="560" text-anchor="middle" fill="#8892a0">50</text>
    <text x="1140" y="560" text-anchor="middle" fill="#8892a0">100.86</text>

    <!-- core rows: run segments (blue), stopped (red-ish hatch) -->
    <text x="60" y="431" fill="#8892a0">核 0</text>
    <rect x="100" y="418" width="116.6" height="20" fill="#1e3a5f" stroke="#4080c0"/>
    <rect x="216.6" y="418" width="923.4" height="20" fill="#5f1e1e" stroke="#c04040" opacity="0.55"/>
    <text x="60" y="459" fill="#8892a0">核 1</text>
    <rect x="100" y="446" width="127" height="20" fill="#1e3a5f" stroke="#4080c0"/>
    <rect x="227" y="446" width="913" height="20" fill="#5f1e1e" stroke="#c04040" opacity="0.55"/>
    <text x="60" y="487" fill="#8892a0">核 2</text>
    <rect x="100" y="474" width="168.6" height="20" fill="#1e3a5f" stroke="#4080c0"/>
    <rect x="268.6" y="474" width="871.4" height="20" fill="#5f1e1e" stroke="#c04040" opacity="0.55"/>
    <text x="60" y="515" fill="#8892a0">核 3</text>
    <rect x="100" y="502" width="116.6" height="20" fill="#1e3a5f" stroke="#4080c0"/>
    <rect x="216.6" y="502" width="923.4" height="20" fill="#5f1e1e" stroke="#c04040" opacity="0.55"/>

    <text x="158" y="432" text-anchor="middle" fill="#88c0ff">跑</text>
    <text x="680" y="432" text-anchor="middle" fill="#ff8888">11.21 ms 起:限流中,这颗核上 report 的进程都在等候名单上</text>
    <text x="680" y="460" text-anchor="middle" fill="#ff8888">12.21 ms 起</text>
    <text x="700" y="488" text-anchor="middle" fill="#ff8888">16.21 ms 起(最后领到一份 5 ms,多跑了一会儿)</text>
    <text x="680" y="516" text-anchor="middle" fill="#ff8888">11.21 ms 起</text>
  </g>
  <!-- markers -->
  <line x1="100" y1="408" x2="100" y2="540" stroke="#40c060" stroke-width="1.5"/>
  <line x1="1140" y1="408" x2="1140" y2="540" stroke="#40c060" stroke-width="1.5"/>
  <text x="104" y="578" fill="#88ff88" font-size="11">▲ 定时器触发:总额度补到 50 ms,四颗核解除限流</text>
  <text x="1136" y="578" text-anchor="end" fill="#88ff88" font-size="11">下一次定时器触发 ▲</text>

  <!-- bottom band -->
  <rect x="30" y="590" width="1140" height="36" rx="6" fill="#5f3a1e" stroke="#c08040"/>
  <text x="600" y="613" text-anchor="middle" fill="#ffaa55" font-size="13">4 颗核一起消耗 50 ms,十来毫秒就用完,剩下八十多毫秒整组都停着;额度是按核领的,不是按进程发的</text>
</svg>
