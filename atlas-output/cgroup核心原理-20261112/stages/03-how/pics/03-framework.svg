<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="660" fill="#0a0c10"/>
  <text x="600" y="34" text-anchor="middle" fill="#e0e6f0" font-size="20">cgroup 是一个公共框架:公共的部分只做一遍,每种资源是一个插件</text>
  <text x="600" y="56" text-anchor="middle" fill="#8892a0" font-size="12">这台内核认识 9 个控制器:cpuset cpu io memory hugetlb pids rdma misc dmem(实测 cgroup.controllers)</text>

  <defs>
    <marker id="f1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8040c0"/></marker>
  </defs>

  <!-- core -->
  <rect x="30" y="76" width="1140" height="150" rx="6" fill="none" stroke="#8040c0" stroke-width="2"/>
  <text x="46" y="98" fill="#c088ff" font-size="14">核心(和具体资源无关,只做一遍)</text>
  <g font-size="11">
    <rect x="46" y="110" width="262" height="100" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="177" y="130" text-anchor="middle" fill="#c088ff" font-size="13">① 树</text>
    <text x="177" y="152" text-anchor="middle" fill="#e0e6f0">目录 = 组,mkdir 建组</text>
    <text x="177" y="170" text-anchor="middle" fill="#e0e6f0">父组决定往下开哪些控制器</text>
    <text x="177" y="188" text-anchor="middle" fill="#e0e6f0">(cgroup.subtree_control)</text>
    <text x="177" y="204" text-anchor="middle" fill="#8892a0" font-size="10">C1·按组限制合计用量</text>

    <rect x="322" y="110" width="262" height="100" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="453" y="130" text-anchor="middle" fill="#c088ff" font-size="13">② 组籍</text>
    <text x="453" y="152" text-anchor="middle" fill="#e0e6f0">进程身上一个指针</text>
    <text x="453" y="170" text-anchor="middle" fill="#e0e6f0">组籍里每个控制器一个格子</text>
    <text x="453" y="188" text-anchor="middle" fill="#e0e6f0">fork 继承,进程自己改不了</text>
    <text x="453" y="204" text-anchor="middle" fill="#8892a0" font-size="10">C1·按组限制合计用量  C3·内核负责执行,配额由外部设定</text>

    <rect x="598" y="110" width="262" height="100" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="729" y="130" text-anchor="middle" fill="#c088ff" font-size="13">③ 文件接口</text>
    <text x="729" y="152" text-anchor="middle" fill="#e0e6f0">每个控制器登记自己的文件</text>
    <text x="729" y="170" text-anchor="middle" fill="#e0e6f0">文件名前缀 = 控制器名</text>
    <text x="729" y="188" text-anchor="middle" fill="#e0e6f0">读写、权限由核心统一处理</text>
    <text x="729" y="204" text-anchor="middle" fill="#8892a0" font-size="10">C3·内核负责执行,配额由外部设定</text>

    <rect x="874" y="110" width="280" height="100" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="1014" y="130" text-anchor="middle" fill="#c088ff" font-size="13">④ 生命周期通知</text>
    <text x="1014" y="152" text-anchor="middle" fill="#e0e6f0">建组 / 删组 → 通知各控制器建账、销账</text>
    <text x="1014" y="170" text-anchor="middle" fill="#e0e6f0">进程入组、fork、退出 → 逐个通知</text>
    <text x="1014" y="188" text-anchor="middle" fill="#e0e6f0">每个控制器填同一张「回调表」</text>
    <text x="1014" y="204" text-anchor="middle" fill="#8892a0" font-size="10">C5·所有资源共用同一套分组</text>
  </g>

  <!-- slot line -->
  <g stroke="#8040c0" stroke-width="1.3" stroke-dasharray="6,4" fill="none" marker-end="url(#f1)">
    <path d="M140,226 L140,262"/><path d="M370,226 L370,262"/><path d="M600,226 L600,262"/><path d="M830,226 L830,262"/><path d="M1060,226 L1060,262"/>
  </g>
  <text x="600" y="250" text-anchor="middle" fill="#c088ff" font-size="12">   每个控制器只回答三个问题:在哪里记账 · 限写成什么 · 超了怎么处置   </text>

  <!-- controllers -->
  <g font-size="11">
    <!-- cpu -->
    <rect x="30" y="264" width="220" height="250" fill="#5f3a1e" stroke="#c08040"/>
    <text x="140" y="286" text-anchor="middle" fill="#ffaa55" font-size="14">cpu</text>
    <text x="42" y="310" fill="#8892a0">在哪里记账</text>
    <text x="42" y="326" fill="#e0e6f0">调度器结算运行时间时</text>
    <text x="42" y="350" fill="#8892a0">限写成什么</text>
    <text x="42" y="366" fill="#e0e6f0">cpu.max  每周期多少微秒</text>
    <text x="42" y="382" fill="#e0e6f0">cpu.weight  抢时的比例</text>
    <text x="42" y="406" fill="#8892a0">超了怎么处置</text>
    <text x="42" y="422" fill="#ff8888">停到下一个周期(等)</text>
    <text x="42" y="452" fill="#8892a0">每核本地额度</text>
    <text x="42" y="468" fill="#e0e6f0">每核 5 ms</text>
    <text x="42" y="498" fill="#88ff88">本节 §4、§7 细讲</text>

    <!-- memory -->
    <rect x="260" y="264" width="220" height="250" fill="#5f3a1e" stroke="#c08040"/>
    <text x="370" y="286" text-anchor="middle" fill="#ffaa55" font-size="14">memory</text>
    <text x="272" y="310" fill="#8892a0">在哪里记账</text>
    <text x="272" y="326" fill="#e0e6f0">内核分出一个物理页时</text>
    <text x="272" y="350" fill="#8892a0">限写成什么</text>
    <text x="272" y="366" fill="#e0e6f0">memory.max  最多多少字节</text>
    <text x="272" y="382" fill="#e0e6f0">memory.low  先别回收我</text>
    <text x="272" y="406" fill="#8892a0">超了怎么处置</text>
    <text x="272" y="422" fill="#ff8888">组内回收 → 组内杀</text>
    <text x="272" y="452" fill="#8892a0">每核本地额度</text>
    <text x="272" y="468" fill="#e0e6f0">每核 64 页</text>
    <text x="272" y="498" fill="#88ff88">本节 §5、§8 细讲</text>

    <!-- io -->
    <rect x="490" y="264" width="220" height="250" fill="#5f3a1e" stroke="#c08040"/>
    <text x="600" y="286" text-anchor="middle" fill="#ffaa55" font-size="14">io</text>
    <text x="502" y="310" fill="#8892a0">在哪里记账</text>
    <text x="502" y="326" fill="#e0e6f0">读写请求交给磁盘之前</text>
    <text x="502" y="350" fill="#8892a0">限写成什么</text>
    <text x="502" y="366" fill="#e0e6f0">io.max  每块盘每秒多少</text>
    <text x="502" y="382" fill="#e0e6f0">字节 / 多少次</text>
    <text x="502" y="406" fill="#8892a0">超了怎么处置</text>
    <text x="502" y="422" fill="#ff8888">请求排队等一会儿(等)</text>
    <text x="502" y="452" fill="#8892a0">实测</text>
    <text x="502" y="468" fill="#e0e6f0">限 10 MiB/s:8 MiB 约 0.8 秒</text>
    <text x="502" y="498" fill="#88ff88">本节 §6;第二节 §9.3</text>

    <!-- pids -->
    <rect x="720" y="264" width="220" height="250" fill="#5f3a1e" stroke="#c08040"/>
    <text x="830" y="286" text-anchor="middle" fill="#ffaa55" font-size="14">pids</text>
    <text x="732" y="310" fill="#8892a0">在哪里记账</text>
    <text x="732" y="326" fill="#e0e6f0">fork 的路上</text>
    <text x="732" y="350" fill="#8892a0">限写成什么</text>
    <text x="732" y="366" fill="#e0e6f0">pids.max  最多多少个</text>
    <text x="732" y="406" fill="#8892a0">超了怎么处置</text>
    <text x="732" y="422" fill="#ff8888">这次 fork 失败(拒绝)</text>
    <text x="732" y="452" fill="#8892a0">实测</text>
    <text x="732" y="468" fill="#e0e6f0">上限 20:第 20 次 fork 被拒</text>
    <text x="732" y="498" fill="#88ff88">本节 §3、§9</text>

    <!-- others -->
    <rect x="950" y="264" width="220" height="250" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="1060" y="286" text-anchor="middle" fill="#88c0ff" font-size="14">其余五个</text>
    <text x="962" y="312" fill="#88c0ff">cpuset</text>
    <text x="962" y="328" fill="#e0e6f0">不记账,只划范围:</text>
    <text x="962" y="344" fill="#e0e6f0">能用哪几颗核、哪些内存节点</text>
    <text x="962" y="370" fill="#88c0ff">hugetlb</text>
    <text x="962" y="386" fill="#e0e6f0">大页的用量上限</text>
    <text x="962" y="412" fill="#88c0ff">rdma / dmem / misc</text>
    <text x="962" y="428" fill="#e0e6f0">RDMA 网卡资源、设备显存</text>
    <text x="962" y="444" fill="#e0e6f0">之类、其他能数个数的资源</text>
    <text x="962" y="474" fill="#8892a0">记账结构相同,本文不展开</text>
    <text x="962" y="498" fill="#8892a0">出处:cgroup-v2 文档</text>
  </g>

  <!-- three verdicts -->
  <rect x="30" y="528" width="1140" height="46" fill="none" stroke="#c04040"/>
  <text x="46" y="548" fill="#ff8888" font-size="12">「超了怎么处置」只有三种,由资源的性质决定:</text>
  <text x="46" y="566" fill="#e0e6f0" font-size="12">会再生的(CPU 时间、IO 带宽)→ 等      能拒绝的(进程数)→ 这次不给      占了不还的(内存)→ 回收,收不动就杀</text>

  <!-- bottom band -->
  <rect x="30" y="588" width="1140" height="56" rx="6" fill="#5f3a1e" stroke="#c08040"/>
  <text x="600" y="610" text-anchor="middle" fill="#ffaa55" font-size="13">可以带走的做法:把「对象怎么分组、怎么继承、怎么暴露接口」做成公共的一层,只做一遍;</text>
  <text x="600" y="630" text-anchor="middle" fill="#ffaa55" font-size="13">每加一种资源,只需要回答「在哪里记、限是什么、超了怎么办」,不用再碰分组这件事</text>
</svg>
