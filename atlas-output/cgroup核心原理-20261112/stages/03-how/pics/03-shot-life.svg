<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 488" font-family="JetBrains Mono, Consolas, monospace" font-size="14">
  <rect width="1200" height="488" fill="#0a0c10"/>
  <rect x="8" y="8" width="1184" height="472" rx="10" fill="#0d1117" stroke="#30363d"/>
