  <text x="28" y="484" xml:space="preserve" style="white-space:pre" fill="#88c0ff">第一笔:提交它的进程是 kworker/u16:4(pid 162205),8388608 字节,这笔请求记在 report 组头上。当时的调用栈:</text>
