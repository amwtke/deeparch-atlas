  <text x="28" y="883" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 3. 对照:去掉上限,同样的事再做一遍</text>
  <text x="28" y="904" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo &#x27;253:0 wbps=max&#x27; &gt; /sys/fs/cgroup/host01/report/io.max</tspan></text>
  <text x="28" y="925" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">bpftrace t10-wb.bt &gt; wb2.out 2&gt;&amp;1 &amp;</tspan></text>
  <text x="28" y="946" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup report python3 bufwrite.py 30 &amp;</tspan></text>
