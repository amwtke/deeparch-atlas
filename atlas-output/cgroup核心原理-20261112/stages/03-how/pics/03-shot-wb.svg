  <text x="28" y="463" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">grep -v -e Attached -e bpf_ -e &#x27;^$&#x27; wb1.out | sed -E &#x27;s/^\t[0-9a-f]+ ([^+]+)\+[0-9]+$/             \1/&#x27;</tspan></text>
