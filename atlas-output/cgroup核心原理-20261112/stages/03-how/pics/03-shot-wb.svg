  <text x="600.0" y="30" text-anchor="middle" fill="#8892a0" font-size="13">limactl shell cg-lab — root@lima-cg-lab(Ubuntu 26.04.1 · Linux 7.0.0-38 · 4 核 4G,专用实验机)· 沙箱组 host01</text>
  <text x="28" y="64" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 1. report 组限每秒写 10 MiB。组里的一个进程带缓冲地写 30 MiB:不 fsync,也不关文件</text>
  <text x="28" y="85" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo &#x27;253:0 wbps=10485760&#x27; &gt; /sys/fs/cgroup/host01/report/io.max</tspan></text>
  <text x="28" y="106" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">bpftrace t10-wb.bt &gt; wb1.out 2&gt;&amp;1 &amp;</tspan></text>
  <text x="28" y="127" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup report python3 bufwrite.py 30 &amp;</tspan></text>
  <text x="28" y="148" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">bufwrite(pid 162472)写完 30 MiB,文件没关,也没 fsync</text>
  <text x="28" y="169" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">cat /sys/fs/cgroup/host01/report/io.stat; grep -E &#x27;^file_dirty&#x27; /sys/fs/cgroup/host01/report/memory.stat</tspan></text>
  <text x="28" y="190" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">253:0 </text>
  <rect x="22" y="196" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="211" xml:space="preserve" style="white-space:pre" fill="#88c0ff">file_dirty 31457280</text>
  <text x="28" y="232" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="253" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 2. 在组外(本终端的 shell 不在 report 组里)催内核把脏页写到盘上,看要多久</text>
  <text x="28" y="274" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">cat /proc/self/cgroup; time sync</tspan></text>
  <text x="28" y="295" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">0::/user.slice/user-502.slice/session-6.scope</text>
