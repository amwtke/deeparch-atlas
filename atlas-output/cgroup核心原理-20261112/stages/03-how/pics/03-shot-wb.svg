  <text x="28" y="400" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">cat /sys/fs/cgroup/host01/report/io.stat; grep -E &#x27;^file_dirty&#x27; /sys/fs/cgroup/host01/report/memory.stat</tspan></text>
