  <text x="600.0" y="30" text-anchor="middle" fill="#8892a0" font-size="13">limactl shell cg-lab — root@lima-cg-lab(Ubuntu 26.04.1 · Linux 7.0.0-38 · 4 核 4G,专用实验机)· 沙箱组 host01</text>
  <text x="28" y="64" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 1. report 组最多 20 个进程;在组里连续 fork 100 个</text>
  <text x="28" y="85" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo 20 &gt; /sys/fs/cgroup/host01/report/pids.max</tspan></text>
  <text x="28" y="106" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">bpftrace t6-pids.bt &gt; t6.out 2&gt;&amp;1 &amp;</tspan></text>
  <text x="28" y="127" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup report python3 forkn.py 100</tspan></text>
  <rect x="22" y="133" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="148" xml:space="preserve" style="white-space:pre" fill="#88c0ff">第 20 次 fork 失败:[Errno 11] Resource temporarily unavailable</text>
  <rect x="22" y="154" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="169" xml:space="preserve" style="white-space:pre" fill="#88c0ff">想要 100 个子进程,成功 fork 出 19 个</text>
  <text x="28" y="190" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">grep -v -e Attached -e &#x27;^$&#x27; t6.out</tspan></text>
  <rect x="22" y="196" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="211" xml:space="preserve" style="white-space:pre" fill="#88c0ff">放行  pid 9104 要 fork:report 组的进程数账 → 2(上限 20)   父组 host01 的账 → 2</text>
  <rect x="22" y="217" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="232" xml:space="preserve" style="white-space:pre" fill="#88c0ff">放行  pid 9104 要 fork:report 组的进程数账 → 3(上限 20)   父组 host01 的账 → 3</text>
  <rect x="22" y="238" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="253" xml:space="preserve" style="white-space:pre" fill="#88c0ff">放行  pid 9104 要 fork:report 组的进程数账 → 4(上限 20)   父组 host01 的账 → 4</text>
  <rect x="22" y="259" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="274" xml:space="preserve" style="white-space:pre" fill="#88c0ff">拒绝  pid 9104 要 fork:report 组的进程数账 20,上限 20,再加 1 就超 → fork 失败(返回 -11)</text>
  <rect x="22" y="280" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="295" xml:space="preserve" style="white-space:pre" fill="#88c0ff">pids 控制器一共被问了 20 次</text>
  <text x="28" y="316" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">grep -H . /sys/fs/cgroup/host01/report/pids.peak /sys/fs/cgroup/host01/report/pids.events</tspan></text>
  <rect x="22" y="322" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="337" xml:space="preserve" style="white-space:pre" fill="#88c0ff">/sys/fs/cgroup/host01/report/pids.peak:20</text>
  <rect x="22" y="343" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="358" xml:space="preserve" style="white-space:pre" fill="#88c0ff">/sys/fs/cgroup/host01/report/pids.events:max 1</text>
  <text x="600.0" y="403" text-anchor="middle" fill="#5c6675" font-size="11">实跑留档 2026-11-14 · Lima 虚拟机 cg-lab · 日志原文 src/logs/pids.log · 提示符由留档脚本打印,命令与输出为真实执行结果</text>
