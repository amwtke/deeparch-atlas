  <text x="28" y="568" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 3. 抽查这个 worker 的内存页:每一页记在谁头上</text>
  <text x="28" y="589" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">python3 pageowner.py $(pgrep -x report-w) /sys/fs/cgroup/host01/report</tspan></text>
