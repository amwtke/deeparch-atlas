  <text x="28" y="421" xml:space="preserve" style="white-space:pre" fill="#88c0ff">[64, 96)             400 |@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@|</text>
  <text x="28" y="442" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="463" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 2. 组的账(字节)</text>
  <text x="28" y="484" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">cat /sys/fs/cgroup/host01/report/memory.current /sys/fs/cgroup/host01/memory.current</tspan></text>
