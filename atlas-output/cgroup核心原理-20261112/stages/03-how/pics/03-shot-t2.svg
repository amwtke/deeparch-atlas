  <text x="28" y="379" xml:space="preserve" style="white-space:pre" fill="#88c0ff">真正去改 report 组那本账 400 次,共 25600 页;每次改多少页:</text>
  <text x="28" y="400" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">@batch:</text>
