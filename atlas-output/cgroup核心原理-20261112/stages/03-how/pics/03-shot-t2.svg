  <text x="600.0" y="30" text-anchor="middle" fill="#8892a0" font-size="13">limactl shell cg-lab — root@lima-cg-lab(Ubuntu 26.04.1 · Linux 7.0.0-38 · 4 核 4G,专用实验机)· 沙箱组 host01</text>
  <text x="28" y="64" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 0. 为了让页数好数,先关掉透明大页(否则一次缺页可能直接给 512 页)</text>
  <text x="28" y="85" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">cat /sys/kernel/mm/transparent_hugepage/enabled</tspan></text>
  <text x="28" y="106" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">always madvise [never]</text>
  <text x="28" y="127" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="148" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 1. report 组内存上限 300M;挂上跟踪脚本,让一个 worker 吃 100 MiB</text>
  <text x="28" y="169" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo 300M &gt; /sys/fs/cgroup/host01/report/memory.max</tspan></text>
  <text x="28" y="190" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">bpftrace t2-memacct.bt &gt; t2.out 2&gt;&amp;1 &amp;</tspan></text>
  <text x="28" y="211" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup report python3 hold.py report-w 100 &amp;</tspan></text>
  <text x="28" y="232" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">report-w(pid 8124)已占住 100 MiB</text>
  <text x="28" y="253" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">grep -v -e Attached -e &#x27;^$&#x27; t2.out</tspan></text>
  <rect x="22" y="259" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="274" xml:space="preserve" style="white-space:pre" fill="#88c0ff">第 1 次改账(+64 页):report 959 → 1023 页   父组 host01 1023 → 1087 页   根 165161 → 165225 页</text>
  <rect x="22" y="280" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="295" xml:space="preserve" style="white-space:pre" fill="#88c0ff">第 2 次改账(+64 页):report 1023 → 1087 页   父组 host01 1087 → 1151 页   根 165225 → 165289 页</text>
  <rect x="22" y="301" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="316" xml:space="preserve" style="white-space:pre" fill="#88c0ff">第 3 次改账(+64 页):report 1087 → 1151 页   父组 host01 1151 → 1215 页   根 165289 → 165353 页</text>
