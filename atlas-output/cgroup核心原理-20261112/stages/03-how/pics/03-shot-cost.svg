  <text x="600.0" y="30" text-anchor="middle" fill="#8892a0" font-size="13">limactl shell cg-lab — root@lima-cg-lab(Ubuntu 26.04.1 · Linux 7.0.0-38 · 4 核 4G,专用实验机)· 沙箱组 host01</text>
  <text x="28" y="64" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">cat load.sh</tspan></text>
  <text x="28" y="85" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">#!/bin/sh</text>
  <text x="28" y="106" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"># load.sh:db 组、report 组、根组里各有一个进程吃 40 MiB 内存;db 组和 report 组各直接写 20 MiB 到盘</text>
  <text x="28" y="127" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">./ingroup db python3 eat.py 40</text>
  <text x="28" y="148" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">./ingroup report python3 eat.py 40</text>
  <text x="28" y="169" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">sh -c &#x27;echo $$ &gt; /sys/fs/cgroup/cgroup.procs; exec python3 eat.py 40&#x27;</text>
  <text x="28" y="190" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">./ingroup db dd if=/dev/zero of=/var/tmp/c1.tmp bs=1M count=20 oflag=direct status=none</text>
  <text x="28" y="211" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">./ingroup report dd if=/dev/zero of=/var/tmp/c2.tmp bs=1M count=20 oflag=direct status=none</text>
  <text x="28" y="232" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="253" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 1. 两个组什么上限都没写</text>
  <text x="28" y="274" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">cd /sys/fs/cgroup/host01 &amp;&amp; grep -H . db/cpu.max db/memory.max report/cpu.max report/memory.max; cat db/io.max r</tspan></text>
  <text x="28" y="295" xml:space="preserve" style="white-space:pre" fill="#e0e6f0">eport/io.max; cd /tmp</text>
  <text x="28" y="316" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">db/cpu.max:max 100000</text>
  <text x="28" y="337" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">db/memory.max:max</text>
  <text x="28" y="358" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">report/cpu.max:max 100000</text>
  <text x="28" y="379" xml:space="preserve" style="white-space:pre" fill="#a8b3c2">report/memory.max:max</text>
  <text x="28" y="400" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">bpftrace t9-cost.bt &gt; cost1.out 2&gt;&amp;1 &amp;</tspan></text>
  <text x="28" y="421" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./load.sh</tspan></text>
  <text x="28" y="442" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">grep -v -e Attached -e &#x27;^$&#x27; cost1.out</tspan></text>
  <rect x="22" y="448" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
