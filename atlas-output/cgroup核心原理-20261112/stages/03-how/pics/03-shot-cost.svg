  <text x="28" y="778" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 2. 只给 report 写上三个上限,db 还是什么都不写</text>
  <text x="28" y="799" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo &#x27;50000 100000&#x27; &gt; /sys/fs/cgroup/host01/report/cpu.max</tspan></text>
  <text x="28" y="820" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo 300M &gt; /sys/fs/cgroup/host01/report/memory.max</tspan></text>
  <text x="28" y="841" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo &#x27;253:0 wbps=104857600&#x27; &gt; /sys/fs/cgroup/host01/report/io.max</tspan></text>
  <text x="28" y="862" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">bpftrace t9-cost.bt &gt; cost2.out 2&gt;&amp;1 &amp;</tspan></text>
  <text x="28" y="883" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./load.sh</tspan></text>
