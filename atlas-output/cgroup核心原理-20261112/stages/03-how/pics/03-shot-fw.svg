  <text x="28" y="442" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 3. 再开 cpu、memory、io</text>
  <text x="28" y="463" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo &#x27;+cpu +memory +io&#x27; &gt; /sys/fs/cgroup/host01/cgroup.subtree_control</tspan></text>
  <text x="28" y="484" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">ls /sys/fs/cgroup/host01/demo | cut -d. -f1 | sort | uniq -c | xargs</tspan></text>
