  <text x="28" y="169" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="190" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 1. 建 host01 和它的子组 demo;host01 先不往下开任何控制器。数一数 demo 目录里各种前缀的文件</text>
  <text x="28" y="211" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">mkdir -p /sys/fs/cgroup/host01/demo</tspan></text>
  <text x="28" y="232" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">ls /sys/fs/cgroup/host01/demo | cut -d. -f1 | sort | uniq -c | xargs</tspan></text>
  <rect x="22" y="238" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="253" xml:space="preserve" style="white-space:pre" fill="#88c0ff">13 cgroup 3 cpu 1 io 1 memory</text>
  <text x="28" y="274" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">bpftrace t5-framework.bt &gt; t5.out 2&gt;&amp;1 &amp;</tspan></text>
  <text x="28" y="295" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup demo python3 ticker.py &amp;</tspan></text>
  <text x="28" y="316" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
  <text x="28" y="337" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 2. 在 host01 上往下开 pids 控制器</text>
  <text x="28" y="358" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">echo &#x27;+pids&#x27; &gt; /sys/fs/cgroup/host01/cgroup.subtree_control</tspan></text>
  <text x="28" y="379" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">ls /sys/fs/cgroup/host01/demo | cut -d. -f1 | sort | uniq -c | xargs</tspan></text>
  <rect x="22" y="385" width="1156" height="21" fill="#1e3a5f" opacity="0.55"/>
  <text x="28" y="400" xml:space="preserve" style="white-space:pre" fill="#88c0ff">13 cgroup 3 cpu 1 io 1 memory 5 pids</text>
