  <text x="28" y="547" xml:space="preserve" style="white-space:pre" fill="#ffaa55">### 4. 再搬一个进程进 demo</text>
  <text x="28" y="568" xml:space="preserve" style="white-space:pre"><tspan fill="#88ff88">root@lima-cg-lab:/tmp# </tspan><tspan fill="#e0e6f0">./ingroup demo sleep 30 &amp;</tspan></text>
  <text x="28" y="589" xml:space="preserve" style="white-space:pre" fill="#a8b3c2"></text>
