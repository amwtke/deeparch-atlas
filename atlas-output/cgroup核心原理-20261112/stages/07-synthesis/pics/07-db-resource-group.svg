<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="JetBrains Mono, Consolas, monospace">
<rect width="1200" height="700" fill="#0a0c10"/>
<text x="600" y="34" text-anchor="middle" fill="#e0e6f0" font-size="20">演练:用八个想法设计一个数据库的资源组</text>
<text x="600" y="56" text-anchor="middle" fill="#8892a0" font-size="12">一个数据库进程里跑着几个租户的查询;要让一个租户的大查询拖不垮别人。中间是 cgroup 的做法,右列是搬过来的样子(设计推演,不对应某个具体产品)</text>
<rect x="30" y="74" width="210" height="34" fill="#3a1e5f" stroke="#8040c0"/><text x="135" y="96" text-anchor="middle" fill="#c088ff" font-size="13">想法</text>
<rect x="246" y="74" width="290" height="34" fill="#3a1e5f" stroke="#8040c0"/><text x="391" y="96" text-anchor="middle" fill="#c088ff" font-size="13">cgroup</text>
<rect x="542" y="74" width="628" height="34" fill="#3a1e5f" stroke="#8040c0"/><text x="856" y="96" text-anchor="middle" fill="#c088ff" font-size="13">数据库资源组</text>
<rect x="30" y="116" width="210" height="58" fill="#1e5f3a" stroke="#40c060"/><text x="135" y="150" text-anchor="middle" fill="#88ff88" font-size="13">1 分进程组记账</text>
<rect x="246" y="116" width="290" height="58" fill="#1e3a5f" stroke="#4080c0"/><text x="258" y="150" fill="#88c0ff" font-size="12">进程带组籍,fork 继承</text>
<rect x="542" y="116" width="628" height="58" fill="#5f3a1e" stroke="#c08040"/><text x="554" y="150" fill="#ffaa55" font-size="12">会话带组号;登录时按用户 / 应用映射;并行查询的工作线程继承</text>
<rect x="30" y="182" width="210" height="58" fill="#1e5f3a" stroke="#40c060"/><text x="135" y="216" text-anchor="middle" fill="#88ff88" font-size="13">2 将工具统一成框架</text>
<rect x="246" y="182" width="290" height="58" fill="#1e3a5f" stroke="#4080c0"/><text x="258" y="216" fill="#88c0ff" font-size="12">一套分组,代替各管各的旧工具</text>
<rect x="542" y="182" width="628" height="58" fill="#5f3a1e" stroke="#c08040"/><text x="554" y="216" fill="#ffaa55" font-size="12">不给每个功能各加开关;一个资源组框架,CPU / 内存 / IO / 并发四个插件</text>
<rect x="30" y="248" width="210" height="58" fill="#1e5f3a" stroke="#40c060"/><text x="135" y="282" text-anchor="middle" fill="#88ff88" font-size="13">3 公共框架加资源插件</text>
<rect x="246" y="248" width="290" height="58" fill="#1e3a5f" stroke="#4080c0"/><text x="258" y="282" fill="#88c0ff" font-size="12">核心只管树和组籍,每种资源一个插件</text>
<rect x="542" y="248" width="628" height="58" fill="#5f3a1e" stroke="#c08040"/><text x="554" y="282" fill="#ffaa55" font-size="12">框架只管会话属于哪个组、组怎么嵌套;加临时表空间上限就是第五个插件</text>
<rect x="30" y="314" width="210" height="58" fill="#1e5f3a" stroke="#40c060"/><text x="135" y="348" text-anchor="middle" fill="#88ff88" font-size="13">4 复用内核已有路径记账</text>
<rect x="246" y="314" width="290" height="58" fill="#1e3a5f" stroke="#4080c0"/><text x="258" y="348" fill="#88c0ff" font-size="12">记账挂在调度、缺页、提交 IO 上</text>
<rect x="542" y="314" width="628" height="58" fill="#5f3a1e" stroke="#c08040"/><text x="554" y="348" fill="#ffaa55" font-size="12">记在线程让出 CPU 处、内存分配器、缓冲池取页、发 IO 处;没设限的组不记</text>
<rect x="30" y="380" width="210" height="58" fill="#1e5f3a" stroke="#40c060"/><text x="135" y="414" text-anchor="middle" fill="#88ff88" font-size="13">5 记账时同步检查限额</text>
<rect x="246" y="380" width="290" height="58" fill="#1e3a5f" stroke="#4080c0"/><text x="258" y="414" fill="#88c0ff" font-size="12">加上去,看超没超</text>
<rect x="542" y="380" width="628" height="58" fill="#5f3a1e" stroke="#c08040"/><text x="554" y="414" fill="#ffaa55" font-size="12">分配时比上限;不另起一个线程定期扫描查询</text>
<rect x="30" y="446" width="210" height="58" fill="#1e5f3a" stroke="#40c060"/><text x="135" y="480" text-anchor="middle" fill="#88ff88" font-size="13">6 按资源特性决定超限处理</text>
<rect x="246" y="446" width="290" height="58" fill="#1e3a5f" stroke="#4080c0"/><text x="258" y="480" fill="#88c0ff" font-size="12">等 / 拒 / 回收或杀</text>
<rect x="542" y="446" width="628" height="58" fill="#5f3a1e" stroke="#c08040"/><text x="554" y="480" fill="#ffaa55" font-size="12">CPU:让出、排队;并发:准入排队;IO:限速;内存:分配时直接报错(有返回值)</text>
<rect x="30" y="512" width="210" height="58" fill="#1e5f3a" stroke="#40c060"/><text x="135" y="546" text-anchor="middle" fill="#88ff88" font-size="13">7 提供机制,策略由需求定制</text>
<rect x="246" y="512" width="290" height="58" fill="#1e3a5f" stroke="#4080c0"/><text x="258" y="546" fill="#88c0ff" font-size="12">文件界面,数字由外面写</text>
<rect x="542" y="512" width="628" height="58" fill="#5f3a1e" stroke="#c08040"/><text x="554" y="546" fill="#ffaa55" font-size="12">CREATE / ALTER 资源组的语句,数字由 DBA 或控制面写;引擎只负责执行</text>
<rect x="30" y="578" width="210" height="58" fill="#1e5f3a" stroke="#40c060"/><text x="135" y="612" text-anchor="middle" fill="#88ff88" font-size="13">8 用统一的方式管理所有资源</text>
<rect x="246" y="578" width="290" height="58" fill="#1e3a5f" stroke="#4080c0"/><text x="258" y="612" fill="#88c0ff" font-size="12">只有一棵树;进程自己改不了组籍</text>
<rect x="542" y="578" width="628" height="58" fill="#5f3a1e" stroke="#c08040"/><text x="554" y="612" fill="#ffaa55" font-size="12">所有资源共用一套分组;会话自己不能换组,要有权限</text>
<text x="600" y="672" text-anchor="middle" fill="#8892a0" font-size="11">最大的不同在第 6 行:数据库自己分配内存,分配有返回值,所以内存超限可以报错而不必杀,和 Windows 的 Job Object 一样</text>
</svg>
