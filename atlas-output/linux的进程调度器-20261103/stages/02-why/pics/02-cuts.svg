<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="560" fill="#0a0c10"/>
  <text x="600" y="30" text-anchor="middle" fill="#e6edf3" font-size="19">八刀:从「一核一队列先来先跑」长成调度器 —— 一刀一个痛点、一条约束、一样机制</text>

  <!-- start block -->
  <rect x="30" y="60" width="150" height="60" rx="5" fill="#11161d" stroke="#8b949e"/>
  <text x="105" y="84" text-anchor="middle" fill="#e6edf3" font-size="12">起点</text>
  <text x="105" y="102" text-anchor="middle" fill="#8b949e" font-size="11">一核 · FIFO · 不抢占</text>

  <!-- staircase: 8 steps, each: pain(red) -> constraint(orange) -> mechanism(blue) -->
  <!-- step geometry: x from 200, each step 118 wide; y descends 50 per step -->
  <g font-size="11">
    <!-- 1 -->
    <rect x="200" y="60" width="112" height="40" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="256" y="76" text-anchor="middle" fill="#ff8888">痛:xz 霸台</text>
    <text x="256" y="92" text-anchor="middle" fill="#ff8888" font-size="10">20 分钟没人能动</text>
    <rect x="200" y="106" width="112" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="256" y="122" text-anchor="middle" fill="#ffaa55">C1</text>
    <text x="256" y="138" text-anchor="middle" fill="#ffaa55" font-size="10">只在打断点换</text>
    <rect x="200" y="152" width="112" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="256" y="168" text-anchor="middle" fill="#88c0ff" font-size="10">tick + need_resched</text>
    <text x="256" y="184" text-anchor="middle" fill="#88c0ff" font-size="10">出口换人</text>

    <!-- 2 -->
    <rect x="322" y="100" width="112" height="40" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="378" y="116" text-anchor="middle" fill="#ff8888">痛:换谁?</text>
    <text x="378" y="132" text-anchor="middle" fill="#ff8888" font-size="10">猜意图被骗</text>
    <rect x="322" y="146" width="112" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="378" y="162" text-anchor="middle" fill="#ffaa55">C2</text>
    <text x="378" y="178" text-anchor="middle" fill="#ffaa55" font-size="10">未来不可知</text>
    <rect x="322" y="192" width="112" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="378" y="208" text-anchor="middle" fill="#88c0ff" font-size="10">记账:累计运行</text>
    <text x="378" y="224" text-anchor="middle" fill="#88c0ff" font-size="10">只看账不看人</text>

    <!-- 3 -->
    <rect x="444" y="140" width="112" height="40" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="500" y="156" text-anchor="middle" fill="#ff8888">痛:份额≠延迟</text>
    <text x="500" y="172" text-anchor="middle" fill="#ff8888" font-size="10">一个数保不住两个</text>
    <rect x="444" y="186" width="112" height="40" rx="4" fill="#5f3a1e" stroke="#c08040" stroke-width="2"/>
    <text x="500" y="202" text-anchor="middle" fill="#ffaa55">C3</text>
    <text x="500" y="218" text-anchor="middle" fill="#ffaa55" font-size="10">份额与延迟两头要</text>
    <rect x="444" y="232" width="112" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="500" y="248" text-anchor="middle" fill="#88c0ff" font-size="10">权重 / slice·deadline</text>
    <text x="500" y="264" text-anchor="middle" fill="#88c0ff" font-size="10">lag 缝合</text>

    <!-- 4 -->
    <rect x="566" y="180" width="112" height="40" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="622" y="196" text-anchor="middle" fill="#ff8888">痛:3000 线程</text>
    <text x="622" y="212" text-anchor="middle" fill="#ff8888" font-size="10">tick 里扫一遍</text>
    <rect x="566" y="226" width="112" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="622" y="242" text-anchor="middle" fill="#ffaa55">C4</text>
    <text x="622" y="258" text-anchor="middle" fill="#ffaa55" font-size="10">挑人须便宜</text>
    <rect x="566" y="272" width="112" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="622" y="288" text-anchor="middle" fill="#88c0ff" font-size="10">红黑树 + 增广</text>
    <text x="622" y="304" text-anchor="middle" fill="#88c0ff" font-size="10">TSC 增量记账</text>

    <!-- 5 -->
    <rect x="688" y="220" width="112" height="40" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="744" y="236" text-anchor="middle" fill="#ff8888">痛:8 核一把锁</text>
    <text x="744" y="252" text-anchor="middle" fill="#ff8888" font-size="10">cache 每次重填</text>
    <rect x="688" y="266" width="112" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="744" y="282" text-anchor="middle" fill="#ffaa55">C5</text>
    <text x="744" y="298" text-anchor="middle" fill="#ffaa55" font-size="10">核各自为政</text>
    <rect x="688" y="312" width="112" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="744" y="328" text-anchor="middle" fill="#88c0ff" font-size="10">每核 rq + 调度域</text>
    <text x="744" y="344" text-anchor="middle" fill="#88c0ff" font-size="10">三种搬人</text>

    <!-- 6 -->
    <rect x="810" y="260" width="112" height="40" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="866" y="276" text-anchor="middle" fill="#ff8888">痛:make -j64</text>
    <text x="866" y="292" text-anchor="middle" fill="#ff8888" font-size="10">卖 2 核要真限 2 核</text>
    <rect x="810" y="306" width="112" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="866" y="322" text-anchor="middle" fill="#ffaa55">C6</text>
    <text x="866" y="338" text-anchor="middle" fill="#ffaa55" font-size="10">份额按组算</text>
    <rect x="810" y="352" width="112" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="866" y="368" text-anchor="middle" fill="#88c0ff" font-size="10">组实体 cpu.weight</text>
    <text x="866" y="384" text-anchor="middle" fill="#88c0ff" font-size="10">cpu.max 封顶</text>

    <!-- 7 -->
    <rect x="932" y="300" width="112" height="40" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="988" y="316" text-anchor="middle" fill="#ff8888">痛:音频 5 ms</text>
    <text x="988" y="332" text-anchor="middle" fill="#ff8888" font-size="10">公平给不了绝对</text>
    <rect x="932" y="346" width="112" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="988" y="362" text-anchor="middle" fill="#ffaa55">C7</text>
    <text x="988" y="378" text-anchor="middle" fill="#ffaa55" font-size="10">有人要硬保证</text>
    <rect x="932" y="392" width="112" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="988" y="408" text-anchor="middle" fill="#88c0ff" font-size="10">类栈 dl/rt &gt; fair</text>
    <text x="988" y="424" text-anchor="middle" fill="#88c0ff" font-size="10">95% 阀 · PI · 准入</text>

    <!-- 8 -->
    <rect x="1054" y="340" width="112" height="40" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="1110" y="356" text-anchor="middle" fill="#ff8888">痛:核不一样快</text>
    <text x="1110" y="372" text-anchor="middle" fill="#ff8888" font-size="10">SMT / turbo / 大小核</text>
    <rect x="1054" y="386" width="112" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="1110" y="402" text-anchor="middle" fill="#ffaa55">C8</text>
    <text x="1110" y="418" text-anchor="middle" fill="#ffaa55" font-size="10">核不等速且耗电</text>
    <rect x="1054" y="432" width="112" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="1110" y="448" text-anchor="middle" fill="#88c0ff" font-size="10">capacity + PELT</text>
    <text x="1110" y="464" text-anchor="middle" fill="#88c0ff" font-size="10">EAS · schedutil</text>
  </g>

  <!-- arrows between steps -->
  <g stroke="#8b949e" stroke-dasharray="6,4" fill="none">
    <line x1="180" y1="90" x2="200" y2="80"/>
    <line x1="312" y1="172" x2="322" y2="120"/>
    <line x1="434" y1="212" x2="444" y2="160"/>
    <line x1="556" y1="252" x2="566" y2="200"/>
    <line x1="678" y1="292" x2="688" y2="240"/>
    <line x1="800" y1="332" x2="810" y2="280"/>
    <line x1="922" y1="372" x2="932" y2="320"/>
    <line x1="1044" y1="412" x2="1054" y2="360"/>
  </g>

  <!-- mapping to four questions -->
  <g font-size="11">
    <rect x="30" y="490" width="1140" height="1" fill="#30363d"/>
    <text x="30" y="512" fill="#8b949e">回到四问:</text>
    <text x="130" y="512" fill="#ffaa55">① 何时换 = C1</text>
    <text x="300" y="512" fill="#ffaa55">② 换谁 = C2 + C3 + C7</text>
    <text x="520" y="512" fill="#ffaa55">③ 各多少 = C3 + C6</text>
    <text x="700" y="512" fill="#ffaa55">④ 在哪换 = C5 + C8</text>
    <text x="900" y="512" fill="#ffaa55">C4 = 四问共同的预算</text>
    <text x="30" y="536" fill="#8b949e">三代换代:2002 O(1) 改写 C4 + C5;2007 CFS 改写 C2;2023 EEVDF 改写 C3</text>
  </g>

  <!-- legend -->
  <g font-size="10">
    <rect x="860" y="60" width="14" height="12" fill="#5f1e1e" stroke="#c04040"/><text x="880" y="70" fill="#8b949e">痛点</text>
    <rect x="930" y="60" width="14" height="12" fill="#5f3a1e" stroke="#c08040"/><text x="950" y="70" fill="#8b949e">浮现的约束</text>
    <rect x="1040" y="60" width="14" height="12" fill="#1e3a5f" stroke="#4080c0"/><text x="1060" y="70" fill="#8b949e">引入的机制</text>
  </g>
</svg>
