<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="620" fill="#0a0c10"/>
  <text x="600" y="30" text-anchor="middle" fill="#e6edf3" font-size="19">调度器接力 1974 → 2024:三次换代改写一条约束,旁线各补一条,学术线早 28 年</text>

  <!-- lane labels -->
  <text x="20" y="110" fill="#8b949e" font-size="12">学术线</text>
  <text x="20" y="250" fill="#8b949e" font-size="12">主线</text>
  <text x="20" y="266" fill="#8b949e" font-size="11">(挑人规则)</text>
  <text x="20" y="400" fill="#8b949e" font-size="12">旁线</text>
  <text x="20" y="416" fill="#8b949e" font-size="11">(补约束)</text>

  <!-- lane bands -->
  <rect x="90" y="70" width="1090" height="90" fill="#11161d" stroke="#30363d"/>
  <rect x="90" y="180" width="1090" height="150" fill="#0f141a" stroke="#30363d"/>
  <rect x="90" y="350" width="1090" height="140" fill="#11161d" stroke="#30363d"/>

  <!-- time axis -->
  <line x1="90" y1="520" x2="1180" y2="520" stroke="#8b949e"/>
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="130" y="540">1974</text>
    <text x="230" y="540">1986</text>
    <text x="300" y="540">1991</text>
    <text x="400" y="540">1994/95</text>
    <text x="520" y="540">2002</text>
    <text x="640" y="540">2007</text>
    <text x="760" y="540">2010~13</text>
    <text x="880" y="540">2019</text>
    <text x="1000" y="540">2023</text>
    <text x="1120" y="540">2024</text>
  </g>
  <g stroke="#30363d" stroke-dasharray="3 3">
    <line x1="130" y1="70" x2="130" y2="520"/>
    <line x1="230" y1="70" x2="230" y2="520"/>
    <line x1="300" y1="70" x2="300" y2="520"/>
    <line x1="400" y1="70" x2="400" y2="520"/>
    <line x1="520" y1="70" x2="520" y2="520"/>
    <line x1="640" y1="70" x2="640" y2="520"/>
    <line x1="760" y1="70" x2="760" y2="520"/>
    <line x1="880" y1="70" x2="880" y2="520"/>
    <line x1="1000" y1="70" x2="1000" y2="520"/>
    <line x1="1120" y1="70" x2="1120" y2="520"/>
  </g>

  <!-- academic lane -->
  <g font-size="11">
    <rect x="345" y="80" width="110" height="34" rx="4" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="400" y="94" text-anchor="middle" fill="#c088ff">1994 Lottery</text>
    <text x="400" y="108" text-anchor="middle" fill="#c088ff" font-size="10">Waldspurger:票 = 份额</text>
    <rect x="345" y="120" width="110" height="34" rx="4" fill="#3a1e5f" stroke="#8040c0" stroke-width="2"/>
    <text x="400" y="134" text-anchor="middle" fill="#c088ff">1995 EEVDF</text>
    <text x="400" y="148" text-anchor="middle" fill="#c088ff" font-size="10">Stoica:eligible + 虚拟截止期</text>
  </g>
  <path d="M 455 137 C 700 137, 800 230, 955 230" stroke="#8040c0" stroke-dasharray="6,4" fill="none"/>
  <text x="720" y="128" text-anchor="middle" fill="#8b949e" font-size="10">28 年后落地(2008 年 Peter 的 RFC 曾被搁置)</text>

  <!-- main lane: prelude -->
  <g font-size="10">
    <rect x="95" y="275" width="70" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="130" y="291" text-anchor="middle" fill="#88c0ff">V7 衰减</text>
    <text x="130" y="305" text-anchor="middle" fill="#88c0ff">p_cpu/16+nice</text>
    <rect x="195" y="275" width="70" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="230" y="291" text-anchor="middle" fill="#88c0ff">4.3BSD</text>
    <text x="230" y="305" text-anchor="middle" fill="#88c0ff">每秒重算</text>
    <rect x="265" y="275" width="70" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="300" y="291" text-anchor="middle" fill="#88c0ff">0.01 counter</text>
    <text x="300" y="305" text-anchor="middle" fill="#88c0ff">→ 2.4 goodness</text>
  </g>

  <!-- main lane: three turning points -->
  <g font-size="11">
    <rect x="462" y="190" width="116" height="70" rx="5" fill="#5f3a1e" stroke="#c08040" stroke-width="2"/>
    <text x="520" y="208" text-anchor="middle" fill="#ffaa55">2002 O(1)</text>
    <text x="520" y="224" text-anchor="middle" fill="#ffaa55" font-size="10">Ingo Molnár</text>
    <text x="520" y="238" text-anchor="middle" fill="#ffaa55" font-size="10">每核 rq · 位图</text>
    <text x="520" y="252" text-anchor="middle" fill="#ff8888" font-size="10">改写 C4 + C5</text>

    <rect x="582" y="190" width="116" height="70" rx="5" fill="#5f3a1e" stroke="#c08040" stroke-width="2"/>
    <text x="640" y="208" text-anchor="middle" fill="#ffaa55">2007 CFS</text>
    <text x="640" y="224" text-anchor="middle" fill="#ffaa55" font-size="10">Con Kolivas → Ingo</text>
    <text x="640" y="238" text-anchor="middle" fill="#ffaa55" font-size="10">不猜 · 红黑树 · ns</text>
    <text x="640" y="252" text-anchor="middle" fill="#ff8888" font-size="10">改写 C2</text>

    <rect x="942" y="190" width="116" height="70" rx="5" fill="#5f3a1e" stroke="#c08040" stroke-width="2"/>
    <text x="1000" y="208" text-anchor="middle" fill="#ffaa55">2023 EEVDF</text>
    <text x="1000" y="224" text-anchor="middle" fill="#ffaa55" font-size="10">Peter Zijlstra</text>
    <text x="1000" y="238" text-anchor="middle" fill="#ffaa55" font-size="10">slice/deadline + lag</text>
    <text x="1000" y="252" text-anchor="middle" fill="#ff8888" font-size="10">改写 C3</text>

    <rect x="1062" y="190" width="116" height="70" rx="5" fill="#1e5f3a" stroke="#40c060" stroke-width="2"/>
    <text x="1120" y="208" text-anchor="middle" fill="#88ff88">2024 sched_ext</text>
    <text x="1120" y="224" text-anchor="middle" fill="#88ff88" font-size="10">Tejun Heo / Linus 裁决</text>
    <text x="1120" y="238" text-anchor="middle" fill="#88ff88" font-size="10">规则可换(BPF)</text>
    <text x="1120" y="252" text-anchor="middle" fill="#ff8888" font-size="10">C2/C3 按负载选</text>
  </g>
  <!-- debt arrows on main lane -->
  <g stroke="#c04040" stroke-dasharray="6,4" fill="none">
    <line x1="578" y1="300" x2="582" y2="300"/>
  </g>
  <g fill="#ff8888" font-size="10" text-anchor="middle">
    <text x="520" y="285">债:sleep_avg 估计器</text>
    <text x="520" y="299">(C2,5 年后到期)</text>
    <text x="640" y="285">债:睡醒补偿 / 唤醒粒度</text>
    <text x="640" y="299">(C3,16 年后到期)</text>
    <text x="1000" y="285">债:睡眠时的 lag</text>
    <text x="1000" y="299">(delayed dequeue 6.12,仍在改)</text>
    <text x="820" y="292">CFS 16 年:旁线在它身上长</text>
  </g>
  <line x1="698" y1="225" x2="942" y2="225" stroke="#4080c0" stroke-width="3"/>
  <line x1="335" y1="295" x2="462" y2="225" stroke="#4080c0" stroke-dasharray="6,4"/>

  <!-- side lane -->
  <g font-size="10">
    <rect x="600" y="360" width="90" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="645" y="376" text-anchor="middle" fill="#88c0ff">2008 组调度</text>
    <text x="645" y="390" text-anchor="middle" fill="#ff8888">C6 份额</text>
    <rect x="700" y="360" width="90" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="745" y="376" text-anchor="middle" fill="#88c0ff">2010 autogroup</text>
    <text x="745" y="390" text-anchor="middle" fill="#ff8888">C6 · Galbraith</text>
    <rect x="800" y="360" width="90" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="845" y="376" text-anchor="middle" fill="#88c0ff">2011 带宽控制</text>
    <text x="845" y="390" text-anchor="middle" fill="#ff8888">C6 封顶 · Turner</text>
    <rect x="700" y="410" width="90" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="745" y="426" text-anchor="middle" fill="#88c0ff">2012 PELT</text>
    <text x="745" y="440" text-anchor="middle" fill="#ff8888">C8 估计量 · Turner</text>
    <rect x="800" y="410" width="90" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="845" y="426" text-anchor="middle" fill="#88c0ff">2013 NUMA 均衡</text>
    <text x="845" y="440" text-anchor="middle" fill="#ff8888">C5 远近 · Gorman</text>
    <rect x="900" y="410" width="90" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="945" y="426" text-anchor="middle" fill="#88c0ff">2019 EAS</text>
    <text x="945" y="440" text-anchor="middle" fill="#ff8888">C8 能耗 · ARM</text>
    <rect x="1000" y="410" width="90" height="40" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="1045" y="426" text-anchor="middle" fill="#88c0ff">2024 PREEMPT_RT</text>
    <text x="1045" y="440" text-anchor="middle" fill="#ff8888">C1 / C7 · 6.12</text>
    <rect x="462" y="410" width="116" height="40" rx="4" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="520" y="426" text-anchor="middle" fill="#c088ff">2007 调度类栈</text>
    <text x="520" y="440" text-anchor="middle" fill="#ff8888">C7 凌驾(随 CFS 进)</text>
  </g>
  <text x="635" y="475" text-anchor="middle" fill="#8b949e" font-size="11">旁线不换挑人规则,只往同一套规则上加:组是一行账、封顶按周期扣、负载是估计量、远近分层</text>

  <!-- legend -->
  <g font-size="10">
    <rect x="620" y="560" width="14" height="12" fill="#5f3a1e" stroke="#c08040"/><text x="640" y="570" fill="#8b949e">主线换代</text>
    <rect x="720" y="560" width="14" height="12" fill="#1e3a5f" stroke="#4080c0"/><text x="740" y="570" fill="#8b949e">前史 / 旁线</text>
    <rect x="830" y="560" width="14" height="12" fill="#3a1e5f" stroke="#8040c0"/><text x="850" y="570" fill="#8b949e">学术 / 结构</text>
    <rect x="940" y="560" width="14" height="12" fill="#1e5f3a" stroke="#40c060"/><text x="960" y="570" fill="#8b949e">规则可换</text>
    <text x="1050" y="570" fill="#ff8888">红字 = 改写 / 补的约束</text>
  </g>
  <text x="600" y="600" text-anchor="middle" fill="#8b949e" font-size="11">每个转折点各有一封信:2002-01-04 / 2007-03-04 / 2007-04-13 / 2010-11-15 / 2010-02-12 / 2023-03-06 / 2022-11-30 / 2024-06-11(链接见 §12)</text>
</svg>
