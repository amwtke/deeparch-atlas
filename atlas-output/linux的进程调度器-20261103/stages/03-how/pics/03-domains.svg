<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="600" fill="#0a0c10"/>
  <text x="600" y="28" text-anchor="middle" fill="#e6edf3" font-size="19">调度域两层(MC / PKG)+ 三种搬人的路径 —— 8 核两组 L3,SMT 关</text>

  <!-- PKG domain -->
  <rect x="60" y="60" width="1080" height="250" rx="10" fill="none" stroke="#8040c0" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="80" y="82" fill="#c088ff" font-size="12">PKG 域(8 核;两个 sched_group 各 4 核)  imbalance_pct 117  balance_interval 8 ms(忙 ×16 → 100 ms 上限)</text>

  <!-- MC domain 0 -->
  <rect x="90" y="100" width="500" height="190" rx="8" fill="none" stroke="#8040c0" stroke-dasharray="4,4"/>
  <text x="105" y="120" fill="#c088ff" font-size="11">MC 域 0 = L3 组 0(SD_SHARE_LLC;每核一个 sched_group)  interval 4 ms(忙 64 ms)</text>
  <!-- MC domain 1 -->
  <rect x="610" y="100" width="500" height="190" rx="8" fill="none" stroke="#8040c0" stroke-dasharray="4,4"/>
  <text x="625" y="120" fill="#c088ff" font-size="11">MC 域 1 = L3 组 1</text>

  <!-- cores group 0 -->
  <g font-size="10">
    <rect x="110" y="135" width="105" height="120" rx="5" fill="#1e5f3a" stroke="#40c060"/>
    <text x="162" y="152" text-anchor="middle" fill="#88ff88" font-size="11">核 0 / rq0</text>
    <text x="162" y="168" text-anchor="middle" fill="#88ff88">curr mysqld#3</text>
    <text x="162" y="182" text-anchor="middle" fill="#88ff88">3 可跑 · load 2900</text>
    <text x="162" y="196" text-anchor="middle" fill="#88ff88">redis prev_cpu</text>
    <text x="162" y="212" text-anchor="middle" fill="#88ff88">util 0.9</text>
    <rect x="228" y="135" width="105" height="120" rx="5" fill="#1e5f3a" stroke="#40c060"/>
    <text x="280" y="152" text-anchor="middle" fill="#88ff88" font-size="11">核 1 / rq1</text>
    <text x="280" y="168" text-anchor="middle" fill="#88ff88">curr pg#17</text>
    <text x="280" y="182" text-anchor="middle" fill="#88ff88">5 可跑 · load 5100</text>
    <text x="280" y="196" text-anchor="middle" fill="#ff8888">最忙(overloaded)</text>
    <text x="280" y="212" text-anchor="middle" fill="#88ff88">1 个 0.3 ms 前跑过 = 热</text>
    <rect x="346" y="135" width="105" height="120" rx="5" fill="#1e5f3a" stroke="#40c060"/>
    <text x="398" y="152" text-anchor="middle" fill="#88ff88" font-size="11">核 2 / rq2</text>
    <text x="398" y="168" text-anchor="middle" fill="#88ff88">curr xz(网卡中断在此)</text>
    <text x="398" y="182" text-anchor="middle" fill="#88ff88">1 可跑 · load 15</text>
    <text x="398" y="196" text-anchor="middle" fill="#88ff88">唤醒者所在核</text>
    <rect x="464" y="135" width="105" height="120" rx="5" fill="#1e5f3a" stroke="#40c060" stroke-width="2"/>
    <text x="516" y="152" text-anchor="middle" fill="#88ff88" font-size="11">核 3 / rq3</text>
    <text x="516" y="168" text-anchor="middle" fill="#88ff88">curr 刚睡 → idle</text>
    <text x="516" y="182" text-anchor="middle" fill="#88ff88">0 可跑</text>
    <text x="516" y="196" text-anchor="middle" fill="#ffaa55">newidle 均衡起点</text>
  </g>
  <!-- cores group 1 -->
  <g font-size="10">
    <rect x="630" y="135" width="105" height="120" rx="5" fill="#1e5f3a" stroke="#40c060"/>
    <text x="682" y="152" text-anchor="middle" fill="#88ff88" font-size="11">核 4 / rq4</text>
    <text x="682" y="168" text-anchor="middle" fill="#88ff88">6 可跑 · load 6100</text>
    <text x="682" y="182" text-anchor="middle" fill="#ff8888">组 1 里最忙</text>
    <rect x="748" y="135" width="105" height="120" rx="5" fill="#1e5f3a" stroke="#40c060"/>
    <text x="800" y="152" text-anchor="middle" fill="#88ff88" font-size="11">核 5 / rq5</text>
    <text x="800" y="168" text-anchor="middle" fill="#88ff88">4 可跑 · load 4000</text>
    <rect x="866" y="135" width="105" height="120" rx="5" fill="#1e5f3a" stroke="#40c060"/>
    <text x="918" y="152" text-anchor="middle" fill="#88ff88" font-size="11">核 6 / rq6</text>
    <text x="918" y="168" text-anchor="middle" fill="#88ff88">2 可跑 · load 2048</text>
    <rect x="984" y="135" width="105" height="120" rx="5" fill="#1e5f3a" stroke="#40c060"/>
    <text x="1036" y="152" text-anchor="middle" fill="#88ff88" font-size="11">核 7 / rq7</text>
    <text x="1036" y="168" text-anchor="middle" fill="#88ff88">1 可跑(redis 绑核)</text>
    <text x="1036" y="182" text-anchor="middle" fill="#88ff88">cpus_ptr = {7}</text>
    <text x="1036" y="196" text-anchor="middle" fill="#ff8888">别人仍能被拉进来</text>
  </g>
  <text x="90" y="278" fill="#8b949e" font-size="10">组 0 共 9 可跑 / 4 核</text>
  <text x="610" y="278" fill="#8b949e" font-size="10">组 1 共 13 可跑 / 4 核 → 13/9 = 144% &gt; 117%:PKG 层够格搬</text>

  <!-- migrations -->
  <!-- 1 wakeup: redis woken by irq on core2 -> wake_affine between core2 and prev core0 -> select_idle_sibling -> core3 idle in same LLC -->
  <path d="M 398 258 C 398 330, 160 330, 162 258" fill="none" stroke="#40c060" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="280" y="332" text-anchor="middle" fill="#88ff88" font-size="10">① 唤醒 redis(未绑核时):wake_affine 在核 2(唤醒者)与核 0(prev)之间选 → 同 L3 → select_idle_sibling 找到空的核 3</text>
  <!-- 2 newidle pull: rq3 <- rq1 -->
  <path d="M 464 230 L 333 230" fill="none" stroke="#40c060" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="464,230 454,225 454,235" fill="#40c060"/>
  <text x="400" y="246" text-anchor="middle" fill="#88ff88" font-size="9">② MC 层:拉 2 个</text>
  <!-- 2b PKG pull: rq3 <- rq4 -->
  <path d="M 630 245 L 569 245" fill="none" stroke="#40c060" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="569,245 579,240 579,250" fill="#40c060"/>
  <text x="600" y="262" text-anchor="middle" fill="#88ff88" font-size="9">②' PKG 层:跨 L3 拉 1 个</text>
  <!-- 3 fork -->
  <rect x="470" y="350" width="260" height="30" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
  <text x="600" y="369" text-anchor="middle" fill="#88c0ff" font-size="10">③ 新建 / exec:sched_balance_find_dst_cpu</text>
  <path d="M 470 365 C 300 365, 200 300, 516 258" fill="none" stroke="#40c060" stroke-width="4" stroke-dasharray="6,4"/>
  <text x="760" y="369" fill="#8b949e" font-size="10">从最高带 SD_BALANCE_FORK 的域往下找最闲组、最闲核(刚 idle 不深者优先)</text>

  <!-- mechanism table -->
  <rect x="60" y="400" width="1080" height="150" rx="8" fill="#0f141a" stroke="#30363d"/>
  <g font-size="10" fill="#8b949e">
    <text x="80" y="422" fill="#e6edf3" font-size="12">② 周期 / 空闲均衡 sched_balance_rq 的五步(本例 rq3 newidle)</text>
    <text x="80" y="442">1 触发:核空了立刻(avg_idle 比一次均衡的代价长才做);忙核 tick 到 next_balance 抬 SCHED_SOFTIRQ → sched_balance_domains 从 MC 到 PKG 逐层</text>
    <text x="80" y="460">2 找最忙组 sched_balance_find_src_group:按 load_avg / util_avg / 可跑数 / 空核数分类(has_spare / fully_busy / overloaded / misfit);本组比对方闲 17% 以上才继续</text>
    <text x="80" y="478">3 算 imbalance calculate_imbalance:migrate_load / util / task / misfit 四种;只搬差距的一半(imbalance &gt;&gt;= 1)</text>
    <text x="80" y="496">4 挑任务 detach_tasks:跳过 curr、跳过 cpus_ptr 不允许的、跳过 task_hot(exec_start 距今 &lt; 0.5 ms;SMT 兄弟间不算热);attach_tasks 放进本账并 wakeup_preempt</text>
    <text x="80" y="514">5 搬不动:nr_balance_failed 超过 cache_nice_tries(LLC 1 次 / NUMA 2 次)后忽略"热";还不行升级 active balance 让 stop 类线程把 curr 踢下来</text>
    <text x="80" y="538">PELT:util_avg(在跑比例)/ runnable_avg(可跑比例)/ load_avg(runnable × 权重),半衰期 32 ms;所有比较除以 cpu_capacity(≤ 1024)</text>
  </g>

  <!-- legend -->
  <g font-size="10">
    <rect x="760" y="568" width="14" height="12" fill="#1e5f3a" stroke="#40c060"/><text x="780" y="578" fill="#8b949e">rq / 搬人路径(粗 = 少而重)</text>
    <rect x="980" y="568" width="14" height="12" fill="#3a1e5f" stroke="#8040c0"/><text x="1000" y="578" fill="#8b949e">调度域</text>
    <rect x="1070" y="568" width="14" height="12" fill="#1e3a5f" stroke="#4080c0"/><text x="1090" y="578" fill="#8b949e">任务</text>
  </g>
</svg>
