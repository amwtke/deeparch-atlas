<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="580" fill="#0a0c10"/>
  <text x="600" y="28" text-anchor="middle" fill="#e6edf3" font-size="19">三件事 × 四问:打断点打标记(件③)→ 每核一本账与类栈(件①)→ fair 树上的账(件②)→ 三种搬人(件③)</text>

  <!-- ① triggers row -->
  <text x="20" y="66" fill="#8b949e" font-size="12">何时换</text>
  <g font-size="11">
    <rect x="80" y="48" width="150" height="34" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="155" y="62" text-anchor="middle" fill="#ffaa55">tick(4 ms)</text>
    <text x="155" y="76" text-anchor="middle" fill="#ffaa55" font-size="10">记账 · slice 到期?</text>
    <rect x="245" y="48" width="150" height="34" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="320" y="62" text-anchor="middle" fill="#ffaa55">唤醒 ttwu</text>
    <text x="320" y="76" text-anchor="middle" fill="#ffaa55" font-size="10">放回树 · 再挑一次</text>
    <rect x="410" y="48" width="150" height="34" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="485" y="62" text-anchor="middle" fill="#ffaa55">阻塞 / 让出</text>
    <text x="485" y="76" text-anchor="middle" fill="#ffaa55" font-size="10">自己进 schedule()</text>
    <rect x="575" y="48" width="170" height="34" rx="4" fill="#5f3a1e" stroke="#c08040" stroke-width="2"/>
    <text x="660" y="62" text-anchor="middle" fill="#ffaa55">出口检查</text>
    <text x="660" y="76" text-anchor="middle" fill="#ffaa55" font-size="10">exit_to_user / preempt 点</text>
  </g>
  <!-- flag -->
  <rect x="300" y="100" width="190" height="26" rx="4" fill="#11161d" stroke="#c08040"/>
  <text x="395" y="117" text-anchor="middle" fill="#ffaa55" font-size="11">TIF_NEED_RESCHED 小旗子</text>
  <g stroke="#c08040" stroke-dasharray="6,4" fill="none">
    <line x1="155" y1="82" x2="330" y2="100"/>
    <line x1="320" y1="82" x2="370" y2="100"/>
  </g>
  <line x1="490" y1="113" x2="600" y2="90" stroke="#c08040" stroke-dasharray="6,4"/>
  <text x="560" y="128" text-anchor="middle" fill="#8b949e" font-size="10">看到旗子才换</text>
  <rect x="770" y="48" width="170" height="34" rx="4" fill="#11161d" stroke="#8b949e"/>
  <text x="855" y="62" text-anchor="middle" fill="#e6edf3" font-size="11">schedule()</text>
  <text x="855" y="76" text-anchor="middle" fill="#8b949e" font-size="10">__pick_next_task</text>
  <line x1="745" y1="65" x2="770" y2="65" stroke="#e6edf3"/>
  <line x1="560" y1="65" x2="575" y2="65" stroke="#c08040" stroke-dasharray="3,3"/>
  <text x="1000" y="60" fill="#8b949e" font-size="10">只有一个箭头是实线:</text>
  <text x="1000" y="74" fill="#8b949e" font-size="10">tick / 唤醒只打标记</text>

  <!-- expanded rq0 (left) -->
  <rect x="30" y="150" width="520" height="340" rx="8" fill="#0f141a" stroke="#40c060"/>
  <text x="48" y="172" fill="#88ff88" font-size="13">rq0(核 0 的账)  curr = mysqld#3  nr_running = 3  clock_task  cpu_capacity = 1024</text>

  <!-- class stack -->
  <text x="48" y="196" fill="#8b949e" font-size="11">件① 类栈(高类非空低类不跑)</text>
  <g font-size="11">
    <rect x="48" y="204" width="130" height="22" rx="3" fill="#3a1e5f" stroke="#8040c0"/><text x="113" y="219" text-anchor="middle" fill="#c088ff">stop(空)</text>
    <rect x="48" y="230" width="130" height="22" rx="3" fill="#3a1e5f" stroke="#8040c0"/><text x="113" y="245" text-anchor="middle" fill="#c088ff">dl(空)</text>
    <rect x="48" y="256" width="130" height="22" rx="3" fill="#3a1e5f" stroke="#8040c0"/><text x="113" y="271" text-anchor="middle" fill="#c088ff">rt(空)</text>
    <rect x="48" y="282" width="130" height="30" rx="3" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/><text x="113" y="301" text-anchor="middle" fill="#88c0ff">fair → 树</text>
    <rect x="48" y="316" width="130" height="22" rx="3" fill="#3a1e5f" stroke="#8040c0"/><text x="113" y="331" text-anchor="middle" fill="#c088ff">ext(未加载)</text>
    <rect x="48" y="342" width="130" height="22" rx="3" fill="#3a1e5f" stroke="#8040c0"/><text x="113" y="357" text-anchor="middle" fill="#c088ff">idle</text>
  </g>
  <text x="48" y="384" fill="#8b949e" font-size="10">快路径:全是 fair → 直接</text>
  <text x="48" y="398" fill="#8b949e" font-size="10">pick_next_task_fair,类栈不扫</text>
  <line x1="178" y1="297" x2="215" y2="297" stroke="#4080c0" stroke-dasharray="4,3"/>

  <!-- fair tree -->
  <text x="225" y="196" fill="#8b949e" font-size="11">件② cfs_rq 树:按 deadline 排,节点记子树 min_vruntime;V = avg_vruntime/avg_load</text>
  <!-- root -->
  <circle cx="370" cy="236" r="18" fill="#1e3a5f" stroke="#4080c0"/>
  <text x="370" y="240" text-anchor="middle" fill="#88c0ff" font-size="10">pg#17</text>
  <text x="400" y="232" fill="#8b949e" font-size="9">dl 1208.0</text>
  <text x="400" y="244" fill="#8b949e" font-size="9">lag +0.4 ✓</text>
  <!-- left child: redis -->
  <circle cx="290" cy="296" r="18" fill="#1e3a5f" stroke="#4080c0"/>
  <text x="290" y="300" text-anchor="middle" fill="#88c0ff" font-size="10">redis</text>
  <text x="228" y="292" fill="#8b949e" font-size="9">dl 1205.1</text>
  <text x="228" y="304" fill="#8b949e" font-size="9">lag +0.5 ✓</text>
  <!-- right child: group square -->
  <rect x="432" y="278" width="40" height="36" rx="3" fill="#5f1e1e" stroke="#c04040"/>
  <text x="452" y="293" text-anchor="middle" fill="#ff8888" font-size="9">k8s/</text>
  <text x="452" y="305" text-anchor="middle" fill="#ff8888" font-size="9">mysql</text>
  <text x="480" y="290" fill="#8b949e" font-size="9">组实体 w≈128</text>
  <text x="480" y="302" fill="#8b949e" font-size="9">(1024 ÷ 8 核)</text>
  <!-- right-right: xz -->
  <circle cx="520" cy="236" r="0" fill="none"/>
  <line x1="370" y1="254" x2="290" y2="278" stroke="#4080c0"/>
  <line x1="370" y1="254" x2="452" y2="278" stroke="#4080c0"/>
  <!-- subtree under group -->
  <line x1="452" y1="314" x2="420" y2="350" stroke="#c04040" stroke-dasharray="4,3"/>
  <line x1="452" y1="314" x2="484" y2="350" stroke="#c04040" stroke-dasharray="4,3"/>
  <circle cx="420" cy="366" r="15" fill="#1e3a5f" stroke="#4080c0"/>
  <text x="420" y="370" text-anchor="middle" fill="#88c0ff" font-size="9">my#3</text>
  <circle cx="484" cy="366" r="15" fill="#1e3a5f" stroke="#4080c0"/>
  <text x="484" y="370" text-anchor="middle" fill="#88c0ff" font-size="9">my#11</text>
  <text x="372" y="400" fill="#8b949e" font-size="9">组下面挂自己的 cfs_rq(树)</text>
  <!-- xz off tree note -->
  <circle cx="290" cy="366" r="15" fill="#1e3a5f" stroke="#4080c0"/>
  <text x="290" y="370" text-anchor="middle" fill="#88c0ff" font-size="9">xz</text>
  <text x="228" y="394" fill="#ff8888" font-size="9">lag −265 ✗ 没资格</text>
  <line x1="290" y1="314" x2="290" y2="351" stroke="#4080c0"/>
  <text x="225" y="430" fill="#8b949e" font-size="10">规则:有资格(lag ≥ 0)的里挑 deadline 最早 → redis</text>
  <text x="225" y="446" fill="#8b949e" font-size="10">curr 不在树上;V 由 avg_vruntime / avg_load 两个累加器 O(1) 得到</text>
  <text x="225" y="462" fill="#8b949e" font-size="10">每行账:weight · vruntime · slice/deadline · vlag(线程和组同形)</text>
  <text x="48" y="478" fill="#8b949e" font-size="10">cfs_rq.runtime_remaining(组的带宽小账,§6)</text>

  <!-- 8 rq boxes (right) -->
  <text x="580" y="168" fill="#8b949e" font-size="12">件① 8 本账并排,没有全局队列</text>
  <rect x="580" y="178" width="280" height="110" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
  <text x="720" y="193" text-anchor="middle" fill="#8b949e" font-size="10">L3 组 0(MC 域)</text>
  <rect x="880" y="178" width="280" height="110" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
  <text x="1020" y="193" text-anchor="middle" fill="#8b949e" font-size="10">L3 组 1(MC 域)</text>
  <g font-size="10">
    <rect x="590" y="200" width="60" height="76" rx="4" fill="#1e5f3a" stroke="#40c060" stroke-width="2"/><text x="620" y="216" text-anchor="middle" fill="#88ff88">rq0</text><text x="620" y="232" text-anchor="middle" fill="#88ff88" font-size="9">3 可跑</text><text x="620" y="246" text-anchor="middle" fill="#88ff88" font-size="9">cap 1024</text><text x="620" y="262" text-anchor="middle" fill="#88ff88" font-size="9">← 左图</text>
    <rect x="658" y="200" width="60" height="76" rx="4" fill="#1e5f3a" stroke="#40c060"/><text x="688" y="216" text-anchor="middle" fill="#88ff88">rq1</text><text x="688" y="232" text-anchor="middle" fill="#88ff88" font-size="9">5 可跑</text><text x="688" y="246" text-anchor="middle" fill="#88ff88" font-size="9">cap 1024</text>
    <rect x="726" y="200" width="60" height="76" rx="4" fill="#1e5f3a" stroke="#40c060"/><text x="756" y="216" text-anchor="middle" fill="#88ff88">rq2</text><text x="756" y="232" text-anchor="middle" fill="#88ff88" font-size="9">1 可跑</text><text x="756" y="246" text-anchor="middle" fill="#88ff88" font-size="9">cap 1024</text>
    <rect x="794" y="200" width="60" height="76" rx="4" fill="#1e5f3a" stroke="#40c060"/><text x="824" y="216" text-anchor="middle" fill="#88ff88">rq3</text><text x="824" y="232" text-anchor="middle" fill="#88ff88" font-size="9">0 空</text><text x="824" y="246" text-anchor="middle" fill="#88ff88" font-size="9">cap 1024</text><text x="824" y="262" text-anchor="middle" fill="#88ff88" font-size="9">newidle</text>
    <rect x="890" y="200" width="60" height="76" rx="4" fill="#1e5f3a" stroke="#40c060"/><text x="920" y="216" text-anchor="middle" fill="#88ff88">rq4</text><text x="920" y="232" text-anchor="middle" fill="#88ff88" font-size="9">6 可跑</text><text x="920" y="246" text-anchor="middle" fill="#88ff88" font-size="9">cap 1024</text>
    <rect x="958" y="200" width="60" height="76" rx="4" fill="#1e5f3a" stroke="#40c060"/><text x="988" y="216" text-anchor="middle" fill="#88ff88">rq5</text><text x="988" y="232" text-anchor="middle" fill="#88ff88" font-size="9">4 可跑</text><text x="988" y="246" text-anchor="middle" fill="#88ff88" font-size="9">cap 1024</text>
    <rect x="1026" y="200" width="60" height="76" rx="4" fill="#1e5f3a" stroke="#40c060"/><text x="1056" y="216" text-anchor="middle" fill="#88ff88">rq6</text><text x="1056" y="232" text-anchor="middle" fill="#88ff88" font-size="9">2 可跑</text><text x="1056" y="246" text-anchor="middle" fill="#88ff88" font-size="9">cap 1024</text>
    <rect x="1094" y="200" width="60" height="76" rx="4" fill="#1e5f3a" stroke="#40c060"/><text x="1124" y="216" text-anchor="middle" fill="#88ff88">rq7</text><text x="1124" y="232" text-anchor="middle" fill="#88ff88" font-size="9">1(redis 绑)</text><text x="1124" y="246" text-anchor="middle" fill="#88ff88" font-size="9">cap 1024</text>
  </g>
  <text x="580" y="306" fill="#8b949e" font-size="10">PKG 域 = 8 核两组;MC 域 = 组内 4 核各自一组;imbalance_pct 117%,折半搬,task_hot 0.5 ms</text>

  <!-- three migrations -->
  <text x="580" y="336" fill="#8b949e" font-size="12">件③ 三种搬人(都按调度域由近到远)</text>
  <g fill="none">
    <line x1="600" y1="356" x2="760" y2="356" stroke="#40c060" stroke-width="1" stroke-dasharray="6,4"/>
    <line x1="600" y1="386" x2="760" y2="386" stroke="#40c060" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="600" y1="416" x2="760" y2="416" stroke="#40c060" stroke-width="4" stroke-dasharray="6,4"/>
  </g>
  <g font-size="10" fill="#8b949e">
    <text x="770" y="360">唤醒选核 select_task_rq_fair:每次唤醒;原核空?同 L3 空核?(wake_affine + select_idle_sibling)</text>
    <text x="770" y="390">周期 / 空闲均衡 sched_balance_rq:空闲时立刻,忙时 4 ~ 100 ms;从最忙组拉,只拉一半</text>
    <text x="770" y="420">新建 / exec sched_balance_find_dst_cpu:放最闲的核(没有 cache 可丢)</text>
  </g>
  <text x="580" y="452" fill="#8b949e" font-size="10">搬人 = 把件②的一个节点从一本 rq 的树挪到另一本;挑人永远不跨本</text>
  <text x="580" y="470" fill="#8b949e" font-size="10">cgroup 带宽(§6):组在每核的 cfs_rq 向全局池借 5 ms;池空 → 整组下树;period_timer 放回</text>

  <!-- legend -->
  <g font-size="10">
    <rect x="640" y="520" width="14" height="12" fill="#5f3a1e" stroke="#c08040"/><text x="660" y="530" fill="#8b949e">打断点 / 标记</text>
    <rect x="760" y="520" width="14" height="12" fill="#3a1e5f" stroke="#8040c0"/><text x="780" y="530" fill="#8b949e">类栈</text>
    <rect x="840" y="520" width="14" height="12" fill="#1e3a5f" stroke="#4080c0"/><text x="860" y="530" fill="#8b949e">线程实体</text>
    <rect x="940" y="520" width="14" height="12" fill="#5f1e1e" stroke="#c04040"/><text x="960" y="530" fill="#8b949e">组实体 / 封顶</text>
    <rect x="1070" y="520" width="14" height="12" fill="#1e5f3a" stroke="#40c060"/><text x="1090" y="530" fill="#8b949e">rq / 搬人</text>
  </g>
  <text x="600" y="562" text-anchor="middle" fill="#8b949e" font-size="11">8 核两组 L3,HZ = 250,base_slice 3 ms,Linux 6.12;圆 = 线程,方 = 组(下面还有一棵树)</text>
</svg>
