<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="520" fill="#0a0c10"/>
  <text x="600" y="28" text-anchor="middle" fill="#e6edf3" font-size="19">fair 类的账在一条虚拟时间轴上:V、每个实体的 vruntime、lag 的正负、deadline、谁有资格(§3.6 第 10 ms 那一刻,核 0)</text>

  <!-- axis: virtual ms 1203 .. 1210, 140 px per ms, x0 = 120 for 1203 -->
  <line x1="100" y1="200" x2="1100" y2="200" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="1100,200 1090,195 1090,205" fill="#8b949e"/>
  <text x="1110" y="204" fill="#8b949e" font-size="11">虚拟 ms</text>
  <g stroke="#30363d" font-size="10" fill="#8b949e">
    <line x1="120" y1="195" x2="120" y2="205"/><text x="120" y="222" text-anchor="middle">1203</text>
    <line x1="260" y1="195" x2="260" y2="205"/><text x="260" y="222" text-anchor="middle">1204</text>
    <line x1="400" y1="195" x2="400" y2="205"/><text x="400" y="222" text-anchor="middle">1205</text>
    <line x1="540" y1="195" x2="540" y2="205"/><text x="540" y="222" text-anchor="middle">1206</text>
    <line x1="680" y1="195" x2="680" y2="205"/><text x="680" y="222" text-anchor="middle">1207</text>
    <line x1="820" y1="195" x2="820" y2="205"/><text x="820" y="222" text-anchor="middle">1208</text>
    <line x1="960" y1="195" x2="960" y2="205"/><text x="960" y="222" text-anchor="middle">1209</text>
  </g>

  <!-- V marker at 1205.27 -> x = 120 + 2.27*140 = 437.8 -->
  <line x1="438" y1="60" x2="438" y2="330" stroke="#ffaa55" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="380" y="44" width="116" height="22" rx="4" fill="#5f3a1e" stroke="#c08040"/>
  <text x="438" y="59" text-anchor="middle" fill="#ffaa55" font-size="11">V = 1205.27</text>
  <text x="438" y="80" text-anchor="middle" fill="#ffaa55" font-size="10">加权平均(redis 占 90% 话语权)</text>
  <text x="300" y="100" text-anchor="end" fill="#88ff88" font-size="11">← 左边:v 小于 V,lag 正,有资格</text>
  <text x="576" y="100" fill="#ff8888" font-size="11">右边:v 大于 V,lag 负,没资格 →</text>

  <!-- redis at 1204.77 -> x = 120 + 1.77*140 = 367.8 ; deadline 1205.09 -> x = 412.6 -->
  <circle cx="368" cy="200" r="9" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
  <text x="368" y="150" text-anchor="middle" fill="#88c0ff" font-size="11">redis(w 9548)</text>
  <text x="368" y="166" text-anchor="middle" fill="#88c0ff" font-size="10">v = 1204.77</text>
  <line x1="368" y1="200" x2="438" y2="200" stroke="#88ff88" stroke-width="4"/>
  <text x="403" y="186" text-anchor="middle" fill="#88ff88" font-size="10">lag +0.50</text>
  <line x1="413" y1="200" x2="413" y2="250" stroke="#4080c0" stroke-dasharray="3,3"/>
  <text x="413" y="264" text-anchor="middle" fill="#88c0ff" font-size="10">dl 1205.09</text>
  <text x="413" y="278" text-anchor="middle" fill="#88c0ff" font-size="9">(v + 3 ms × 1024/9548)</text>
  <text x="368" y="300" text-anchor="middle" fill="#88ff88" font-size="11">✓ 有资格 · deadline 最早 → 挑它</text>

  <!-- mysqld at 1206.00 -> x = 540 ; deadline 1207.00 -> 680 -->
  <circle cx="540" cy="200" r="9" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
  <text x="540" y="150" text-anchor="middle" fill="#88c0ff" font-size="11">mysqld#3(w 1024,curr)</text>
  <text x="540" y="166" text-anchor="middle" fill="#88c0ff" font-size="10">v = 1206.00</text>
  <line x1="438" y1="200" x2="540" y2="200" stroke="#ff8888" stroke-width="4"/>
  <text x="489" y="186" text-anchor="middle" fill="#ff8888" font-size="10">lag −0.73</text>
  <line x1="680" y1="200" x2="680" y2="250" stroke="#4080c0" stroke-dasharray="3,3"/>
  <text x="680" y="264" text-anchor="middle" fill="#88c0ff" font-size="10">dl 1207.00</text>
  <text x="680" y="278" text-anchor="middle" fill="#88c0ff" font-size="9">(v + 3 ms × 1024/1024)</text>
  <text x="540" y="300" text-anchor="middle" fill="#ff8888" font-size="11">✗ 超支 · slice 保护不护没资格的 curr</text>

  <!-- xz off axis -->
  <rect x="1000" y="186" width="90" height="28" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
  <text x="1045" y="204" text-anchor="middle" fill="#88c0ff" font-size="10">xz v 1473 →</text>
  <text x="1045" y="236" text-anchor="middle" fill="#ff8888" font-size="10">lag −265 ✗</text>
  <text x="1045" y="250" text-anchor="middle" fill="#8b949e" font-size="9">dl 1677.87(远)</text>

  <!-- lower panel: how each number moves -->
  <rect x="60" y="330" width="1080" height="160" rx="8" fill="#0f141a" stroke="#30363d"/>
  <text x="80" y="352" fill="#e6edf3" font-size="12">四个数怎么动(每个打断点 update_curr 一次)</text>
  <g font-size="10">
    <rect x="80" y="366" width="250" height="52" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="90" y="382" fill="#88c0ff">vruntime += Δt × 1024 / w</text>
    <text x="90" y="396" fill="#88c0ff">redis 1 ms → +0.107;mysqld → +1.0</text>
    <text x="90" y="410" fill="#88c0ff">xz → +68.3(一跑账就飞)</text>

    <rect x="345" y="366" width="250" height="52" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="355" y="382" fill="#ffaa55">V = min_vruntime + avg_vruntime/avg_load</text>
    <text x="355" y="396" fill="#ffaa55">插删时 O(1) 更新两个累加器</text>
    <text x="355" y="410" fill="#ffaa55">curr 不在树上,算 V 时临时加进去</text>

    <rect x="610" y="366" width="250" height="52" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="620" y="382" fill="#88c0ff">deadline = v + slice × 1024 / w</text>
    <text x="620" y="396" fill="#88c0ff">只在 v 追上旧 deadline 时推一次</text>
    <text x="620" y="410" fill="#88c0ff">推了就 resched(标记来源 ①)</text>

    <rect x="875" y="366" width="250" height="52" rx="4" fill="#1e5f3a" stroke="#40c060"/>
    <text x="885" y="382" fill="#88ff88">lag = V − v;有资格 ⇔ lag ≥ 0</text>
    <text x="885" y="396" fill="#88ff88">睡下去时夹 ±max(2·slice, tick)×1024/w</text>
    <text x="885" y="410" fill="#88ff88">醒来放大 ×(W+w)/W 后放回(守恒)</text>
  </g>
  <g font-size="10" fill="#8b949e">
    <text x="80" y="446">夹紧上限(真实 6 ms 换算):mysqld ±6.0 虚拟 ms · redis ±0.643 · xz ±409.6  —— 跟 nice 无关,只跟 slice 有关</text>
    <text x="80" y="464">pick_eevdf:树上有一个 → 它;curr 没资格 → 当不存在;RUN_TO_PARITY 护有资格的 curr 一个 slice;否则最左有资格者;再和 curr 比 deadline</text>
    <text x="80" y="482">6.12 DELAY_DEQUEUE:lag 为负的任务要睡,先留在树上还清账再出队(睡眠不是逃债)</text>
  </g>

  <!-- legend -->
  <g font-size="10">
    <rect x="880" y="500" width="14" height="12" fill="#1e3a5f" stroke="#4080c0"/><text x="900" y="510" fill="#8b949e">实体 / deadline</text>
    <rect x="1000" y="500" width="14" height="12" fill="#5f3a1e" stroke="#c08040"/><text x="1020" y="510" fill="#8b949e">V</text>
    <rect x="1050" y="500" width="14" height="12" fill="#1e5f3a" stroke="#40c060"/><text x="1070" y="510" fill="#8b949e">lag 正</text>
    <rect x="1120" y="500" width="14" height="12" fill="#5f1e1e" stroke="#c04040"/><text x="1140" y="510" fill="#8b949e">lag 负</text>
  </g>
</svg>
