<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="620" fill="#0a0c10"/>
  <text x="600" y="30" text-anchor="middle" fill="#e6edf3" font-size="19">调度器四问:① 何时换(打断点)→ ② 换谁(类栈 + 账)→ ③ 各多少(账上的数)→ ④ 在哪换(每核一本账)</text>

  <!-- ① triggers row -->
  <text x="20" y="72" fill="#8b949e" font-size="12">① 何时换</text>
  <g>
    <rect x="100" y="52" width="230" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="215" y="70" text-anchor="middle" fill="#ffaa55" font-size="12">时钟中断 tick(每 4 ms)</text>
    <text x="215" y="85" text-anchor="middle" fill="#ffaa55" font-size="10">记账;片用完 → 打标记</text>
    <rect x="350" y="52" width="230" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="465" y="70" text-anchor="middle" fill="#ffaa55" font-size="12">唤醒(数据到 / 锁放)</text>
    <text x="465" y="85" text-anchor="middle" fill="#ffaa55" font-size="10">入队;比当前 → 可能打标记</text>
    <rect x="600" y="52" width="230" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="715" y="70" text-anchor="middle" fill="#ffaa55" font-size="12">阻塞 / 让出 / 退出</text>
    <text x="715" y="85" text-anchor="middle" fill="#ffaa55" font-size="10">出队;立刻挑下一个</text>
    <rect x="850" y="52" width="250" height="40" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="975" y="70" text-anchor="middle" fill="#ffaa55" font-size="12">出口检查(回用户态 / 抢占点)</text>
    <text x="975" y="85" text-anchor="middle" fill="#ffaa55" font-size="10">看标记 need_resched → 真换</text>
  </g>
  <g stroke="#c08040" stroke-dasharray="6,4" fill="none">
    <line x1="215" y1="92" x2="520" y2="130"/>
    <line x1="465" y1="92" x2="540" y2="130"/>
    <line x1="715" y1="92" x2="620" y2="130"/>
    <line x1="975" y1="92" x2="660" y2="130"/>
  </g>
  <rect x="470" y="130" width="260" height="30" rx="4" fill="#11161d" stroke="#8b949e"/>
  <text x="600" y="150" text-anchor="middle" fill="#e6edf3" font-size="13">schedule() → pick_next_task()</text>

  <!-- ② class stack (left) -->
  <text x="20" y="200" fill="#8b949e" font-size="12">② 换谁</text>
  <text x="20" y="216" fill="#8b949e" font-size="11">第一层:类栈</text>
  <g>
    <rect x="130" y="180" width="250" height="26" rx="3" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="255" y="198" text-anchor="middle" fill="#c088ff" font-size="12">stop:迁移 / 热插拔线程</text>
    <rect x="130" y="210" width="250" height="26" rx="3" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="255" y="228" text-anchor="middle" fill="#c088ff" font-size="12">dl:SCHED_DEADLINE,EDF</text>
    <rect x="130" y="240" width="250" height="26" rx="3" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="255" y="258" text-anchor="middle" fill="#c088ff" font-size="12">rt:FIFO / RR,优先级 1~99</text>
    <rect x="130" y="270" width="250" height="40" rx="3" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
    <text x="255" y="287" text-anchor="middle" fill="#88c0ff" font-size="12">fair:NORMAL / BATCH</text>
    <text x="255" y="302" text-anchor="middle" fill="#88c0ff" font-size="11">EEVDF(6.6+;之前 CFS)</text>
    <rect x="130" y="314" width="250" height="26" rx="3" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="255" y="332" text-anchor="middle" fill="#c088ff" font-size="12">ext:SCHED_EXT,规则在 BPF 里</text>
    <rect x="130" y="344" width="250" height="26" rx="3" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="255" y="362" text-anchor="middle" fill="#c088ff" font-size="12">idle:没人可跑时</text>
  </g>
  <text x="255" y="392" text-anchor="middle" fill="#8b949e" font-size="11">高类非空,低类一个都不跑</text>
  <line x1="390" y1="290" x2="470" y2="290" stroke="#4080c0" stroke-dasharray="6,4"/>
  <text x="430" y="282" text-anchor="middle" fill="#8b949e" font-size="10">第二层</text>

  <!-- ②③ fair ledger (right) -->
  <text x="480" y="176" fill="#8b949e" font-size="12">fair 类的账本(一行一个调度实体;③ 各多少 = 这些数)</text>
  <g fill="#8b949e" font-size="11">
    <text x="490" y="200">实体</text>
    <text x="620" y="200">权重</text>
    <text x="700" y="200">vruntime</text>
    <text x="810" y="200">lag</text>
    <text x="880" y="200">deadline</text>
    <text x="980" y="200">slice</text>
    <text x="1050" y="200">eligible?</text>
  </g>
  <line x1="480" y1="206" x2="1120" y2="206" stroke="#30363d"/>
  <g font-size="11">
    <rect x="480" y="212" width="640" height="24" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="490" y="228" fill="#88c0ff">mysqld 线程 #3</text>
    <text x="620" y="228" fill="#88c0ff">1024</text>
    <text x="700" y="228" fill="#88c0ff">1203.4 ms</text>
    <text x="810" y="228" fill="#88c0ff">+0.6</text>
    <text x="880" y="228" fill="#88c0ff">1206.4 ms</text>
    <text x="980" y="228" fill="#88c0ff">3 ms</text>
    <text x="1050" y="228" fill="#88ff88">是 ← 挑它</text>

    <rect x="480" y="240" width="640" height="24" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="490" y="256" fill="#88c0ff">redis(nice −10)</text>
    <text x="620" y="256" fill="#88c0ff">9548</text>
    <text x="700" y="256" fill="#88c0ff">1201.9 ms</text>
    <text x="810" y="256" fill="#88c0ff">+2.1</text>
    <text x="880" y="256" fill="#88c0ff">1202.2 ms</text>
    <text x="980" y="256" fill="#88c0ff">3 ms</text>
    <text x="1050" y="256" fill="#8b949e">睡着(不在树上)</text>

    <rect x="480" y="268" width="640" height="24" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="490" y="284" fill="#88c0ff">xz(nice 19)</text>
    <text x="620" y="284" fill="#88c0ff">15</text>
    <text x="700" y="284" fill="#88c0ff">1210.0 ms</text>
    <text x="810" y="284" fill="#88c0ff">−6.0</text>
    <text x="880" y="284" fill="#88c0ff">1414.8 ms</text>
    <text x="980" y="284" fill="#88c0ff">3 ms</text>
    <text x="1050" y="284" fill="#ff8888">否(超支)</text>

    <rect x="480" y="296" width="640" height="24" rx="3" fill="#5f1e1e" stroke="#c04040"/>
    <text x="490" y="312" fill="#ff8888">cgroup k8s/mysql(组)</text>
    <text x="620" y="312" fill="#ff8888">100→1024</text>
    <text x="720" y="312" fill="#ff8888">(组内再分 16 行)</text>
    <text x="880" y="312" fill="#ff8888">cpu.max 200000/100000</text>
    <text x="1050" y="312" fill="#ff8888">用完整组停</text>
  </g>
  <text x="480" y="340" fill="#8b949e" font-size="11">规则:在 eligible(lag ≥ 0)的实体里挑 deadline 最早的;vruntime 每跑 1 ms 加 1024/权重 ms</text>
  <text x="480" y="356" fill="#8b949e" font-size="11">账只认数,不认任务是谁、像不像交互程序(这是跟 2007 年前那代的分界线)</text>
  <text x="480" y="372" fill="#8b949e" font-size="11">三个独立旋钮:权重 = 份额,slice / lag = 延迟,放哪本账 = 位置</text>

  <!-- ④ per-CPU rq -->
  <text x="20" y="430" fill="#8b949e" font-size="12">④ 在哪换</text>
  <text x="20" y="446" fill="#8b949e" font-size="11">每核一本账</text>
  <rect x="120" y="412" width="470" height="110" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
  <text x="355" y="428" text-anchor="middle" fill="#8b949e" font-size="11">LLC 组 0(共享 L3)</text>
  <rect x="610" y="412" width="470" height="110" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
  <text x="845" y="428" text-anchor="middle" fill="#8b949e" font-size="11">LLC 组 1(共享 L3)</text>
  <g font-size="11">
    <rect x="135" y="440" width="105" height="64" rx="4" fill="#1e5f3a" stroke="#40c060"/>
    <text x="187" y="458" text-anchor="middle" fill="#88ff88">rq0</text>
    <text x="187" y="474" text-anchor="middle" fill="#88ff88" font-size="10">curr: mysqld#3</text>
    <text x="187" y="490" text-anchor="middle" fill="#88ff88" font-size="10">树上 3 个</text>
    <rect x="250" y="440" width="105" height="64" rx="4" fill="#1e5f3a" stroke="#40c060"/>
    <text x="302" y="458" text-anchor="middle" fill="#88ff88">rq1</text>
    <text x="302" y="474" text-anchor="middle" fill="#88ff88" font-size="10">curr: pg#17</text>
    <text x="302" y="490" text-anchor="middle" fill="#88ff88" font-size="10">树上 5 个</text>
    <rect x="365" y="440" width="105" height="64" rx="4" fill="#1e5f3a" stroke="#40c060"/>
    <text x="417" y="458" text-anchor="middle" fill="#88ff88">rq2</text>
    <text x="417" y="474" text-anchor="middle" fill="#88ff88" font-size="10">curr: xz</text>
    <text x="417" y="490" text-anchor="middle" fill="#88ff88" font-size="10">树上 0 个</text>
    <rect x="480" y="440" width="105" height="64" rx="4" fill="#1e5f3a" stroke="#40c060"/>
    <text x="532" y="458" text-anchor="middle" fill="#88ff88">rq3</text>
    <text x="532" y="474" text-anchor="middle" fill="#88ff88" font-size="10">curr: idle</text>
    <text x="532" y="490" text-anchor="middle" fill="#88ff88" font-size="10">空</text>

    <rect x="625" y="440" width="105" height="64" rx="4" fill="#1e5f3a" stroke="#40c060"/>
    <text x="677" y="458" text-anchor="middle" fill="#88ff88">rq4</text>
    <text x="677" y="474" text-anchor="middle" fill="#88ff88" font-size="10">curr: pg#2</text>
    <text x="677" y="490" text-anchor="middle" fill="#88ff88" font-size="10">树上 6 个</text>
    <rect x="740" y="440" width="105" height="64" rx="4" fill="#1e5f3a" stroke="#40c060"/>
    <text x="792" y="458" text-anchor="middle" fill="#88ff88">rq5</text>
    <text x="792" y="474" text-anchor="middle" fill="#88ff88" font-size="10">curr: pg#9</text>
    <text x="792" y="490" text-anchor="middle" fill="#88ff88" font-size="10">树上 4 个</text>
    <rect x="855" y="440" width="105" height="64" rx="4" fill="#1e5f3a" stroke="#40c060"/>
    <text x="907" y="458" text-anchor="middle" fill="#88ff88">rq6</text>
    <text x="907" y="474" text-anchor="middle" fill="#88ff88" font-size="10">curr: mysqld#11</text>
    <text x="907" y="490" text-anchor="middle" fill="#88ff88" font-size="10">树上 2 个</text>
    <rect x="970" y="440" width="105" height="64" rx="4" fill="#1e5f3a" stroke="#40c060"/>
    <text x="1022" y="458" text-anchor="middle" fill="#88ff88">rq7</text>
    <text x="1022" y="474" text-anchor="middle" fill="#88ff88" font-size="10">curr: redis(绑核)</text>
    <text x="1022" y="490" text-anchor="middle" fill="#88ff88" font-size="10">树上 0 个</text>
  </g>
  <line x1="532" y1="504" x2="677" y2="504" stroke="#40c060" stroke-dasharray="6,4"/>
  <text x="604" y="518" text-anchor="middle" fill="#8b949e" font-size="10">均衡:rq3 空 → 从 rq4 拉 1 个(跨 L3,代价 ≈ 0.5 ms 重填)</text>
  <text x="600" y="540" text-anchor="middle" fill="#8b949e" font-size="11">唤醒选核 / 周期均衡 / 新建放最闲 —— 三种搬人;越远的核越少看、越少搬(调度域)</text>

  <!-- legend -->
  <g font-size="10">
    <rect x="700" y="560" width="14" height="12" fill="#5f3a1e" stroke="#c08040"/><text x="720" y="570" fill="#8b949e">① 打断点</text>
    <rect x="790" y="560" width="14" height="12" fill="#3a1e5f" stroke="#8040c0"/><text x="810" y="570" fill="#8b949e">② 类栈</text>
    <rect x="870" y="560" width="14" height="12" fill="#1e3a5f" stroke="#4080c0"/><text x="890" y="570" fill="#8b949e">②③ 账本实体</text>
    <rect x="990" y="560" width="14" height="12" fill="#5f1e1e" stroke="#c04040"/><text x="1010" y="570" fill="#8b949e">组 / 封顶</text>
    <rect x="1080" y="560" width="14" height="12" fill="#1e5f3a" stroke="#40c060"/><text x="1100" y="570" fill="#8b949e">④ 每核 rq</text>
  </g>
  <text x="600" y="600" text-anchor="middle" fill="#8b949e" font-size="11">贯穿机器:8 核 x86-64 两组 L3,HZ = 250,Linux 6.12;任务:mysqld ×16、redis ×1、xz(nice 19)、PostgreSQL 后端若干、k8s 容器限 2 核</text>
</svg>
