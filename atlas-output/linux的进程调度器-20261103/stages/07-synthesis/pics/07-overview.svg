<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="640" fill="#0a0c10"/>
  <text x="600" y="30" text-anchor="middle" fill="#e6edf3" font-size="19">五步法流水线:14 行五元组逐门过筛;右侧三个同构;底部八个取消约束的开关</text>

  <!-- queue of 14 rows entering the pipeline -->
  <text x="20" y="78" fill="#8b949e" font-size="11">14 个设计决策排队</text>
  <g font-size="10">
    <rect x="20" y="86" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="35" y="100" text-anchor="middle" fill="#88c0ff">1 账</text>
    <rect x="54" y="86" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="69" y="100" text-anchor="middle" fill="#88c0ff">2 三数</text>
    <rect x="88" y="86" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="103" y="100" text-anchor="middle" fill="#88c0ff">3 lag</text>
    <rect x="122" y="86" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="137" y="100" text-anchor="middle" fill="#88c0ff">4 延出</text>
    <rect x="156" y="86" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="171" y="100" text-anchor="middle" fill="#88c0ff">5 树</text>
    <rect x="190" y="86" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="205" y="100" text-anchor="middle" fill="#88c0ff">6 标记</text>
    <rect x="224" y="86" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="239" y="100" text-anchor="middle" fill="#88c0ff">7 每核</text>
    <rect x="20" y="110" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="35" y="124" text-anchor="middle" fill="#88c0ff">8 均衡</text>
    <rect x="54" y="110" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="69" y="124" text-anchor="middle" fill="#88c0ff">9 算力</text>
    <rect x="88" y="110" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="103" y="124" text-anchor="middle" fill="#88c0ff">10 组</text>
    <rect x="122" y="110" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="137" y="124" text-anchor="middle" fill="#88c0ff">11 封顶</text>
    <rect x="156" y="110" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="171" y="124" text-anchor="middle" fill="#88c0ff">12 类栈</text>
    <rect x="190" y="110" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="205" y="124" text-anchor="middle" fill="#88c0ff">13 可换</text>
    <rect x="224" y="110" width="30" height="20" rx="3" fill="#1e3a5f" stroke="#4080c0"/><text x="239" y="124" text-anchor="middle" fill="#88c0ff">14 slice</text>
  </g>
  <line x1="140" y1="134" x2="140" y2="170" stroke="#4080c0" stroke-dasharray="6,4"/>

  <!-- pipeline: five doors -->
  <rect x="20" y="170" width="860" height="130" rx="8" fill="#11161d" stroke="#30363d"/>
  <text x="30" y="188" fill="#8b949e" font-size="11">五步法(每行过五道门)</text>
  <g font-size="12">
    <rect x="40" y="200" width="140" height="70" rx="5" fill="#5f3a1e" stroke="#c08040"/>
    <text x="110" y="222" text-anchor="middle" fill="#ffaa55">① 识别约束</text>
    <text x="110" y="240" text-anchor="middle" fill="#ffaa55" font-size="10">C1 ~ C8 一刀一条</text>
    <text x="110" y="256" text-anchor="middle" fill="#ffaa55" font-size="10">错法:把目标当约束</text>

    <rect x="210" y="200" width="140" height="70" rx="5" fill="#5f3a1e" stroke="#c08040"/>
    <text x="280" y="222" text-anchor="middle" fill="#ffaa55">② 列举候选</text>
    <text x="280" y="240" text-anchor="middle" fill="#ffaa55" font-size="10">A1~A6 / B1~B6 / C1~C5</text>
    <text x="280" y="256" text-anchor="middle" fill="#ffaa55" font-size="10">错法:只列现状和更差的</text>

    <rect x="380" y="200" width="140" height="70" rx="5" fill="#5f3a1e" stroke="#c08040"/>
    <text x="450" y="222" text-anchor="middle" fill="#ffaa55">③ 代价分析</text>
    <text x="450" y="240" text-anchor="middle" fill="#ffaa55" font-size="10">违反哪条 Cn、付什么价</text>
    <text x="450" y="256" text-anchor="middle" fill="#ffaa55" font-size="10">错法:代价"几乎没有"</text>

    <rect x="550" y="200" width="140" height="70" rx="5" fill="#5f3a1e" stroke="#c08040" stroke-width="2"/>
    <text x="620" y="222" text-anchor="middle" fill="#ffaa55">④ 现实对照</text>
    <text x="620" y="240" text-anchor="middle" fill="#ffaa55" font-size="10">历史 × 异血统</text>
    <text x="620" y="256" text-anchor="middle" fill="#ffaa55" font-size="10">错法:只比同血统旧版</text>

    <rect x="720" y="200" width="140" height="70" rx="5" fill="#5f3a1e" stroke="#c08040"/>
    <text x="790" y="222" text-anchor="middle" fill="#ffaa55">⑤ 局部最优</text>
    <text x="790" y="240" text-anchor="middle" fill="#ffaa55" font-size="10">唯一过筛,随权重移动</text>
    <text x="790" y="256" text-anchor="middle" fill="#ffaa55" font-size="10">错法:证明"它最好"</text>
  </g>
  <g stroke="#c08040" fill="none">
    <line x1="180" y1="235" x2="210" y2="235"/><line x1="350" y1="235" x2="380" y2="235"/>
    <line x1="520" y1="235" x2="550" y2="235"/><line x1="690" y1="235" x2="720" y2="235"/>
  </g>

  <!-- door 4 inputs -->
  <rect x="470" y="110" width="150" height="44" rx="4" fill="#3a1e5f" stroke="#8040c0"/>
  <text x="545" y="128" text-anchor="middle" fill="#c088ff" font-size="11">Deep 反事实候选</text>
  <text x="545" y="144" text-anchor="middle" fill="#c088ff" font-size="10">A / B / C 三组</text>
  <rect x="640" y="110" width="200" height="44" rx="4" fill="#3a1e5f" stroke="#8040c0"/>
  <text x="740" y="128" text-anchor="middle" fill="#c088ff" font-size="11">Comparison 异血统</text>
  <text x="740" y="144" text-anchor="middle" fill="#c088ff" font-size="10">NT · SQLOS · ULE · Go</text>
  <g stroke="#8040c0" stroke-dasharray="6,4" fill="none">
    <line x1="560" y1="154" x2="600" y2="200"/>
    <line x1="720" y1="154" x2="650" y2="200"/>
  </g>

  <!-- output verdict -->
  <rect x="900" y="190" width="280" height="90" rx="6" fill="#1e5f3a" stroke="#40c060"/>
  <text x="1040" y="212" text-anchor="middle" fill="#88ff88" font-size="12">判定(第六列)</text>
  <text x="1040" y="232" text-anchor="middle" fill="#88ff88" font-size="11">必然 7:标记出口 · 每核账 · 封顶 · 类栈配阀 …</text>
  <text x="1040" y="250" text-anchor="middle" fill="#88ff88" font-size="11">Linux 的选择 5:三个数 · 延出 · 组一行 · slice</text>
  <text x="1040" y="268" text-anchor="middle" fill="#88ff88" font-size="11">偶然 2:账 vs 级(血统)· 周期均衡(折中)</text>
  <line x1="860" y1="235" x2="900" y2="235" stroke="#40c060"/>

  <!-- isomorphism side panels -->
  <text x="900" y="316" fill="#8b949e" font-size="11">同构(各保留不同的约束子集)</text>
  <g font-size="10">
    <rect x="900" y="324" width="280" height="62" rx="5" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="910" y="340" fill="#88c0ff" font-size="11">块层 IO 调度器(第一轮回扣)</text>
    <text x="910" y="356" fill="#88c0ff">blk-mq 每核软队列 = rq;bfq 预算 = 权重</text>
    <text x="910" y="370" fill="#88c0ff">mq-deadline 500 ms / 5 s = deadline;无 lag</text>
    <text x="910" y="382" fill="#8b949e">NVMe none = 把筛子交给硬件(≈ 第 13 行)</text>

    <rect x="900" y="394" width="280" height="62" rx="5" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="910" y="410" fill="#88c0ff" font-size="11">Go runtime GMP</text>
    <text x="910" y="426" fill="#88c0ff">P = 每核一本;偷一半 = 搬一半;sysmon 10 ms = tick</text>
    <text x="910" y="440" fill="#88c0ff">无权重 / 无 cgroup / 无硬保证</text>
    <text x="910" y="452" fill="#8b949e">取消 C3 份额一头、C6、C7;绕不开内核再调一次</text>

    <rect x="900" y="464" width="280" height="62" rx="5" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="910" y="480" fill="#88c0ff" font-size="11">TCP 公平队列 fq_codel / DRR</text>
    <text x="910" y="496" fill="#88c0ff">deficit = lag;quantum = slice;新流一个量子 = 有界插队</text>
    <text x="910" y="510" fill="#88c0ff">CoDel target 5 ms = 延迟那一头</text>
    <text x="910" y="522" fill="#8b949e">取消 C5(链路是资源,核不是)</text>
  </g>

  <!-- MySQL thread pool drill -->
  <rect x="20" y="324" width="860" height="110" rx="6" fill="#11161d" stroke="#30363d"/>
  <text x="30" y="342" fill="#8b949e" font-size="11">§7.6 离题演练:把五步法套到 MySQL 线程池</text>
  <g font-size="10">
    <rect x="30" y="352" width="160" height="70" rx="4" fill="#5f3a1e" stroke="#c08040"/>
    <text x="110" y="368" text-anchor="middle" fill="#ffaa55">T1~T6 约束</text>
    <text x="110" y="384" text-anchor="middle" fill="#ffaa55">连接≫核 · 长度不可知</text>
    <text x="110" y="398" text-anchor="middle" fill="#ffaa55">事务先跑 · 语句边界介入</text>
    <text x="110" y="412" text-anchor="middle" fill="#ffaa55">内核再调一次 · 要上限</text>

    <rect x="210" y="352" width="200" height="70" rx="4" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="310" y="368" text-anchor="middle" fill="#88c0ff">K1~K7 决策</text>
    <text x="310" y="384" text-anchor="middle" fill="#88c0ff">group = 每核一本;stall 60 ms = tick</text>
    <text x="310" y="398" text-anchor="middle" fill="#88c0ff">高优先队列 + 票 + kickup 1 s = 有界插队</text>
    <text x="310" y="412" text-anchor="middle" fill="#88c0ff">max_transactions = 准入</text>

    <rect x="430" y="352" width="200" height="70" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="530" y="368" text-anchor="middle" fill="#ff8888">它没有的</text>
    <text x="530" y="384" text-anchor="middle" fill="#ff8888">权重 / 虚拟时间 / 守恒</text>
    <text x="530" y="398" text-anchor="middle" fill="#ff8888">均衡(连接轮转分组后不搬)</text>
    <text x="530" y="412" text-anchor="middle" fill="#ff8888">= 取消了份额一头</text>

    <rect x="650" y="352" width="220" height="70" rx="4" fill="#1e5f3a" stroke="#40c060"/>
    <text x="760" y="368" text-anchor="middle" fill="#88ff88">五次取消看谁反超</text>
    <text x="760" y="384" text-anchor="middle" fill="#88ff88">T1 → 一连接一线程(MySQL 默认)</text>
    <text x="760" y="398" text-anchor="middle" fill="#88ff88">T4 / T5 → 全插桩 + 绑核 = SQLOS</text>
    <text x="760" y="412" text-anchor="middle" fill="#88ff88">结论:用户态的 fair 类减去账</text>
  </g>

  <!-- eight toggles -->
  <text x="20" y="458" fill="#8b949e" font-size="11">取消一条约束,谁反超(§2.2 / §5)</text>
  <g font-size="10">
    <rect x="20" y="466" width="100" height="48" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="70" y="482" text-anchor="middle" fill="#ff8888">关 C1</text>
    <text x="70" y="496" text-anchor="middle" fill="#ff8888">协作式</text>
    <text x="70" y="508" text-anchor="middle" fill="#ff8888">SQLOS · Go 1.13</text>
    <rect x="128" y="466" width="100" height="48" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="178" y="482" text-anchor="middle" fill="#ff8888">关 C2</text>
    <text x="178" y="496" text-anchor="middle" fill="#ff8888">猜意图</text>
    <text x="178" y="508" text-anchor="middle" fill="#ff8888">NT · ULE · scx</text>
    <rect x="236" y="466" width="100" height="48" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="286" y="482" text-anchor="middle" fill="#ff8888">关 C3 延迟</text>
    <text x="286" y="496" text-anchor="middle" fill="#ff8888">纯 vruntime</text>
    <text x="286" y="508" text-anchor="middle" fill="#ff8888">SCHED_BATCH · CFS</text>
    <rect x="344" y="466" width="100" height="48" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="394" y="482" text-anchor="middle" fill="#ff8888">关 C4</text>
    <text x="394" y="496" text-anchor="middle" fill="#ff8888">扫一遍</text>
    <text x="394" y="508" text-anchor="middle" fill="#ff8888">2.4 goodness</text>
    <rect x="452" y="466" width="100" height="48" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="502" y="482" text-anchor="middle" fill="#ff8888">关 C5</text>
    <text x="502" y="496" text-anchor="middle" fill="#ff8888">全局一棵树</text>
    <text x="502" y="508" text-anchor="middle" fill="#ff8888">2.4 锁 · BFS</text>
    <rect x="560" y="466" width="100" height="48" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="610" y="482" text-anchor="middle" fill="#ff8888">关 C6</text>
    <text x="610" y="496" text-anchor="middle" fill="#ff8888">按线程分</text>
    <text x="610" y="508" text-anchor="middle" fill="#ff8888">2.6.23</text>
    <rect x="668" y="466" width="100" height="48" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="718" y="482" text-anchor="middle" fill="#ff8888">关 C7</text>
    <text x="718" y="496" text-anchor="middle" fill="#ff8888">只有 fair</text>
    <text x="718" y="508" text-anchor="middle" fill="#ff8888">纯桌面假设</text>
    <rect x="776" y="466" width="100" height="48" rx="4" fill="#5f1e1e" stroke="#c04040"/>
    <text x="826" y="482" text-anchor="middle" fill="#ff8888">关 C8</text>
    <text x="826" y="496" text-anchor="middle" fill="#ff8888">按核数均衡</text>
    <text x="826" y="508" text-anchor="middle" fill="#ff8888">平的 O(1)</text>
  </g>

  <!-- bet -->
  <rect x="20" y="540" width="560" height="56" rx="6" fill="#1e5f3a" stroke="#40c060"/>
  <text x="30" y="560" fill="#88ff88" font-size="12">? 十年赌注(§8):第 13 行先换候选 —— 挑人规则从「内核一条」变成「每负载一条」</text>
  <text x="30" y="578" fill="#88ff88" font-size="10">证据:Linus 2024 的治理理由 · Meta / Valve 的 scx · NT 三十年加标签不换骨架;证伪:2035 年 scx 仍是实验,或 fair 长出 per-cgroup 策略(第 14 行换)</text>

  <!-- legend -->
  <g font-size="10">
    <rect x="640" y="548" width="14" height="12" fill="#5f3a1e" stroke="#c08040"/><text x="660" y="558" fill="#8b949e">五步 / 约束</text>
    <rect x="750" y="548" width="14" height="12" fill="#1e3a5f" stroke="#4080c0"/><text x="770" y="558" fill="#8b949e">决策 / 同构</text>
    <rect x="860" y="548" width="14" height="12" fill="#3a1e5f" stroke="#8040c0"/><text x="880" y="558" fill="#8b949e">对照输入</text>
    <rect x="960" y="548" width="14" height="12" fill="#1e5f3a" stroke="#40c060"/><text x="980" y="558" fill="#8b949e">判定 / 赌注</text>
    <rect x="1070" y="548" width="14" height="12" fill="#5f1e1e" stroke="#c04040"/><text x="1090" y="558" fill="#8b949e">取消 / 没有</text>
  </g>
  <text x="600" y="620" text-anchor="middle" fill="#8b949e" font-size="11">读法:左上的 14 行进管道,第四道门接 Deep 和 Comparison 两路输入,右侧盖章;底部每关一个开关,管道里就有一行换候选</text>
</svg>
