    <line x1="1080" y1="130" x2="1080" y2="146"/><line x1="1080" y1="180" x2="1080" y2="196"/><line x1="1080" y1="230" x2="1080" y2="246"/>
  </g>

  <!-- legend -->
  <g font-size="10">
    <rect x="40" y="620" width="14" height="12" fill="#5f3a1e" stroke="#c08040"/><text x="60" y="630" fill="#8b949e">触发点 / 定时器</text>
    <rect x="170" y="620" width="14" height="12" fill="#1e3a5f" stroke="#4080c0"/><text x="190" y="630" fill="#8b949e">调用链上的函数(file:line 为 v6.12)</text>
    <rect x="430" y="620" width="14" height="12" fill="#1e5f3a" stroke="#40c060"/><text x="450" y="630" fill="#8b949e">判据所在行</text>
    <rect x="550" y="620" width="14" height="12" fill="#5f1e1e" stroke="#c04040"/><text x="570" y="630" fill="#8b949e">整组停</text>
