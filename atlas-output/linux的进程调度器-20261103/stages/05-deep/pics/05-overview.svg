<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="660" fill="#0a0c10"/>
  <text x="600" y="30" text-anchor="middle" fill="#e6edf3" font-size="19">三条主线钉到 Linux 6.12:每列一条调用链,绿框是那条主线的判据所在行</text>

  <!-- column headers -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="50" width="360" height="30" rx="4" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="210" y="70" fill="#c088ff">主线① 挑人:eligible 且 deadline 最早</text>
    <rect x="420" y="50" width="360" height="30" rx="4" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="600" y="70" fill="#c088ff">主线② 搬人:有利可图 且 不热</text>
    <rect x="810" y="50" width="360" height="30" rx="4" fill="#3a1e5f" stroke="#8040c0"/>
    <text x="990" y="70" fill="#c088ff">主线③ 组:按周期借,借不到整组停</text>
  </g>

  <!-- column 1 -->
  <g font-size="11">
    <rect x="40" y="96" width="160" height="34" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="120" y="110" text-anchor="middle" fill="#ffaa55">tick 每 4 ms</text>
    <text x="120" y="124" text-anchor="middle" fill="#ffaa55" font-size="10">sched_tick core.c:5584</text>
    <rect x="220" y="96" width="160" height="34" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="300" y="110" text-anchor="middle" fill="#ffaa55">唤醒</text>
    <text x="300" y="124" text-anchor="middle" fill="#ffaa55" font-size="10">try_to_wake_up core.c:4127</text>

    <rect x="40" y="146" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="120" y="160" text-anchor="middle" fill="#88c0ff">update_curr</text>
    <text x="120" y="174" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:1216 记账</text>
    <rect x="220" y="146" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="300" y="160" text-anchor="middle" fill="#88c0ff">enqueue_entity</text>
    <text x="300" y="174" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:5382</text>

    <rect x="40" y="196" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="120" y="210" text-anchor="middle" fill="#88c0ff">update_deadline</text>
    <text x="120" y="224" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:1007 slice 用完?</text>
    <rect x="220" y="196" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="300" y="210" text-anchor="middle" fill="#88c0ff">place_entity</text>
    <text x="300" y="224" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:5266 lag 守恒放大</text>

    <rect x="40" y="246" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="120" y="260" text-anchor="middle" fill="#88c0ff">resched_curr</text>
    <text x="120" y="274" text-anchor="middle" fill="#88c0ff" font-size="10">core.c:1079 只打标记</text>
    <rect x="220" y="246" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="300" y="260" text-anchor="middle" fill="#88c0ff">check_preempt_wakeup_fair</text>
    <text x="300" y="274" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:8764 再挑一次</text>

    <rect x="130" y="296" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="210" y="310" text-anchor="middle" fill="#88c0ff">exit_to_user_mode_loop</text>
    <text x="210" y="324" text-anchor="middle" fill="#88c0ff" font-size="10">entry/common.c:101 出口</text>
    <rect x="130" y="346" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="210" y="360" text-anchor="middle" fill="#88c0ff">__schedule</text>
    <text x="210" y="374" text-anchor="middle" fill="#88c0ff" font-size="10">core.c:6548 → :6647 pick</text>
    <rect x="130" y="396" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="210" y="410" text-anchor="middle" fill="#88c0ff">pick_task_fair</text>
    <text x="210" y="424" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:8848 逐层下钻</text>
    <rect x="130" y="446" width="160" height="40" rx="3" fill="#1e5f3a" stroke="#40c060" stroke-width="2"/>
    <text x="210" y="462" text-anchor="middle" fill="#88ff88">pick_eevdf</text>
    <text x="210" y="478" text-anchor="middle" fill="#88ff88" font-size="10">fair.c:907 判据①</text>
    <rect x="130" y="502" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="210" y="516" text-anchor="middle" fill="#88c0ff">set_next_entity</text>
    <text x="210" y="530" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:5560 vlag=deadline</text>
    <rect x="130" y="552" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="210" y="566" text-anchor="middle" fill="#88c0ff">context_switch</text>
    <text x="210" y="580" text-anchor="middle" fill="#88c0ff" font-size="10">core.c:5272 上一轮 2~3 μs</text>
  </g>
  <g stroke="#4080c0" stroke-dasharray="6,4" fill="none">
    <line x1="120" y1="130" x2="120" y2="146"/><line x1="120" y1="180" x2="120" y2="196"/><line x1="120" y1="230" x2="120" y2="246"/>
    <line x1="300" y1="130" x2="300" y2="146"/><line x1="300" y1="180" x2="300" y2="196"/><line x1="300" y1="230" x2="300" y2="246"/>
    <line x1="120" y1="280" x2="190" y2="296"/><line x1="300" y1="280" x2="230" y2="296"/>
    <line x1="210" y1="330" x2="210" y2="346"/><line x1="210" y1="380" x2="210" y2="396"/><line x1="210" y1="430" x2="210" y2="446"/><line x1="210" y1="486" x2="210" y2="502"/><line x1="210" y1="536" x2="210" y2="552"/>
  </g>

  <!-- column 2 -->
  <g font-size="11">
    <rect x="430" y="96" width="160" height="34" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="510" y="110" text-anchor="middle" fill="#ffaa55">唤醒选核</text>
    <text x="510" y="124" text-anchor="middle" fill="#ffaa55" font-size="10">select_task_rq_fair :8589</text>
    <rect x="610" y="96" width="160" height="34" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="690" y="110" text-anchor="middle" fill="#ffaa55">空闲 / 周期均衡</text>
    <text x="690" y="124" text-anchor="middle" fill="#ffaa55" font-size="10">newidle :12726 / trigger :12879</text>

    <rect x="430" y="146" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="510" y="160" text-anchor="middle" fill="#88c0ff">wake_affine</text>
    <text x="510" y="174" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:7426 this vs prev</text>
    <rect x="610" y="146" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="690" y="160" text-anchor="middle" fill="#88c0ff">sched_balance_domains</text>
    <text x="690" y="174" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:12119 MC → PKG</text>

    <rect x="430" y="196" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="510" y="210" text-anchor="middle" fill="#88c0ff">select_idle_sibling</text>
    <text x="510" y="224" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:7843 同 LLC 找空核</text>
    <rect x="610" y="196" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="690" y="210" text-anchor="middle" fill="#88c0ff">sched_balance_rq</text>
    <text x="690" y="224" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:11669 五步</text>

    <rect x="430" y="246" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="510" y="260" text-anchor="middle" fill="#88c0ff">select_idle_cpu</text>
    <text x="510" y="274" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:7708 SIS_UTIL 限扫描</text>
    <rect x="610" y="246" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="690" y="260" text-anchor="middle" fill="#88c0ff">sched_balance_find_src_group</text>
    <text x="690" y="274" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:11250 group_type 分类</text>

    <rect x="610" y="296" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="690" y="310" text-anchor="middle" fill="#88c0ff">calculate_imbalance</text>
    <text x="690" y="324" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:11048 四种 migration_type</text>
    <rect x="610" y="346" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="690" y="360" text-anchor="middle" fill="#88c0ff">sched_balance_find_src_rq</text>
    <text x="690" y="374" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:11388 组里最忙的核</text>
    <rect x="610" y="396" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="690" y="410" text-anchor="middle" fill="#88c0ff">detach_tasks</text>
    <text x="690" y="424" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:9501 从树尾挑</text>
    <rect x="610" y="446" width="160" height="40" rx="3" fill="#1e5f3a" stroke="#40c060" stroke-width="2"/>
    <text x="690" y="462" text-anchor="middle" fill="#88ff88">can_migrate_task / task_hot</text>
    <text x="690" y="478" text-anchor="middle" fill="#88ff88" font-size="10">fair.c:9365 / :9260 判据②</text>
    <rect x="610" y="502" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="690" y="516" text-anchor="middle" fill="#88c0ff">attach_tasks → wakeup_preempt</text>
    <text x="690" y="530" text-anchor="middle" fill="#88c0ff" font-size="10">放进本账再挑一次</text>
    <rect x="430" y="296" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="510" y="310" text-anchor="middle" fill="#88c0ff">ttwu_queue → IPI</text>
    <text x="510" y="324" text-anchor="middle" fill="#88c0ff" font-size="10">core.c:3943 / :3821</text>
    <rect x="430" y="552" width="340" height="34" rx="3" fill="#11161d" stroke="#8b949e"/>
    <text x="600" y="566" text-anchor="middle" fill="#e6edf3">PELT:___update_load_sum pelt.c:180,y³² = ½</text>
    <text x="600" y="580" text-anchor="middle" fill="#8b949e" font-size="10">调度域:sd_init topology.c:1588,imbalance_pct 117 / 110</text>
  </g>
  <g stroke="#4080c0" stroke-dasharray="6,4" fill="none">
    <line x1="510" y1="130" x2="510" y2="146"/><line x1="510" y1="180" x2="510" y2="196"/><line x1="510" y1="230" x2="510" y2="246"/><line x1="510" y1="280" x2="510" y2="296"/>
    <line x1="690" y1="130" x2="690" y2="146"/><line x1="690" y1="180" x2="690" y2="196"/><line x1="690" y1="230" x2="690" y2="246"/><line x1="690" y1="280" x2="690" y2="296"/><line x1="690" y1="330" x2="690" y2="346"/><line x1="690" y1="380" x2="690" y2="396"/><line x1="690" y1="430" x2="690" y2="446"/><line x1="690" y1="486" x2="690" y2="502"/>
  </g>

  <!-- column 3 -->
  <g font-size="11">
    <rect x="820" y="96" width="160" height="34" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="900" y="110" text-anchor="middle" fill="#ffaa55">每个打断点</text>
    <text x="900" y="124" text-anchor="middle" fill="#ffaa55" font-size="10">update_curr fair.c:1216</text>
    <rect x="1000" y="96" width="160" height="34" rx="3" fill="#5f3a1e" stroke="#c08040"/>
    <text x="1080" y="110" text-anchor="middle" fill="#ffaa55">period 定时器</text>
    <text x="1080" y="124" text-anchor="middle" fill="#ffaa55" font-size="10">sched_cfs_period_timer :6518</text>

    <rect x="820" y="146" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="900" y="160" text-anchor="middle" fill="#88c0ff">account_cfs_rq_runtime</text>
    <text x="900" y="174" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:5812 扣本核小账</text>
    <rect x="1000" y="146" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="1080" y="160" text-anchor="middle" fill="#88c0ff">do_sched_cfs_period_timer</text>
    <text x="1080" y="174" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:6279 补池</text>

    <rect x="820" y="196" width="160" height="40" rx="3" fill="#1e5f3a" stroke="#40c060" stroke-width="2"/>
    <text x="900" y="212" text-anchor="middle" fill="#88ff88">__assign_cfs_rq_runtime</text>
    <text x="900" y="228" text-anchor="middle" fill="#88ff88" font-size="10">fair.c:5772 借 5 ms 判据③</text>
    <rect x="1000" y="196" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="1080" y="210" text-anchor="middle" fill="#88c0ff">distribute_cfs_runtime</text>
    <text x="1080" y="224" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:6191 逐核放回</text>

    <rect x="820" y="252" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="900" y="266" text-anchor="middle" fill="#88c0ff">借不到 → resched_curr</text>
    <text x="900" y="280" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:5826</text>
    <rect x="1000" y="246" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="1080" y="260" text-anchor="middle" fill="#88c0ff">unthrottle_cfs_rq(_async)</text>
    <text x="1080" y="274" text-anchor="middle" fill="#88c0ff" font-size="10">远端核走 IPI</text>

    <rect x="820" y="302" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="900" y="316" text-anchor="middle" fill="#88c0ff">put_prev_entity</text>
    <text x="900" y="330" text-anchor="middle" fill="#88c0ff" font-size="10">fair.c:5638 → check_cfs_rq_runtime :6488</text>
    <rect x="820" y="352" width="160" height="40" rx="3" fill="#5f1e1e" stroke="#c04040" stroke-width="2"/>
    <text x="900" y="368" text-anchor="middle" fill="#ff8888">throttle_cfs_rq</text>
    <text x="900" y="384" text-anchor="middle" fill="#ff8888" font-size="10">fair.c:5915 整组下树 判据③</text>
    <rect x="1000" y="302" width="160" height="34" rx="3" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="1080" y="316" text-anchor="middle" fill="#88c0ff">slack 定时器 5 ms</text>
    <text x="1080" y="330" text-anchor="middle" fill="#88c0ff" font-size="10">return_cfs_rq_runtime :6406</text>

    <rect x="820" y="420" width="340" height="60" rx="3" fill="#11161d" stroke="#8b949e"/>
    <text x="990" y="438" text-anchor="middle" fill="#e6edf3">层级:task_group sched.h:432,每核一个 se + cfs_rq</text>
    <text x="990" y="454" text-anchor="middle" fill="#8b949e" font-size="10">enqueue_task_fair :6955 逐层 for_each_sched_entity</text>
    <text x="990" y="470" text-anchor="middle" fill="#8b949e" font-size="10">calc_group_shares :4015 组权重按本核负载分摊</text>
    <rect x="820" y="502" width="340" height="34" rx="3" fill="#11161d" stroke="#8b949e"/>
    <text x="990" y="516" text-anchor="middle" fill="#e6edf3">旋钮:cpu.max → tg_set_cfs_bandwidth core.c:9298</text>
    <text x="990" y="530" text-anchor="middle" fill="#8b949e" font-size="10">cpu.stat → cpu_cfs_stat_show core.c:9583</text>
    <rect x="820" y="552" width="340" height="34" rx="3" fill="#11161d" stroke="#8b949e"/>
    <text x="990" y="566" text-anchor="middle" fill="#e6edf3">常数:slice 5 ms fair.c:124,period 100 ms :5731</text>
    <text x="990" y="580" text-anchor="middle" fill="#8b949e" font-size="10">min_cfs_rq_runtime 1 ms :6334,slack 5 ms :6338</text>
  </g>
  <g stroke="#4080c0" stroke-dasharray="6,4" fill="none">
