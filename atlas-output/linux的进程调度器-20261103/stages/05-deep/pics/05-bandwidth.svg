<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="640" fill="#0a0c10"/>
  <text x="600" y="28" text-anchor="middle" fill="#e6edf3" font-size="18">主线③ cpu.max 的一个周期:16 个线程同时忙,四种配置下"跑 / 停"的形状</text>
  <text x="600" y="48" text-anchor="middle" fill="#8b949e" font-size="11">每核向池借 5 ms 一片(__assign_cfs_rq_runtime fair.c:5772);池空 → throttle_cfs_rq :5915;period 定时器 :6518 → distribute_cfs_runtime :6191 放回</text>

  <!-- time axis 0..100 ms mapped to x 260..1140 (8.8 px/ms) -->
  <g stroke="#30363d">
    <line x1="260" y1="70" x2="260" y2="560"/>
    <line x1="480" y1="70" x2="480" y2="560" stroke-dasharray="3 3"/>
    <line x1="700" y1="70" x2="700" y2="560" stroke-dasharray="3 3"/>
    <line x1="920" y1="70" x2="920" y2="560" stroke-dasharray="3 3"/>
    <line x1="1140" y1="70" x2="1140" y2="560"/>
  </g>
  <g fill="#8b949e" font-size="10" text-anchor="middle">
    <text x="260" y="66">0 ms</text><text x="480" y="66">25</text><text x="700" y="66">50</text><text x="920" y="66">75</text><text x="1140" y="66">100 ms(period 到点)</text>
  </g>

  <!-- lane A: limits 2 -->
  <g font-size="11">
    <text x="30" y="100" fill="#e6edf3">A  limits.cpu = 2</text>
    <text x="30" y="116" fill="#8b949e" font-size="10">cpu.max = 200000 100000</text>
    <text x="30" y="130" fill="#8b949e" font-size="10">池 200 ms;16 核各借 5 ms</text>
    <rect x="260" y="92" width="110" height="30" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="315" y="111" text-anchor="middle" fill="#88c0ff" font-size="10">跑 12.5 ms</text>
    <rect x="370" y="92" width="770" height="30" fill="#5f1e1e" stroke="#c04040"/>
    <text x="755" y="111" text-anchor="middle" fill="#ff8888" font-size="10">整组 throttled 87.5 ms(16 个 cfs_rq 都在 throttled_cfs_rq 链表上)</text>
    <text x="30" y="150" fill="#ffaa55" font-size="10">16 × 12.5 = 200 ms 烧光;p99 ≈ 87.5 ms + 排队</text>
  </g>

  <!-- lane B: limits 4 -->
  <g font-size="11">
    <text x="30" y="196" fill="#e6edf3">B  limits.cpu = 4</text>
    <text x="30" y="212" fill="#8b949e" font-size="10">cpu.max = 400000 100000</text>
    <text x="30" y="226" fill="#8b949e" font-size="10">池 400 ms</text>
    <rect x="260" y="188" width="220" height="30" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="370" y="207" text-anchor="middle" fill="#88c0ff" font-size="10">跑 25 ms</text>
    <rect x="480" y="188" width="660" height="30" fill="#5f1e1e" stroke="#c04040"/>
    <text x="810" y="207" text-anchor="middle" fill="#ff8888" font-size="10">throttled 75 ms</text>
    <text x="30" y="246" fill="#ffaa55" font-size="10">What 的选择题:87.5 → 75,只少 14%;答案 C「变成另一种抖」</text>
  </g>

  <!-- lane C: period 10 ms -->
  <g font-size="11">
    <text x="30" y="292" fill="#e6edf3">C  period 缩到 10 ms</text>
    <text x="30" y="308" fill="#8b949e" font-size="10">cpu.max = 20000 10000</text>
    <text x="30" y="322" fill="#8b949e" font-size="10">池 20 ms;每 10 ms 补一次</text>
    <g>
      <rect x="260" y="284" width="11" height="30" fill="#1e3a5f" stroke="#4080c0"/><rect x="271" y="284" width="77" height="30" fill="#5f1e1e" stroke="#c04040"/>
      <rect x="348" y="284" width="11" height="30" fill="#1e3a5f" stroke="#4080c0"/><rect x="359" y="284" width="77" height="30" fill="#5f1e1e" stroke="#c04040"/>
      <rect x="436" y="284" width="11" height="30" fill="#1e3a5f" stroke="#4080c0"/><rect x="447" y="284" width="77" height="30" fill="#5f1e1e" stroke="#c04040"/>
      <rect x="524" y="284" width="11" height="30" fill="#1e3a5f" stroke="#4080c0"/><rect x="535" y="284" width="77" height="30" fill="#5f1e1e" stroke="#c04040"/>
      <rect x="612" y="284" width="11" height="30" fill="#1e3a5f" stroke="#4080c0"/><rect x="623" y="284" width="77" height="30" fill="#5f1e1e" stroke="#c04040"/>
      <rect x="700" y="284" width="11" height="30" fill="#1e3a5f" stroke="#4080c0"/><rect x="711" y="284" width="77" height="30" fill="#5f1e1e" stroke="#c04040"/>
      <rect x="788" y="284" width="11" height="30" fill="#1e3a5f" stroke="#4080c0"/><rect x="799" y="284" width="77" height="30" fill="#5f1e1e" stroke="#c04040"/>
      <rect x="876" y="284" width="11" height="30" fill="#1e3a5f" stroke="#4080c0"/><rect x="887" y="284" width="77" height="30" fill="#5f1e1e" stroke="#c04040"/>
      <rect x="964" y="284" width="11" height="30" fill="#1e3a5f" stroke="#4080c0"/><rect x="975" y="284" width="77" height="30" fill="#5f1e1e" stroke="#c04040"/>
      <rect x="1052" y="284" width="11" height="30" fill="#1e3a5f" stroke="#4080c0"/><rect x="1063" y="284" width="77" height="30" fill="#5f1e1e" stroke="#c04040"/>
    </g>
    <text x="30" y="342" fill="#ffaa55" font-size="10">每周期跑 1.25 ms、停 8.75 ms;p99 ≈ 9 ms;nr_throttled 每秒 +100;代价:借片 5 ms &gt; 每核应得 1.25 ms,碎片多</text>
  </g>

  <!-- lane D: burst -->
  <g font-size="11">
    <text x="30" y="388" fill="#e6edf3">D  cpu.max.burst = 200 ms</text>
    <text x="30" y="404" fill="#8b949e" font-size="10">前面周期没用完的攒着</text>
    <text x="30" y="418" fill="#8b949e" font-size="10">本周期池 = 200 + 200(runtime ≤ quota + burst :5762)</text>
    <rect x="260" y="380" width="220" height="30" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="370" y="399" text-anchor="middle" fill="#88c0ff" font-size="10">跑 25 ms(用掉攒的 200)</text>
    <rect x="480" y="380" width="660" height="30" fill="#5f1e1e" stroke="#c04040"/>
    <text x="810" y="399" text-anchor="middle" fill="#ff8888" font-size="10">throttled 75 ms;下个周期 burst 已空,回到 A 的形状</text>
    <text x="30" y="438" fill="#ffaa55" font-size="10">只对"偶发一次"的突发有效;持续突发第二个周期就打回原形。nr_bursts / burst_usec 记在 cpu.stat</text>
  </g>

  <!-- lane E: concurrency 2 -->
  <g font-size="11">
    <text x="30" y="484" fill="#e6edf3">E  并发压到 2 线程</text>
    <text x="30" y="500" fill="#8b949e" font-size="10">cpu.max 不变(200000 100000)</text>
    <text x="30" y="514" fill="#8b949e" font-size="10">线程池 / innodb_thread_concurrency</text>
    <rect x="260" y="476" width="880" height="30" fill="#1e3a5f" stroke="#4080c0"/>
    <text x="700" y="495" text-anchor="middle" fill="#88c0ff" font-size="10">2 线程 × 100 ms = 200 ms,正好用完池,永不 throttle;多出来的请求排在线程池队列里(排队时间可控)</text>
    <text x="30" y="534" fill="#88ff88" font-size="10">真正起作用的旋钮是并发数:throttle 当且仅当 同时忙的线程数 × 单线程速度 &gt; quota / period(= 等效核数)</text>
  </g>

  <!-- period timer note -->
  <rect x="260" y="548" width="880" height="1" fill="#30363d"/>
  <text x="700" y="566" text-anchor="middle" fill="#8b949e" font-size="10">t = 100 ms:sched_cfs_period_timer :6518 → do_sched_cfs_period_timer :6279 → __refill_cfs_bandwidth_runtime(池 = quota + 攒的 burst)→ distribute_cfs_runtime :6191 → 本核直接 unthrottle、远端核 unthrottle_cfs_rq_async(IPI)</text>
  <text x="700" y="582" text-anchor="middle" fill="#8b949e" font-size="10">cpu.stat:nr_periods +1 / nr_throttled +1(本周期发生过停)/ throttled_time += 87.5 ms × 16 个 cfs_rq 的各自时长(按 cfs_rq 累加,不是墙上时间)</text>

  <g font-size="10">
    <rect x="30" y="604" width="12" height="10" fill="#1e3a5f" stroke="#4080c0"/><text x="46" y="613" fill="#8b949e">组内线程在跑(16 核并行)</text>
    <rect x="220" y="604" width="12" height="10" fill="#5f1e1e" stroke="#c04040"/><text x="236" y="613" fill="#8b949e">整组 throttled</text>
    <text x="360" y="613" fill="#8b949e">横轴:墙上时间 0 ~ 100 ms(一个默认 period);行号为 v6.12 fair.c</text>
  </g>
</svg>
