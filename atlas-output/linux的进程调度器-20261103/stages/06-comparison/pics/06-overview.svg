<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="640" fill="#0a0c10"/>
  <text x="600" y="30" text-anchor="middle" fill="#e6edf3" font-size="19">四问并排:Linux 6.12 的答案 vs Windows NT dispatcher 的答案,每行一个判词</text>

  <!-- column headers -->
  <text x="60" y="62" fill="#8b949e" font-size="12">四问</text>
  <text x="400" y="62" text-anchor="middle" fill="#88c0ff" font-size="14">Linux 6.12(账)</text>
  <text x="860" y="62" text-anchor="middle" fill="#ffaa55" font-size="14">Windows NT(级)</text>
  <text x="1120" y="62" text-anchor="middle" fill="#8b949e" font-size="12">判词</text>
  <line x1="40" y1="70" x2="1160" y2="70" stroke="#30363d"/>

  <!-- row 1: when -->
  <text x="40" y="110" fill="#e6edf3" font-size="13">① 何时换</text>
  <rect x="180" y="84" width="440" height="70" rx="5" fill="#11161d" stroke="#30363d"/>
  <rect x="195" y="96" width="120" height="22" rx="3" fill="#5f3a1e" stroke="#c08040"/>
  <text x="255" y="111" text-anchor="middle" fill="#ffaa55" font-size="11">need_resched 旗</text>
  <line x1="315" y1="107" x2="365" y2="107" stroke="#c08040" stroke-dasharray="6,4"/>
  <rect x="365" y="96" width="120" height="22" rx="3" fill="#1e5f3a" stroke="#40c060"/>
  <text x="425" y="111" text-anchor="middle" fill="#88ff88" font-size="11">出口 schedule()</text>
  <text x="400" y="142" text-anchor="middle" fill="#8b949e" font-size="10">preempt_count ≠ 0 不换;tick 只记账打旗</text>
  <rect x="640" y="84" width="440" height="70" rx="5" fill="#11161d" stroke="#30363d"/>
  <rect x="655" y="96" width="130" height="22" rx="3" fill="#5f3a1e" stroke="#c08040"/>
  <text x="720" y="111" text-anchor="middle" fill="#ffaa55" font-size="11">DeferredReady→Standby</text>
  <line x1="785" y1="107" x2="835" y2="107" stroke="#c08040" stroke-dasharray="6,4"/>
  <rect x="835" y="96" width="130" height="22" rx="3" fill="#1e5f3a" stroke="#40c060"/>
  <text x="900" y="111" text-anchor="middle" fill="#88ff88" font-size="11">dispatch 中断换人</text>
  <text x="860" y="142" text-anchor="middle" fill="#8b949e" font-size="10">IRQL ≥ DISPATCH_LEVEL 不换;quantum end 在 DPC 里</text>
  <rect x="1090" y="100" width="70" height="26" rx="4" fill="#1e5f3a" stroke="#40c060"/>
  <text x="1125" y="117" text-anchor="middle" fill="#88ff88" font-size="11">必然</text>

  <!-- row 2: who -->
  <text x="40" y="214" fill="#e6edf3" font-size="13">② 换谁</text>
  <rect x="180" y="168" width="440" height="100" rx="5" fill="#11161d" stroke="#30363d"/>
  <line x1="200" y1="210" x2="600" y2="210" stroke="#4080c0"/>
  <line x1="400" y1="196" x2="400" y2="224" stroke="#88c0ff"/>
  <text x="400" y="190" text-anchor="middle" fill="#88c0ff" font-size="10">V(加权平均)</text>
  <circle cx="300" cy="210" r="6" fill="#1e3a5f" stroke="#4080c0"/>
  <text x="300" y="240" text-anchor="middle" fill="#88c0ff" font-size="10">lag &gt; 0 有资格</text>
  <circle cx="500" cy="210" r="6" fill="#5f1e1e" stroke="#c04040"/>
  <text x="500" y="240" text-anchor="middle" fill="#ff8888" font-size="10">lag &lt; 0 没资格</text>
  <text x="400" y="258" text-anchor="middle" fill="#8b949e" font-size="10">有资格里挑 deadline 最早;没有"你是谁"</text>
  <rect x="640" y="168" width="440" height="100" rx="5" fill="#11161d" stroke="#30363d"/>
  <g font-size="9" fill="#ffaa55">
    <rect x="660" y="248" width="60" height="10" fill="#3a1e5f" stroke="#8040c0"/><text x="690" y="245" text-anchor="middle">1~7</text>
    <rect x="725" y="236" width="60" height="22" fill="#3a1e5f" stroke="#8040c0"/><text x="755" y="233" text-anchor="middle">8 基线</text>
    <rect x="790" y="222" width="60" height="36" fill="#5f3a1e" stroke="#c08040"/><text x="820" y="219" text-anchor="middle">10 提升</text>
    <rect x="855" y="208" width="60" height="50" fill="#5f3a1e" stroke="#c08040"/><text x="885" y="205" text-anchor="middle">15 上限</text>
    <rect x="920" y="180" width="60" height="78" fill="#5f1e1e" stroke="#c04040"/><text x="950" y="177" text-anchor="middle">16~31 实时</text>
  </g>
  <path d="M 760 232 L 805 218" stroke="#40c060" fill="none" stroke-width="2"/>
  <text x="782" y="214" text-anchor="middle" fill="#88ff88" font-size="9">I/O 完成 +2</text>
  <path d="M 850 236 L 790 252" stroke="#c04040" fill="none" stroke-dasharray="4,3"/>
  <text x="1030" y="200" text-anchor="middle" fill="#8b949e" font-size="9">每片 −1 衰减</text>
  <text x="1030" y="214" text-anchor="middle" fill="#8b949e" font-size="9">最高级先跑</text>
  <text x="1030" y="228" text-anchor="middle" fill="#8b949e" font-size="9">同级轮转</text>
  <rect x="1090" y="200" width="70" height="26" rx="4" fill="#5f1e1e" stroke="#c04040"/>
  <text x="1125" y="217" text-anchor="middle" fill="#ff8888" font-size="11">偶然</text>
  <text x="1125" y="245" text-anchor="middle" fill="#8b949e" font-size="9">插队有界=必然</text>

  <!-- row 3: how much -->
  <text x="40" y="326" fill="#e6edf3" font-size="13">③ 各多少</text>
  <rect x="180" y="282" width="440" height="86" rx="5" fill="#11161d" stroke="#30363d"/>
  <text x="200" y="302" fill="#88c0ff" font-size="10">cpu.weight 1~10000 嵌套</text>
  <line x1="200" y1="330" x2="600" y2="330" stroke="#30363d"/>
  <rect x="200" y="318" width="50" height="24" fill="#1e3a5f" stroke="#4080c0"/>
  <rect x="250" y="318" width="150" height="24" fill="#5f1e1e" stroke="#c04040"/>
  <text x="325" y="334" text-anchor="middle" fill="#ff8888" font-size="10">整组停 87.5 ms</text>
  <rect x="400" y="318" width="50" height="24" fill="#1e3a5f" stroke="#4080c0"/>
  <text x="200" y="358" fill="#8b949e" font-size="10">cpu.max = 200 ms / 100 ms;每核借 5 ms 片;period_timer 放回</text>
  <rect x="640" y="282" width="440" height="86" rx="5" fill="#11161d" stroke="#30363d"/>
  <text x="660" y="302" fill="#ffaa55" font-size="10">Job Weight 1~9 / DFSS 按会话(互斥)</text>
  <line x1="660" y1="330" x2="1060" y2="330" stroke="#30363d"/>
  <rect x="660" y="318" width="50" height="24" fill="#5f3a1e" stroke="#c08040"/>
  <rect x="710" y="318" width="150" height="24" fill="#5f1e1e" stroke="#c04040"/>
  <text x="785" y="334" text-anchor="middle" fill="#ff8888" font-size="10">整 Job 停到 next interval</text>
  <rect x="860" y="318" width="50" height="24" fill="#5f3a1e" stroke="#c08040"/>
  <text x="660" y="358" fill="#8b949e" font-size="10">HARD_CAP CpuRate = 312 ‰(2 核 / 64 核);interval 长度未公开</text>
  <rect x="1090" y="310" width="70" height="26" rx="4" fill="#1e5f3a" stroke="#40c060"/>
  <text x="1125" y="327" text-anchor="middle" fill="#88ff88" font-size="11">封顶必然</text>
  <text x="1125" y="352" text-anchor="middle" fill="#8b949e" font-size="9">嵌套权重=Linux 选的</text>

  <!-- row 4: where -->
  <text x="40" y="440" fill="#e6edf3" font-size="13">④ 在哪换</text>
  <rect x="180" y="382" width="440" height="110" rx="5" fill="#11161d" stroke="#30363d"/>
  <g font-size="9">
    <rect x="200" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="220" y="419" text-anchor="middle" fill="#88ff88">rq0</text>
    <rect x="248" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="268" y="419" text-anchor="middle" fill="#88ff88">rq1</text>
    <rect x="296" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="316" y="419" text-anchor="middle" fill="#88ff88">rq2</text>
    <rect x="344" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="364" y="419" text-anchor="middle" fill="#88ff88">rq3</text>
    <rect x="412" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="432" y="419" text-anchor="middle" fill="#88ff88">rq4</text>
    <rect x="460" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="480" y="419" text-anchor="middle" fill="#88ff88">rq5</text>
    <rect x="508" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="528" y="419" text-anchor="middle" fill="#88ff88">rq6</text>
    <rect x="556" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="576" y="419" text-anchor="middle" fill="#88ff88">rq7</text>
  </g>
  <rect x="195" y="394" width="195" height="42" rx="4" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
  <rect x="407" y="394" width="195" height="42" rx="4" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
  <path d="M 364 440 Q 398 470 432 440" stroke="#40c060" fill="none" stroke-dasharray="6,4"/>
  <text x="398" y="462" text-anchor="middle" fill="#8b949e" font-size="9">MC 4 ms / PKG 8 ms 周期拉;17% 迟滞;只搬一半;0.5 ms 热</text>
  <text x="400" y="482" text-anchor="middle" fill="#8b949e" font-size="10">醒来:wake_affine 回原核或同 L3 空核</text>
  <rect x="640" y="382" width="440" height="110" rx="5" fill="#11161d" stroke="#30363d"/>
  <g font-size="9">
    <rect x="660" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="680" y="419" text-anchor="middle" fill="#88ff88">P0</text>
    <rect x="708" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="728" y="419" text-anchor="middle" fill="#88ff88">P1</text>
    <rect x="756" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="776" y="419" text-anchor="middle" fill="#88ff88">P2</text>
    <rect x="804" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="824" y="419" text-anchor="middle" fill="#88ff88">P3</text>
    <rect x="872" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="892" y="419" text-anchor="middle" fill="#88ff88">P4</text>
    <rect x="920" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="940" y="419" text-anchor="middle" fill="#88ff88">P5</text>
    <rect x="968" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="988" y="419" text-anchor="middle" fill="#88ff88">P6</text>
    <rect x="1016" y="400" width="40" height="30" rx="3" fill="#1e5f3a" stroke="#40c060"/><text x="1036" y="419" text-anchor="middle" fill="#88ff88">P7</text>
  </g>
  <path d="M 860 380 L 776 400" stroke="#c08040" fill="none"/>
  <text x="860" y="376" text-anchor="middle" fill="#ffaa55" font-size="9">就绪线程:理想核空→用;否则找空核;都忙→排理想核队列</text>
  <text x="860" y="462" text-anchor="middle" fill="#8b949e" font-size="9">核之间平时不互相看(无周期拉均衡,待核);每核 32 级队列 + 位图</text>
  <text x="860" y="482" text-anchor="middle" fill="#8b949e" font-size="10">理想处理器 / 上次处理器;CPU Sets 可保留核</text>
  <rect x="1090" y="424" width="70" height="26" rx="4" fill="#1e5f3a" stroke="#40c060"/>
  <text x="1125" y="441" text-anchor="middle" fill="#88ff88" font-size="11">队列必然</text>
  <text x="1125" y="466" text-anchor="middle" fill="#8b949e" font-size="9">周期均衡=偶然</text>

  <!-- NT-only boxes -->
  <rect x="640" y="508" width="200" height="50" rx="5" fill="#3a1e5f" stroke="#8040c0"/>
  <text x="740" y="528" text-anchor="middle" fill="#c088ff" font-size="11">MMCSS:留 20% 给普通任务</text>
  <text x="740" y="546" text-anchor="middle" fill="#c088ff" font-size="9">≈ Linux rt 类的 95% 阀(位置不同)</text>
  <rect x="880" y="508" width="200" height="50" rx="5" fill="#3a1e5f" stroke="#8040c0"/>
  <text x="980" y="528" text-anchor="middle" fill="#c088ff" font-size="11">SQLOS:每核一个协作式 scheduler</text>
  <text x="980" y="546" text-anchor="middle" fill="#c088ff" font-size="9">取消 C2;2016 LDF = lag</text>
  <rect x="180" y="508" width="440" height="50" rx="5" fill="#11161d" stroke="#30363d"/>
  <text x="400" y="528" text-anchor="middle" fill="#88c0ff" font-size="11">硬保证:dl 准入 + rt 95% 阀 + rt_mutex 继承</text>
  <text x="400" y="546" text-anchor="middle" fill="#8b949e" font-size="9">NT:16~31 无准入无阀;AutoBoost 地板</text>

  <!-- legend -->
  <g font-size="10">
    <rect x="40" y="590" width="14" height="12" fill="#5f3a1e" stroke="#c08040"/><text x="60" y="600" fill="#8b949e">标记 / 提升</text>
    <rect x="150" y="590" width="14" height="12" fill="#1e5f3a" stroke="#40c060"/><text x="170" y="600" fill="#8b949e">出口 / 每核队列 / 必然</text>
    <rect x="330" y="590" width="14" height="12" fill="#1e3a5f" stroke="#4080c0"/><text x="350" y="600" fill="#8b949e">账 / 有资格</text>
    <rect x="450" y="590" width="14" height="12" fill="#5f1e1e" stroke="#c04040"/><text x="470" y="600" fill="#8b949e">封顶停 / 没资格 / 偶然</text>
    <rect x="640" y="590" width="14" height="12" fill="#3a1e5f" stroke="#8040c0"/><text x="660" y="600" fill="#8b949e">优先级阶梯 / NT 独有</text>
  </g>
  <text x="600" y="628" text-anchor="middle" fill="#8b949e" font-size="11">必然 = 换一套血统也长成这样(C1 / C5 / C6 封顶 / C7 阀);偶然 = 血统或折中点(账 vs 级、周期均衡、嵌套权重、准入)</text>
</svg>
