<text x="32" y="592" fill="#c8d4e4" font-size="10">读法:① ② 和 page cache 的"原件"都在 1974 ~ 1992 之间定型,后面是修补;③ 在 2002 和 2013 被同一个人(Jens Axboe)重做了两遍,中间夹着整条调度器谱系;</text>
<text x="32" y="608" fill="#c8d4e4" font-size="10">④⑤ 最年轻 —— NVMe 2011 年才有,它一出现就把 ③ 逼成了多队列。五个转折点的人物:Kleiman / Tweedie 与 Tomas / Arcangeli 与 Linus / Axboe / Wilcox。</text>
<text x="32" y="624" fill="#6a7280" font-size="9">年份以一手资料为准(论文 / 邮件列表 / 发布说明),详见正文 §11。</text>
