<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="820" fill="#0a0c10"/>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4080c0"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#40c060"/></marker>
  </defs>
  <text x="600" y="32" fill="#e0e6f0" font-size="19" font-weight="bold" text-anchor="middle">③ 通用块层:一个 bio 从 submit_bio() 到驱动的路</text>

  <!-- top entry -->
  <rect x="40" y="56" width="250" height="60" rx="6" fill="#1e5f3a" stroke="#40c060" stroke-width="2"/>
  <text x="54" y="80" fill="#88ff88" font-size="13" font-weight="bold">入口 submit_bio(bio)</text>
  <text x="54" y="100" fill="#c8e4d0" font-size="11">来自 ②(ext4 / 预读 / 回写 / DIO)</text>

  <!-- step boxes across the top -->
  <rect x="320" y="56" width="200" height="60" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
  <text x="332" y="78" fill="#88c0ff" font-size="12" font-weight="bold">1 重映射 / 叠插</text>
  <text x="332" y="95" fill="#c8d4e4" font-size="10">分区起点加到扇区号</text>
  <text x="332" y="109" fill="#c8d4e4" font-size="10">dm / md:先交给它改写 bio</text>

  <rect x="550" y="56" width="200" height="60" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
  <text x="562" y="78" fill="#88c0ff" font-size="12" font-weight="bold">2 切分</text>
  <text x="562" y="95" fill="#c8d4e4" font-size="10">超过 max_sectors /</text>
  <text x="562" y="109" fill="#c8d4e4" font-size="10">max_segments → 拆成多个 bio</text>

  <rect x="780" y="56" width="200" height="60" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
  <text x="792" y="78" fill="#88c0ff" font-size="12" font-weight="bold">3 合并</text>
  <text x="792" y="95" fill="#c8d4e4" font-size="10">扇区相邻 + 同方向 → 并入</text>
  <text x="792" y="109" fill="#c8d4e4" font-size="10">已有 request(plug 里 / 队列里)</text>

  <rect x="1010" y="56" width="170" height="60" rx="6" fill="#5f3a1e" stroke="#c08040" stroke-width="2"/>
  <text x="1022" y="78" fill="#ffaa55" font-size="12" font-weight="bold">4 分配 request</text>
  <text x="1022" y="95" fill="#e8d0b0" font-size="10">先拿 tag(设备槽位号)</text>
  <text x="1022" y="109" fill="#e8d0b0" font-size="10">没 tag 就睡 = 背压</text>

  <line x1="290" y1="86" x2="320" y2="86" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="520" y1="86" x2="550" y2="86" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="750" y1="86" x2="780" y2="86" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="980" y1="86" x2="1010" y2="86" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <text x="865" y="136" fill="#9aa4b2" font-size="10">合并成功 → 到此结束,不再往下</text>

  <!-- plug -->
  <rect x="40" y="160" width="250" height="70" rx="6" fill="#5f3a1e" stroke="#c08040" stroke-width="2"/>
  <text x="54" y="182" fill="#ffaa55" font-size="12" font-weight="bold">5 plug(每任务的暂存篮)</text>
  <text x="54" y="200" fill="#e8d0b0" font-size="10">一批 bio 先攒在当前进程手里,</text>
  <text x="54" y="214" fill="#e8d0b0" font-size="10">便于合并;睡眠 / 返回用户态时倒出</text>

  <!-- scheduler -->
  <rect x="320" y="160" width="430" height="70" rx="6" fill="#3a1e5f" stroke="#8040c0" stroke-width="2"/>
  <text x="332" y="182" fill="#c088ff" font-size="12" font-weight="bold">6 IO 调度器(可插拔策略,按设备各选)</text>
  <text x="332" y="200" fill="#d8c8f0" font-size="10">none:直接放行 | mq-deadline:按扇区排序 + 截止时间</text>
  <text x="332" y="214" fill="#d8c8f0" font-size="10">kyber:按延迟目标限流 | bfq:按进程 / cgroup 公平分配</text>

  <!-- flush box -->
  <rect x="780" y="160" width="400" height="70" rx="6" fill="#5f1e1e" stroke="#c04040" stroke-width="2"/>
  <text x="792" y="182" fill="#ff8888" font-size="12" font-weight="bold">旁支:flush 机制(REQ_PREFLUSH / REQ_FUA)</text>
  <text x="792" y="200" fill="#f0c0c0" font-size="10">带这两个标记的写,块层拆成:先 Flush 命令 → 数据写 →</text>
  <text x="792" y="214" fill="#f0c0c0" font-size="10">(设备不支持 FUA 时)再 Flush;fsync 的保证从这里穿过</text>

  <line x1="165" y1="116" x2="165" y2="160" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="1095" y1="116" x2="1095" y2="140" stroke="#4080c0" stroke-width="2"/>
  <line x1="1095" y1="140" x2="165" y2="140" stroke="#4080c0" stroke-width="2"/>
  <line x1="290" y1="195" x2="320" y2="195" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>

  <!-- software queues -->
  <text x="40" y="270" fill="#c088ff" font-size="12" font-weight="bold">7 软件队列(每 CPU 一个,blk_mq_ctx)</text>
  <g fill="#3a1e5f" stroke="#8040c0" stroke-width="1.5">
    <rect x="40" y="280" width="90" height="36" rx="4"/><rect x="140" y="280" width="90" height="36" rx="4"/>
    <rect x="240" y="280" width="90" height="36" rx="4"/><rect x="340" y="280" width="90" height="36" rx="4"/>
  </g>
  <g fill="#d8c8f0" font-size="10">
    <text x="60" y="302">cpu0</text><text x="160" y="302">cpu1</text><text x="260" y="302">cpu2</text><text x="360" y="302">cpu3 …</text>
  </g>
  <line x1="535" y1="230" x2="535" y2="256" stroke="#4080c0" stroke-width="2"/>
  <line x1="535" y1="256" x2="385" y2="256" stroke="#4080c0" stroke-width="2"/>
  <line x1="385" y1="256" x2="385" y2="280" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>

  <!-- hardware queues -->
  <text x="40" y="356" fill="#c088ff" font-size="12" font-weight="bold">8 硬件队列(blk_mq_hw_ctx,数量 = 设备给的队列数)</text>
  <g fill="#1e3a5f" stroke="#4080c0" stroke-width="1.5">
    <rect x="40" y="366" width="190" height="40" rx="4"/><rect x="240" y="366" width="190" height="40" rx="4"/>
  </g>
  <text x="52" y="382" fill="#88c0ff" font-size="10" font-weight="bold">hctx0 → nvme SQ0</text>
  <text x="52" y="398" fill="#c8d4e4" font-size="10">tag 0..1023 位图</text>
  <text x="252" y="382" fill="#88c0ff" font-size="10" font-weight="bold">hctx1 → nvme SQ1 …</text>
  <text x="252" y="398" fill="#c8d4e4" font-size="10">NVMe:一核一队列;SATA:只有 1 个</text>
  <line x1="85" y1="316" x2="85" y2="366" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="185" y1="316" x2="185" y2="366" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="285" y1="316" x2="285" y2="366" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="385" y1="316" x2="385" y2="366" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <text x="440" y="392" fill="#9aa4b2" font-size="10">映射:ctx → hctx(多对一或一对一)</text>

  <!-- dispatch to driver -->
  <rect x="40" y="440" width="390" height="56" rx="6" fill="#1e5f3a" stroke="#40c060" stroke-width="2"/>
  <text x="54" y="462" fill="#88ff88" font-size="12" font-weight="bold">9 派发:blk_mq_ops.queue_rq(hctx, request)</text>
  <text x="54" y="482" fill="#c8e4d0" font-size="10">交给 ④;驱动说"资源不够"就退回队列稍后再试</text>
  <line x1="135" y1="406" x2="135" y2="440" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="335" y1="406" x2="335" y2="440" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>

  <!-- completion -->
  <rect x="40" y="520" width="390" height="56" rx="6" fill="#0f1a14" stroke="#40c060" stroke-width="1.5"/>
  <text x="54" y="542" fill="#88ff88" font-size="12" font-weight="bold">10 完成(从 ④ 的中断回来)</text>
  <text x="54" y="562" fill="#c8e4d0" font-size="10">blk_mq_complete_request → 释放 tag → 每个 bio 的 bi_end_io → 回 ②</text>
  <line x1="235" y1="520" x2="235" y2="496" stroke="#40c060" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ag)"/>

  <!-- structures column on the right -->
  <text x="800" y="270" fill="#e0e6f0" font-size="13" font-weight="bold">三个核心结构</text>

  <rect x="800" y="282" width="380" height="96" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
  <text x="812" y="302" fill="#88c0ff" font-size="12" font-weight="bold">struct bio —— "盘上这段 ↔ 内存这几页"</text>
  <text x="812" y="320" fill="#c8d4e4" font-size="10">bi_bdev        哪个块设备(含分区)</text>
  <text x="812" y="334" fill="#c8d4e4" font-size="10">bi_opf         READ / WRITE / FLUSH + 标记(RAHEAD, FUA…)</text>
  <text x="812" y="348" fill="#c8d4e4" font-size="10">bi_iter        起始扇区 + 总字节数 + 当前进度</text>
  <text x="812" y="362" fill="#c8d4e4" font-size="10">bi_io_vec[]    (page, len, offset) 数组   bi_end_io 完成回调</text>

  <rect x="800" y="392" width="380" height="96" rx="6" fill="#5f3a1e" stroke="#c08040" stroke-width="2"/>
  <text x="812" y="412" fill="#ffaa55" font-size="12" font-weight="bold">struct request —— 调度与派发的单位</text>
  <text x="812" y="430" fill="#e8d0b0" font-size="10">__sector / __data_len   合并后的起点与长度</text>
  <text x="812" y="444" fill="#e8d0b0" font-size="10">bio → biotail           串着 1 个或多个相邻 bio</text>
  <text x="812" y="458" fill="#e8d0b0" font-size="10">tag                     设备命令槽位号(= NVMe 的 cid)</text>
  <text x="812" y="472" fill="#e8d0b0" font-size="10">mq_hctx / timeout       归哪个硬件队列;超时处理</text>

  <rect x="800" y="502" width="380" height="110" rx="6" fill="#3a1e5f" stroke="#8040c0" stroke-width="2"/>
  <text x="812" y="522" fill="#c088ff" font-size="12" font-weight="bold">struct request_queue / gendisk —— 每个设备一份</text>
  <text x="812" y="540" fill="#d8c8f0" font-size="10">limits     max_sectors, max_segments, 逻辑块大小, 对齐(④ 填)</text>
  <text x="812" y="554" fill="#d8c8f0" font-size="10">elevator   当前调度器(sysfs 可切)</text>
  <text x="812" y="568" fill="#d8c8f0" font-size="10">tag_set    blk_mq_ops 表 + 队列数 + 队列深度(④ 填)</text>
  <text x="812" y="582" fill="#d8c8f0" font-size="10">hctx[]     硬件队列数组;  ctx[] 每 CPU 软件队列</text>
  <text x="812" y="596" fill="#d8c8f0" font-size="10">write cache / fua 能力  决定 flush 机制怎么拆</text>

  <!-- legend -->
  <g font-size="11">
    <rect x="40" y="700" width="14" height="14" fill="#1e3a5f" stroke="#4080c0"/><text x="60" y="711" fill="#88c0ff">固定机制 / 请求对象</text>
    <rect x="230" y="700" width="14" height="14" fill="#3a1e5f" stroke="#8040c0"/><text x="250" y="711" fill="#c088ff">队列 / 表 / 可插拔策略</text>
    <rect x="440" y="700" width="14" height="14" fill="#5f3a1e" stroke="#c08040"/><text x="460" y="711" fill="#ffaa55">元数据:tag / plug / limits</text>
    <rect x="660" y="700" width="14" height="14" fill="#5f1e1e" stroke="#c04040"/><text x="680" y="711" fill="#ff8888">flush 旁支</text>
    <rect x="800" y="700" width="14" height="14" fill="#1e5f3a" stroke="#40c060"/><text x="820" y="711" fill="#88ff88">入口 / 出口 / 完成</text>
    <text x="40" y="745" fill="#6a7280">读法:1~4 在提交者的进程上下文里同步做完;5~9 可能延后到 plug 倒出或队列运行时;10 在中断 / softirq 上下文。</text>
    <text x="40" y="765" fill="#6a7280">机制(1~5, 7~10)对所有设备一样;只有 6 按设备换策略,这是 C6·介质形状相反 在块层里唯一的落点。</text>
  </g>
</svg>
