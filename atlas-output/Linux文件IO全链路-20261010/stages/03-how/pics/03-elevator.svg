<text x="600" y="30" fill="#e0e6f0" font-size="18" font-weight="bold" text-anchor="middle">电梯算法:同一批请求,四种派发顺序,磁头走的路差 3 倍</text>
<text x="600" y="52" fill="#9aa4b2" font-size="12" text-anchor="middle">磁头在柱面 53;队列里依次到达:98, 183, 37, 122, 14, 124, 65, 67;盘面 0 ~ 199。横轴 = 柱面,每条泳道内自上而下 = 时间</text>
