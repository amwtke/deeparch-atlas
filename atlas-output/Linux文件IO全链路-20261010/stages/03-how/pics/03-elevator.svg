<text x="52" y="278" fill="#ffaa55" font-size="12" font-weight="bold">SSTF 最短寻道优先</text>
<text x="52" y="294" fill="#e8d0b0" font-size="10">每次挑离磁头最近的</text>
<text x="52" y="308" fill="#e8d0b0" font-size="10">隐患:远处的会饿死</text>
<text x="52" y="360" fill="#ffaa55" font-size="12" font-weight="bold">总移动 236</text>
