<rect x="40" y="380" width="1140" height="122" rx="6" fill="#12161c" stroke="#4080c0" stroke-width="1"/>
<text x="52" y="398" fill="#88c0ff" font-size="12" font-weight="bold">SCAN 电梯</text>
<text x="52" y="414" fill="#c8d4e4" font-size="10">先向 0 扫到底,折返向 199</text>
<text x="52" y="428" fill="#c8d4e4" font-size="10">顺路做完;不会饿死,但</text>
<text x="52" y="442" fill="#c8d4e4" font-size="10">刚扫过的位置要等一整圈</text>
<text x="52" y="490" fill="#88c0ff" font-size="12" font-weight="bold">总移动 236</text>
<polyline points="512.0,390 448.0,401 356.0,412 300.0,423 560.0,434 568.0,445 692.0,456 788.0,467 796.0,478 1032.0,489" fill="none" stroke="#4080c0" stroke-width="2"/>
<circle cx="512.0" cy="390" r="3" fill="#88c0ff"/>
<circle cx="448.0" cy="401" r="3" fill="#88c0ff"/>
<circle cx="356.0" cy="412" r="3" fill="#88c0ff"/>
<circle cx="300.0" cy="423" r="3" fill="#88c0ff"/>
<circle cx="560.0" cy="434" r="3" fill="#88c0ff"/>
<circle cx="568.0" cy="445" r="3" fill="#88c0ff"/>
<circle cx="692.0" cy="456" r="3" fill="#88c0ff"/>
<circle cx="788.0" cy="467" r="3" fill="#88c0ff"/>
<circle cx="796.0" cy="478" r="3" fill="#88c0ff"/>
<circle cx="1032.0" cy="489" r="3" fill="#88c0ff"/>
<text x="308.0" y="448" fill="#6a7280" font-size="9">到边 0(LOOK 变体在 14 就折返:208)</text>
<rect x="40" y="510" width="1140" height="112" rx="6" fill="#12161c" stroke="#8040c0" stroke-width="1"/>
<text x="52" y="528" fill="#c088ff" font-size="12" font-weight="bold">C-LOOK 单向电梯</text>
<text x="52" y="544" fill="#d8c8f0" font-size="10">只向一个方向做,做完</text>
<text x="52" y="558" fill="#d8c8f0" font-size="10">最远的直接跳回最近的</text>
<text x="52" y="572" fill="#d8c8f0" font-size="10">等待时间最均匀</text>
<text x="52" y="610" fill="#c088ff" font-size="12" font-weight="bold">总移动 322</text>
<polyline points="512.0,520 560.0,531 568.0,542 692.0,553 788.0,564 796.0,575 1032.0,586" fill="none" stroke="#8040c0" stroke-width="2"/>
<line x1="1032.0" y1="586" x2="356.0" y2="597" stroke="#8040c0" stroke-width="2" stroke-dasharray="6,4"/>
<polyline points="356.0,597 448.0,608" fill="none" stroke="#8040c0" stroke-width="2"/>
<circle cx="512.0" cy="520" r="3" fill="#c088ff"/>
<circle cx="560.0" cy="531" r="3" fill="#c088ff"/>
