<rect x="40" y="140" width="1140" height="112" rx="6" fill="#12161c" stroke="#c04040" stroke-width="1"/>
<text x="52" y="158" fill="#ff8888" font-size="12" font-weight="bold">FCFS 先来先服务</text>
<text x="52" y="174" fill="#f0c0c0" font-size="10">按到达顺序做</text>
<text x="52" y="240" fill="#ff8888" font-size="12" font-weight="bold">总移动 640</text>
