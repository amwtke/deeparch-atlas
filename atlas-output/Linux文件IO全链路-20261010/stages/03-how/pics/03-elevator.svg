<circle cx="692.0" cy="553" r="3" fill="#c088ff"/>
<circle cx="788.0" cy="564" r="3" fill="#c088ff"/>
<circle cx="796.0" cy="575" r="3" fill="#c088ff"/>
<circle cx="1032.0" cy="586" r="3" fill="#c088ff"/>
<circle cx="356.0" cy="597" r="3" fill="#c088ff"/>
<circle cx="448.0" cy="608" r="3" fill="#c088ff"/>
<text x="640" y="608" fill="#6a7280" font-size="9">空跑回最低位,不做事(Linux deadline 的派发就是这个形状)</text>
<rect x="40" y="648" width="1140" height="90" rx="6" fill="#12161c" stroke="#40c060" stroke-width="1.5"/>
<text x="52" y="668" fill="#88ff88" font-size="12" font-weight="bold">Linux 的做法(deadline / mq-deadline)= 单向电梯 + 截止时间</text>
<text x="52" y="688" fill="#c8e4d0" font-size="10">两套索引同时挂着同一批 request:① 按扇区排序的红黑树(读 / 写各一棵)—— 平时从上次派发的位置往上取,取到头回最低位,就是 C-LOOK;</text>
<text x="52" y="704" fill="#c8e4d0" font-size="10">② 按到达顺序的 FIFO(读 / 写各一条),每个 request 带截止时间(读 500 ms / 写 5 s)—— FIFO 头部到期了,就放下电梯先去做它。</text>
<text x="52" y="720" fill="#c8e4d0" font-size="10">于是:绝大多数时间磁头在顺路扫(吞吐),任何请求最多等一个截止时间(不饿死)。NVMe 上默认换成 none:没有磁头,排序只剩 CPU 开销和延迟。</text>
<text x="52" y="760" fill="#6a7280" font-size="10">数字来自教科书经典算例(Silberschatz, Operating System Concepts);C-SCAN(到边再跳)= 382。所有策略做的都是同一批 8 个请求,差别只在顺序。</text>
</svg>
