<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="1200" height="640" fill="#0a0c10"/>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4080c0"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#40c060"/></marker>
  </defs>
  <text x="600" y="32" fill="#e0e6f0" font-size="19" font-weight="bold" text-anchor="middle">pread(fd, buf, 4096, 8192) 的去程与回程:三件货物在五层间转手</text>

  <!-- column headers -->
  <text x="330" y="62" fill="#88c0ff" font-size="13" text-anchor="middle">去程 ↓(请求越往下越具体)</text>
  <text x="1010" y="62" fill="#88ff88" font-size="13" text-anchor="middle">回程 ↑(数据与"完成"往上送)</text>

  <!-- process -->
  <rect x="120" y="72" width="420" height="44" rx="6" fill="#1e5f3a" stroke="#40c060" stroke-width="2"/>
  <text x="140" y="100" fill="#88ff88" font-size="15" font-weight="bold">进程   pread(fd, buf, 4096, 8192)</text>

  <!-- syscall boundary -->
  <line x1="100" y1="130" x2="1180" y2="130" stroke="#6a7280" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="104" y="146" fill="#6a7280" font-size="11">系统调用边界</text>

  <!-- ① VFS -->
  <rect x="120" y="156" width="420" height="52" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
  <text x="140" y="178" fill="#88c0ff" font-size="15" font-weight="bold">① VFS</text>
  <text x="140" y="198" fill="#c8d4e4" font-size="12">fd → struct file → inode;调 f_op-&gt;read_iter</text>

  <!-- 货物1 -->
  <rect x="560" y="150" width="250" height="64" rx="6" fill="#3a1e5f" stroke="#8040c0" stroke-width="2"/>
  <text x="572" y="170" fill="#c088ff" font-size="13" font-weight="bold">货物 1:file + inode</text>
  <text x="572" y="188" fill="#d8c8f0" font-size="11">file:打开实例(f_pos, f_op)</text>
  <text x="572" y="204" fill="#d8c8f0" font-size="11">inode:对象(i_mapping, i_size)</text>

  <!-- ② FS + page cache -->
  <rect x="120" y="236" width="420" height="52" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
  <text x="140" y="258" fill="#88c0ff" font-size="15" font-weight="bold">② 文件系统 ext4</text>
  <text x="140" y="278" fill="#c8d4e4" font-size="12">偏移 8192 → 页号 2 → 查缓存 → 未命中 → extent → 盘上块</text>

  <rect x="560" y="236" width="250" height="52" rx="6" fill="#5f3a1e" stroke="#c08040" stroke-width="2"/>
  <text x="572" y="256" fill="#ffaa55" font-size="13" font-weight="bold">货物 2:folio(页)</text>
  <text x="572" y="274" fill="#e8d0b0" font-size="11">page cache 按 (inode, 页号) 索引</text>

  <!-- ③ block -->
  <rect x="120" y="316" width="420" height="52" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
  <text x="140" y="338" fill="#88c0ff" font-size="15" font-weight="bold">③ 通用块层</text>
  <text x="140" y="358" fill="#c8d4e4" font-size="12">bio → 切分 / 合并 → request + tag → 调度 → 硬件队列</text>

  <rect x="560" y="310" width="250" height="64" rx="6" fill="#3a1e5f" stroke="#8040c0" stroke-width="2"/>
  <text x="572" y="330" fill="#c088ff" font-size="13" font-weight="bold">货物 3:bio → request</text>
  <text x="572" y="348" fill="#d8c8f0" font-size="11">bio:扇区 655376 + 32 页(含预读)</text>
  <text x="572" y="364" fill="#d8c8f0" font-size="11">request:可派发单位,带 tag</text>

  <!-- ④ driver -->
  <rect x="120" y="396" width="420" height="52" rx="6" fill="#1e3a5f" stroke="#4080c0" stroke-width="2"/>
  <text x="140" y="418" fill="#88c0ff" font-size="15" font-weight="bold">④ nvme 驱动</text>
  <text x="140" y="438" fill="#c8d4e4" font-size="12">request → 64 B 读命令(SLBA, NLB, PRP)→ SQ → 敲门铃</text>

  <!-- ⑤ hw -->
  <rect x="120" y="476" width="420" height="52" rx="6" fill="#1e5f3a" stroke="#40c060" stroke-width="2"/>
  <text x="140" y="498" fill="#88ff88" font-size="15" font-weight="bold">⑤ NVMe SSD</text>
  <text x="140" y="518" fill="#c8e4d0" font-size="12">取命令 → 读闪存 → DMA 写进 folio → CQ 条目 → MSI-X 中断</text>

  <!-- down arrows -->
  <line x1="330" y1="116" x2="330" y2="152" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="330" y1="208" x2="330" y2="232" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="330" y1="288" x2="330" y2="312" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="330" y1="368" x2="330" y2="392" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="330" y1="448" x2="330" y2="472" stroke="#4080c0" stroke-width="2" marker-end="url(#ab)"/>

  <!-- links to cargo boxes -->
  <line x1="540" y1="182" x2="560" y2="182" stroke="#8040c0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="540" y1="262" x2="560" y2="262" stroke="#c08040" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="540" y1="342" x2="560" y2="342" stroke="#8040c0" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- return column -->
  <rect x="850" y="476" width="320" height="52" rx="6" fill="#0f1a14" stroke="#40c060" stroke-width="1.5"/>
  <text x="862" y="497" fill="#88ff88" font-size="12" font-weight="bold">⑤ DMA 已把数据放进 folio</text>
  <text x="862" y="516" fill="#c8e4d0" font-size="11">CQ 条目:cid(= tag) + 状态;发中断</text>

  <rect x="850" y="396" width="320" height="52" rx="6" fill="#0f1a14" stroke="#40c060" stroke-width="1.5"/>
  <text x="862" y="417" fill="#88ff88" font-size="12" font-weight="bold">④ nvme_irq:按 tag 找回 request</text>
  <text x="862" y="436" fill="#c8e4d0" font-size="11">blk_mq_complete_request()</text>

  <rect x="850" y="316" width="320" height="52" rx="6" fill="#0f1a14" stroke="#40c060" stroke-width="1.5"/>
  <text x="862" y="337" fill="#88ff88" font-size="12" font-weight="bold">③ 释放 tag;对每个 bio 调 bi_end_io</text>
  <text x="862" y="356" fill="#c8e4d0" font-size="11">request 用完回收</text>

  <rect x="850" y="236" width="320" height="52" rx="6" fill="#0f1a14" stroke="#40c060" stroke-width="1.5"/>
  <text x="862" y="257" fill="#88ff88" font-size="12" font-weight="bold">② folio 标 uptodate、解锁</text>
  <text x="862" y="276" fill="#c8e4d0" font-size="11">唤醒在 folio 上睡觉的进程</text>

  <rect x="850" y="156" width="320" height="52" rx="6" fill="#0f1a14" stroke="#40c060" stroke-width="1.5"/>
  <text x="862" y="177" fill="#88ff88" font-size="12" font-weight="bold">① copy_to_user(buf, folio 第 2 页)</text>
  <text x="862" y="196" fill="#c8e4d0" font-size="11">read_iter 返回 4096;f_pos 不变(pread)</text>

  <rect x="850" y="72" width="320" height="44" rx="6" fill="#1e5f3a" stroke="#40c060" stroke-width="2"/>
  <text x="862" y="100" fill="#88ff88" font-size="14" font-weight="bold">进程醒来,拿到 4096 字节</text>

  <line x1="1010" y1="476" x2="1010" y2="452" stroke="#40c060" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <line x1="1010" y1="396" x2="1010" y2="372" stroke="#40c060" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <line x1="1010" y1="316" x2="1010" y2="292" stroke="#40c060" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <line x1="1010" y1="236" x2="1010" y2="212" stroke="#40c060" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <line x1="1010" y1="156" x2="1010" y2="120" stroke="#40c060" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <line x1="540" y1="502" x2="850" y2="502" stroke="#40c060" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ag)"/>

  <!-- legend -->
  <g font-size="11">
    <rect x="120" y="572" width="14" height="14" fill="#1e3a5f" stroke="#4080c0"/><text x="140" y="583" fill="#88c0ff">五层(软件)</text>
    <rect x="250" y="572" width="14" height="14" fill="#1e5f3a" stroke="#40c060"/><text x="270" y="583" fill="#88ff88">两端 / 回程</text>
    <rect x="380" y="572" width="14" height="14" fill="#3a1e5f" stroke="#8040c0"/><text x="400" y="583" fill="#c088ff">货物 1、3:对象 / 包裹</text>
    <rect x="580" y="572" width="14" height="14" fill="#5f3a1e" stroke="#c08040"/><text x="600" y="583" fill="#ffaa55">货物 2:页(缓存单元 = DMA 目标)</text>
    <text x="120" y="612" fill="#6a7280">主线:缓冲读未命中。命中时 ② 直接走到右侧 ①,③④⑤ 不被惊动。扇区 655376 = 盘上块 81922 × 8。</text>
  </g>
</svg>
