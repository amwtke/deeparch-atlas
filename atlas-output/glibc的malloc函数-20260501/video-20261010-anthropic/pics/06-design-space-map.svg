<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Noto Sans CJK SC"><rect width="1920" height="1080" fill="#F5F0E8"/><text x="65" y="75" font-size="44" fill="#2B2620" font-weight="bold">设计空间：用独立维度比较，别把方案排成单一名次</text><text x="65" y="125" font-size="25" fill="#6B5D4F" font-weight="normal">保留原文“元数据契约 × 归还策略”的问题；这些是可配置行为，图中位置不是永久物理常数。</text><rect x="65" y="175" width="285" height="139" fill="#E8DFD0" stroke="#D8CCBA"/><text x="81" y="214" font-size="25" fill="#C15F3C" font-weight="bold">方案</text><rect x="350" y="175" width="495" height="139" fill="#E8DFD0" stroke="#D8CCBA"/><text x="366" y="214" font-size="24" fill="#C15F3C" font-weight="bold">接口与元数据</text><rect x="845" y="175" width="520" height="139" fill="#E8DFD0" stroke="#D8CCBA"/><text x="861" y="214" font-size="24" fill="#C15F3C" font-weight="bold">局部化 / 并发</text><rect x="1365" y="175" width="490" height="139" fill="#E8DFD0" stroke="#D8CCBA"/><text x="1381" y="214" font-size="24" fill="#C15F3C" font-weight="bold">归还与容器边界</text><rect x="65" y="314" width="285" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="81" y="353" font-size="25" fill="#2B2620" font-weight="normal">ptmalloc</text><rect x="350" y="314" width="495" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="366" y="353" font-size="24" fill="#2B2620" font-weight="normal">free(p) 反查</text><text x="366" y="387" font-size="24" fill="#2B2620" font-weight="normal">内联块头</text><rect x="845" y="314" width="520" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="861" y="353" font-size="24" fill="#2B2620" font-weight="normal">线程缓存 + 多 arena</text><text x="861" y="387" font-size="24" fill="#2B2620" font-weight="normal">不等于无限扩展</text><rect x="1365" y="314" width="490" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1381" y="353" font-size="24" fill="#2B2620" font-weight="normal">trim / mmap 归还</text><text x="1381" y="387" font-size="24" fill="#2B2620" font-weight="normal">由路径与阈值决定</text><rect x="65" y="453" width="285" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="81" y="492" font-size="25" fill="#2B2620" font-weight="normal">jemalloc</text><rect x="350" y="453" width="495" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="366" y="492" font-size="24" fill="#2B2620" font-weight="normal">外置元数据与 size class</text><text x="366" y="526" font-size="24" fill="#2B2620" font-weight="normal">仍兼容 malloc/free</text><rect x="845" y="453" width="520" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="861" y="492" font-size="24" fill="#2B2620" font-weight="normal">thread caches + arenas</text><text x="861" y="526" font-size="24" fill="#2B2620" font-weight="normal">percpu_arena 可选</text><rect x="1365" y="453" width="490" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1381" y="492" font-size="24" fill="#2B2620" font-weight="normal">dirty/muzzy decay 等</text><text x="1381" y="526" font-size="24" fill="#2B2620" font-weight="normal">需结合配置与负载</text><rect x="65" y="592" width="285" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="81" y="631" font-size="25" fill="#2B2620" font-weight="normal">TCMalloc</text><rect x="350" y="592" width="495" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="366" y="631" font-size="24" fill="#2B2620" font-weight="normal">页到 span 等反查</text><text x="366" y="665" font-size="24" fill="#2B2620" font-weight="normal">仍兼容 malloc/free</text><rect x="845" y="592" width="520" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="861" y="631" font-size="24" fill="#2B2620" font-weight="normal">现代 Google per-CPU</text><text x="861" y="665" font-size="24" fill="#2B2620" font-weight="normal">gperftools per-thread</text><rect x="1365" y="592" width="490" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1381" y="631" font-size="24" fill="#2B2620" font-weight="normal">回收策略与配置有关</text><text x="1381" y="665" font-size="24" fill="#2B2620" font-weight="normal">不是固定归还时延</text><rect x="65" y="731" width="285" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="81" y="770" font-size="25" fill="#2B2620" font-weight="normal">mimalloc</text><rect x="350" y="731" width="495" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="366" y="770" font-size="24" fill="#2B2620" font-weight="normal">页组织与尺寸类别</text><text x="366" y="804" font-size="24" fill="#2B2620" font-weight="normal">仍兼容 malloc/free</text><rect x="845" y="731" width="520" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="861" y="770" font-size="24" fill="#2B2620" font-weight="normal">线程局部管理</text><text x="861" y="804" font-size="24" fill="#2B2620" font-weight="normal">页内分片空闲链</text><rect x="1365" y="731" width="490" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1381" y="770" font-size="24" fill="#2B2620" font-weight="normal">purge 策略可配置</text><text x="1381" y="804" font-size="24" fill="#2B2620" font-weight="normal">不保证固定 RSS</text><rect x="65" y="870" width="285" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="81" y="909" font-size="25" fill="#2B2620" font-weight="normal">Go / Rust</text><rect x="350" y="870" width="495" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="366" y="909" font-size="24" fill="#2B2620" font-weight="normal">Go：运行时类型与 GC</text><text x="366" y="943" font-size="24" fill="#2B2620" font-weight="normal">Rust：Layout 是契约</text><rect x="845" y="870" width="520" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="861" y="909" font-size="24" fill="#2B2620" font-weight="normal">Go：mcache/per-P 等</text><text x="861" y="943" font-size="24" fill="#2B2620" font-weight="normal">Rust：取决于实现</text><rect x="1365" y="870" width="490" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1381" y="909" font-size="24" fill="#2B2620" font-weight="normal">GOMEMLIMIT 是软限制</text><text x="1381" y="943" font-size="24" fill="#2B2620" font-weight="normal">Rust：取决于底层分配器</text><text x="65" y="1030" font-size="23" fill="#6B5D4F" font-weight="normal">GOMEMLIMIT 不等于自动读取 cgroup，也不是进程 RSS 硬上限；容器限制须由部署与应用层共同提供。</text></svg>