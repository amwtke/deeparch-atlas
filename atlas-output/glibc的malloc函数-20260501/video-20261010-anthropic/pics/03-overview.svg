<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Noto Sans CJK SC"><rect width="1920" height="1080" fill="#F5F0E8"/><text x="65" y="75" font-size="44" fill="#2B2620" font-weight="bold">四件事骨架：chunk + bin + arena + tcache</text><text x="65" y="125" font-size="25" fill="#6B5D4F" font-weight="normal">glibc 2.34 / Linux LP64；默认参数是条件，不是永久不变量。</text><rect x="65" y="175" width="1790" height="125" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="219" font-size="30" fill="#C15F3C" font-weight="bold">进程边界：内核提供虚拟地址空间隔离</text><text x="90" y="267" font-size="25" fill="#2B2620" font-weight="normal">malloc 管理本进程可用的虚拟内存；驻留物理页与页表由内核管理。</text><rect x="65" y="340" width="560" height="170" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="384" font-size="30" fill="#C15F3C" font-weight="bold">线程 1 的 tcache</text><text x="90" y="432" font-size="23" fill="#2B2620" font-weight="normal">每线程一份指针索引；命中时不取 arena 锁</text><text x="90" y="471" font-size="23" fill="#2B2620" font-weight="normal">默认 64 桶，每桶上限 7；命中率取决于负载</text><rect x="665" y="340" width="560" height="170" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="690" y="384" font-size="30" fill="#C15F3C" font-weight="bold">线程 2 的 tcache</text><text x="690" y="432" font-size="23" fill="#2B2620" font-weight="normal">每线程一份指针索引；命中时不取 arena 锁</text><text x="690" y="471" font-size="23" fill="#2B2620" font-weight="normal">默认 64 桶，每桶上限 7；命中率取决于负载</text><rect x="1265" y="340" width="560" height="170" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="1290" y="384" font-size="30" fill="#C15F3C" font-weight="bold">线程 3 的 tcache</text><text x="1290" y="432" font-size="23" fill="#2B2620" font-weight="normal">每线程一份指针索引；命中时不取 arena 锁</text><text x="1290" y="471" font-size="23" fill="#2B2620" font-weight="normal">默认 64 桶，每桶上限 7；命中率取决于负载</text><path d="M340,510 L340,570" stroke="#C15F3C" stroke-width="4" fill="none"/><path d="M331,556 L340,570 L349,556" fill="none" stroke="#C15F3C" stroke-width="4"/><text x="352.0" y="532.0" font-size="22" fill="#6B5D4F" font-weight="normal">未命中</text><path d="M950,510 L950,570" stroke="#C15F3C" stroke-width="4" fill="none"/><path d="M941,556 L950,570 L959,556" fill="none" stroke="#C15F3C" stroke-width="4"/><text x="962.0" y="532.0" font-size="22" fill="#6B5D4F" font-weight="normal">未命中</text><rect x="65" y="570" width="850" height="345" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="614" font-size="30" fill="#C15F3C" font-weight="bold">main_arena：池状态 + 一把锁 + 关联 heap</text><text x="90" y="662" font-size="25" fill="#2B2620" font-weight="normal">控制面：mutex / top / binmap / next / system_mem</text><text x="90" y="703" font-size="25" fill="#2B2620" font-weight="normal">空闲索引：fastbinsY + unsorted / small / large bins</text><text x="90" y="744" font-size="25" fill="#2B2620" font-weight="normal">物理载体：in-use 与 free chunks + top chunk</text><text x="90" y="785" font-size="25" fill="#2B2620" font-weight="normal">空间不足：主 arena 可经 brk 扩展，也可能用 mmap</text><text x="90" y="826" font-size="25" fill="#2B2620" font-weight="normal">tcache 里的 chunk 仍属于原 arena 的 heap</text><rect x="955" y="570" width="900" height="345" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="980" y="614" font-size="30" fill="#C15F3C" font-weight="bold">线程 arena：相同索引结构，独立池锁</text><text x="980" y="662" font-size="25" fill="#2B2620" font-weight="normal">多个线程可共享 arena；并非一个线程必须一个池</text><text x="980" y="703" font-size="25" fill="#2B2620" font-weight="normal">非主 arena 的 heap 区域通常由 mmap 获取</text><text x="980" y="744" font-size="25" fill="#2B2620" font-weight="normal">arena 达到上限后复用；64 位默认上限按 CPU 数算</text><text x="980" y="785" font-size="25" fill="#2B2620" font-weight="normal">池分片减少竞争，也可能增加驻留量与碎片</text><text x="980" y="826" font-size="25" fill="#2B2620" font-weight="normal">tcache 是线程旁路，不是 arena 内的子池</text><text x="65" y="1030" font-size="23" fill="#6B5D4F" font-weight="normal">物理字节由 chunk 表示，空闲查找由 bin 表示，池与锁由 arena 表示，线程快路径由 tcache 表示。</text></svg>