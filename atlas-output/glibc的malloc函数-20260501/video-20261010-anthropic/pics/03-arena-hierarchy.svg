<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Noto Sans CJK SC"><rect width="1920" height="1080" fill="#F5F0E8"/><text x="65" y="75" font-size="44" fill="#2B2620" font-weight="bold">层级与所有权：线程缓存旁路，arena 容纳索引与 heap</text><text x="65" y="125" font-size="25" fill="#6B5D4F" font-weight="normal">按 glibc 2.34 / LP64 校正原图桶号、尺寸和内核锁表示；小块快路径仍有边界。</text><rect x="65" y="175" width="1790" height="135" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="219" font-size="30" fill="#C15F3C" font-weight="bold">线程维度：tcache entries[64] + counts[64]</text><text x="90" y="267" font-size="25" fill="#2B2620" font-weight="normal">默认每桶最多 7 个 chunk；桶 0 对应 32 B chunk，桶 1 对应 48 B chunk；先查线程缓存，再进入池。</text><rect x="65" y="345" width="1790" height="125" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="389" font-size="30" fill="#C15F3C" font-weight="bold">arena 控制面：struct malloc_state</text><text x="90" y="437" font-size="24" fill="#2B2620" font-weight="normal">mutex / flags / have_fastchunks / top / last_remainder / binmap / next / next_free / attached_threads / system_mem</text><rect x="65" y="505" width="565" height="290" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="549" font-size="30" fill="#C15F3C" font-weight="bold">fastbinsY：独立指针数组</text><text x="90" y="597" font-size="25" fill="#2B2620" font-weight="normal">同桶同大小，单链表 LIFO</text><text x="90" y="638" font-size="25" fill="#2B2620" font-weight="normal">LP64 桶步长 16 B，首桶 32 B</text><text x="90" y="679" font-size="25" fill="#2B2620" font-weight="normal">释放时通常先不合并</text><text x="90" y="720" font-size="25" fill="#2B2620" font-weight="normal">分配路径可带原子链头操作</text><text x="90" y="761" font-size="25" fill="#2B2620" font-weight="normal">与双链表 bins 的布局不同</text><rect x="665" y="505" width="580" height="290" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="690" y="549" font-size="30" fill="#C15F3C" font-weight="bold">bins：双链表哨兵数组</text><text x="690" y="597" font-size="25" fill="#2B2620" font-weight="normal">unsorted：归类前的一次暂存机会</text><text x="690" y="638" font-size="25" fill="#2B2620" font-weight="normal">small：固定 chunk 尺寸</text><text x="690" y="679" font-size="25" fill="#2B2620" font-weight="normal">large：范围桶 + 有序索引</text><text x="690" y="720" font-size="25" fill="#2B2620" font-weight="normal">LP64 smallbin 边界为 1024 B</text><text x="690" y="761" font-size="25" fill="#2B2620" font-weight="normal">bin 编号与 C 数组偏移不同</text><rect x="1280" y="505" width="575" height="290" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="1305" y="549" font-size="30" fill="#C15F3C" font-weight="bold">chunk 与 heap：物理载体</text><text x="1305" y="597" font-size="25" fill="#2B2620" font-weight="normal">同一 heap 内的块按地址相邻</text><text x="1305" y="638" font-size="25" fill="#2B2620" font-weight="normal">在用块不挂空闲 bin 链</text><text x="1305" y="679" font-size="25" fill="#2B2620" font-weight="normal">已释放块可挂 tcache / bin</text><text x="1305" y="720" font-size="25" fill="#2B2620" font-weight="normal">top 是尚未切给应用的尾部</text><text x="1305" y="761" font-size="25" fill="#2B2620" font-weight="normal">非主 arena 可关联多个 heap</text><rect x="65" y="830" width="1790" height="130" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="874" font-size="30" fill="#C15F3C" font-weight="bold">两个独立维度，不要把逻辑链表误认为物理连续</text><text x="90" y="922" font-size="25" fill="#2B2620" font-weight="normal">tcache 的所有权属于当前线程；chunk 所属 arena 由地址和元数据确定，跨线程释放不改变这一归属。</text><text x="65" y="1030" font-size="23" fill="#6B5D4F" font-weight="normal">fastbinsY 与 bins 分离首先服务不同链表和操作语义；布局紧凑是收益，固定 cache line 偏移不是跨平台保证。</text></svg>