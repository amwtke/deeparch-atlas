<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Noto Sans CJK SC"><rect width="1920" height="1080" fill="#F5F0E8"/><text x="65" y="75" font-size="44" fill="#2B2620" font-weight="bold">三条路径：缓存命中、arena 管理、独立 mmap</text><text x="65" y="125" font-size="25" fill="#6B5D4F" font-weight="normal">固定 glibc 2.34 / Linux LP64；展示条件路径，成本差异须用目标负载实测。</text><rect x="65" y="190" width="570" height="700" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="234" font-size="30" fill="#C15F3C" font-weight="bold">缓存命中：malloc(24)</text><text x="90" y="282" font-size="25" fill="#2B2620" font-weight="normal">__libc_malloc：请求规范化</text><text x="90" y="323" font-size="25" fill="#2B2620" font-weight="normal">LP64：24 → 32 B chunk</text><text x="90" y="364" font-size="25" fill="#2B2620" font-weight="normal">csize2tidx(32) → 桶 0</text><text x="90" y="405" font-size="25" fill="#2B2620" font-weight="normal">tcache 存在，桶内有可复用块</text><text x="90" y="446" font-size="25" fill="#2B2620" font-weight="normal">tcache_get(0) 弹出缓存块</text><text x="90" y="487" font-size="25" fill="#2B2620" font-weight="normal">返回已经是用户指针的 e</text><text x="90" y="528" font-size="25" fill="#2B2620" font-weight="normal">不进入 arena 锁 / 不调用内核</text><text x="90" y="569" font-size="25" fill="#2B2620" font-weight="normal">free：_int_free → tcache_put</text><text x="90" y="610" font-size="25" fill="#2B2620" font-weight="normal">前提：未超范围，缓存尚未满</text><rect x="670" y="190" width="570" height="700" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="695" y="234" font-size="30" fill="#C15F3C" font-weight="bold">池内查找 / 扩展：malloc(8KB)</text><text x="695" y="282" font-size="25" fill="#2B2620" font-weight="normal">__libc_malloc → arena_get</text><text x="695" y="323" font-size="25" fill="#2B2620" font-weight="normal">多线程路径获取 arena mutex</text><text x="695" y="364" font-size="25" fill="#2B2620" font-weight="normal">_int_malloc：bins → top</text><text x="695" y="405" font-size="25" fill="#2B2620" font-weight="normal">能复用就不必发生 syscall</text><text x="695" y="446" font-size="25" fill="#2B2620" font-weight="normal">main arena 的 top 不足时</text><text x="695" y="487" font-size="25" fill="#2B2620" font-weight="normal">sysmalloc 可经 MORECORE/brk</text><text x="695" y="528" font-size="25" fill="#2B2620" font-weight="normal">非主 arena 通常扩 mmap heap</text><text x="695" y="569" font-size="25" fill="#2B2620" font-weight="normal">free：缓存/合并/池内复用</text><text x="695" y="610" font-size="25" fill="#2B2620" font-weight="normal">不是每次 8KB 都必然 brk</text><rect x="1275" y="190" width="570" height="700" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="1300" y="234" font-size="30" fill="#C15F3C" font-weight="bold">独立映射：malloc(200KB)</text><text x="1300" y="282" font-size="25" fill="#2B2620" font-weight="normal">先进入分配入口与池内查找</text><text x="1300" y="323" font-size="25" fill="#2B2620" font-weight="normal">无法复用且达到映射条件时</text><text x="1300" y="364" font-size="25" fill="#2B2620" font-weight="normal">sysmalloc → mmap 分支</text><text x="1300" y="405" font-size="25" fill="#2B2620" font-weight="normal">检查阈值、计数与失败回退</text><text x="1300" y="446" font-size="25" fill="#2B2620" font-weight="normal">页对齐映射，设置 IS_MMAPPED</text><text x="1300" y="487" font-size="25" fill="#2B2620" font-weight="normal">独立于 arena heap 的映射</text><text x="1300" y="528" font-size="25" fill="#2B2620" font-weight="normal">free：__libc_free 检查标志</text><text x="1300" y="569" font-size="25" fill="#2B2620" font-weight="normal">munmap_chunk → munmap</text><text x="1300" y="610" font-size="25" fill="#2B2620" font-weight="normal">阈值可动态变化，RSS看触页</text><text x="65" y="955" font-size="26" fill="#6B5D4F" font-weight="normal">请求大小只是路由条件之一；缓存状态、池内空闲块、阈值、映射上限与初始化都会改变实际路径。</text><text x="65" y="1030" font-size="23" fill="#6B5D4F" font-weight="normal">mmap 分支不保证绕过 arena 锁；这里的 tcache_get 与桶号来自固定版本源码，而非后续版本的 tcache_get_n。</text></svg>