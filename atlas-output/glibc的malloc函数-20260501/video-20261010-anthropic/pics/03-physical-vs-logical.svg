<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Noto Sans CJK SC"><rect width="1920" height="1080" fill="#F5F0E8"/><text x="65" y="75" font-size="44" fill="#2B2620" font-weight="bold">物理布局与逻辑索引：同一组 chunk 的两个视角</text><text x="65" y="125" font-size="25" fill="#6B5D4F" font-weight="normal">glibc 2.34 / LP64；示意块尺寸满足 16 B 对齐，未按尺寸比例绘制。</text><rect x="65" y="210" width="165" height="215" rx="18" fill="#E8DFD0" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="254" font-size="30" fill="#C15F3C" font-weight="bold">A</text><text x="90" y="302" font-size="23" fill="#2B2620" font-weight="normal">32 B</text><text x="90" y="341" font-size="23" fill="#2B2620" font-weight="normal">在用</text><rect x="244" y="210" width="165" height="215" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="269" y="254" font-size="30" fill="#C15F3C" font-weight="bold">B</text><text x="269" y="302" font-size="23" fill="#2B2620" font-weight="normal">48 B</text><text x="269" y="341" font-size="23" fill="#2B2620" font-weight="normal">fastbin</text><rect x="423" y="210" width="165" height="215" rx="18" fill="#E8DFD0" stroke="#D8CCBA" stroke-width="2"/><text x="448" y="254" font-size="30" fill="#C15F3C" font-weight="bold">C</text><text x="448" y="302" font-size="23" fill="#2B2620" font-weight="normal">64 B</text><text x="448" y="341" font-size="23" fill="#2B2620" font-weight="normal">在用</text><rect x="602" y="210" width="165" height="215" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="627" y="254" font-size="30" fill="#C15F3C" font-weight="bold">D</text><text x="627" y="302" font-size="23" fill="#2B2620" font-weight="normal">1280 B</text><text x="627" y="341" font-size="23" fill="#2B2620" font-weight="normal">unsorted</text><rect x="781" y="210" width="165" height="215" rx="18" fill="#E8DFD0" stroke="#D8CCBA" stroke-width="2"/><text x="806" y="254" font-size="30" fill="#C15F3C" font-weight="bold">E</text><text x="806" y="302" font-size="23" fill="#2B2620" font-weight="normal">32 B</text><text x="806" y="341" font-size="23" fill="#2B2620" font-weight="normal">在用</text><rect x="960" y="210" width="165" height="215" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="985" y="254" font-size="30" fill="#C15F3C" font-weight="bold">F</text><text x="985" y="302" font-size="23" fill="#2B2620" font-weight="normal">80 B</text><text x="985" y="341" font-size="23" fill="#2B2620" font-weight="normal">smallbin</text><rect x="1139" y="210" width="165" height="215" rx="18" fill="#E8DFD0" stroke="#D8CCBA" stroke-width="2"/><text x="1164" y="254" font-size="30" fill="#C15F3C" font-weight="bold">G</text><text x="1164" y="302" font-size="23" fill="#2B2620" font-weight="normal">208 B</text><text x="1164" y="341" font-size="23" fill="#2B2620" font-weight="normal">在用</text><rect x="1318" y="210" width="165" height="215" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="1343" y="254" font-size="30" fill="#C15F3C" font-weight="bold">H</text><text x="1343" y="302" font-size="23" fill="#2B2620" font-weight="normal">96 B</text><text x="1343" y="341" font-size="23" fill="#2B2620" font-weight="normal">smallbin</text><rect x="1497" y="210" width="165" height="215" rx="18" fill="#E8DFD0" stroke="#D8CCBA" stroke-width="2"/><text x="1522" y="254" font-size="30" fill="#C15F3C" font-weight="bold">I</text><text x="1522" y="302" font-size="23" fill="#2B2620" font-weight="normal">608 B</text><text x="1522" y="341" font-size="23" fill="#2B2620" font-weight="normal">在用</text><rect x="1676" y="210" width="165" height="215" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="1701" y="254" font-size="30" fill="#C15F3C" font-weight="bold">top</text><text x="1701" y="302" font-size="23" fill="#2B2620" font-weight="normal">未分配</text><text x="1701" y="341" font-size="23" fill="#2B2620" font-weight="normal">尾部</text><text x="65" y="470" font-size="28" fill="#6B5D4F" font-weight="normal">低虚拟地址 → 高虚拟地址：这里画的是 heap 内的字节布局，不是物理页帧。</text><rect x="65" y="560" width="415" height="260" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="604" font-size="30" fill="#C15F3C" font-weight="bold">fastbinsY[1]</text><text x="90" y="652" font-size="25" fill="#2B2620" font-weight="normal">链头 → B</text><text x="90" y="693" font-size="25" fill="#2B2620" font-weight="normal">48 B chunk</text><text x="90" y="734" font-size="25" fill="#2B2620" font-weight="normal">单链表 / 延迟合并</text><rect x="515" y="560" width="415" height="260" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="540" y="604" font-size="30" fill="#C15F3C" font-weight="bold">unsorted bin</text><text x="540" y="652" font-size="25" fill="#2B2620" font-weight="normal">哨兵 ⇄ D</text><text x="540" y="693" font-size="25" fill="#2B2620" font-weight="normal">不同大小均可暂存</text><text x="540" y="734" font-size="25" fill="#2B2620" font-weight="normal">归类前的复用机会</text><rect x="965" y="560" width="415" height="260" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="990" y="604" font-size="30" fill="#C15F3C" font-weight="bold">smallbin 5 / 6</text><text x="990" y="652" font-size="25" fill="#2B2620" font-weight="normal">5：哨兵 ⇄ F (80 B)</text><text x="990" y="693" font-size="25" fill="#2B2620" font-weight="normal">6：哨兵 ⇄ H (96 B)</text><text x="990" y="734" font-size="25" fill="#2B2620" font-weight="normal">同桶精确尺寸</text><rect x="1415" y="560" width="415" height="260" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="1440" y="604" font-size="30" fill="#C15F3C" font-weight="bold">large bins</text><text x="1440" y="652" font-size="25" fill="#2B2620" font-weight="normal">范围桶 / 大小排序</text><text x="1440" y="693" font-size="25" fill="#2B2620" font-weight="normal">图中暂未挂块</text><text x="1440" y="734" font-size="25" fill="#2B2620" font-weight="normal">必要时从 unsorted 归类</text><rect x="65" y="860" width="1790" height="110" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="904" font-size="30" fill="#C15F3C" font-weight="bold">同一块，两种视图</text><text x="90" y="952" font-size="25" fill="#2B2620" font-weight="normal">bin 只链接空闲块，不移动物理位置；chunk 可改变索引归属，也可与相邻空闲块合并。</text><text x="65" y="1030" font-size="23" fill="#6B5D4F" font-weight="normal">在用块 A/C/E/G/I 没有空闲 bin 归属；释放并不自动等于归还内核，合并也不等于立即缩小 RSS。</text></svg>