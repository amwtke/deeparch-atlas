<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Noto Sans CJK SC"><rect width="1920" height="1080" fill="#F5F0E8"/><text x="65" y="75" font-size="44" fill="#2B2620" font-weight="bold">演化时间线：每一代都在重估资源、负载与锁竞争</text><text x="65" y="125" font-size="25" fill="#6B5D4F" font-weight="normal">年份以 glibc NEWS 与作者原文为准；不把某个独立发行包日期当作集成时间。</text><rect x="65" y="215" width="335" height="470" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="259" font-size="30" fill="#C15F3C" font-weight="bold">1987 dlmalloc</text><text x="90" y="307" font-size="25" fill="#2B2620" font-weight="normal">Doug Lea</text><text x="90" y="348" font-size="25" fill="#2B2620" font-weight="normal">通用分配器目标</text><text x="90" y="389" font-size="25" fill="#2B2620" font-weight="normal">速度 / 空间 / 可移植性</text><text x="90" y="430" font-size="25" fill="#2B2620" font-weight="normal">boundary tags 与分桶</text><path d="M400,720 L425,720" stroke="#C15F3C" stroke-width="4" fill="none"/><path d="M411,711 L425,720 L411,729" fill="none" stroke="#C15F3C" stroke-width="4"/><text x="424.5" y="712.0" font-size="22" fill="#6B5D4F" font-weight="normal"></text><rect x="425" y="215" width="335" height="470" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="450" y="259" font-size="30" fill="#C15F3C" font-weight="bold">1990s ptmalloc</text><text x="450" y="307" font-size="25" fill="#2B2620" font-weight="normal">Wolfram Gloger</text><text x="450" y="348" font-size="25" fill="#2B2620" font-weight="normal">共享进程中的并发需求</text><text x="450" y="389" font-size="25" fill="#2B2620" font-weight="normal">多 arena 逐步形成</text><text x="450" y="430" font-size="25" fill="#2B2620" font-weight="normal">锁边界随数据分片</text><path d="M760,720 L785,720" stroke="#C15F3C" stroke-width="4" fill="none"/><path d="M771,711 L785,720 L771,729" fill="none" stroke="#C15F3C" stroke-width="4"/><text x="784.5" y="712.0" font-size="22" fill="#6B5D4F" font-weight="normal"></text><rect x="785" y="215" width="335" height="470" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="810" y="259" font-size="30" fill="#C15F3C" font-weight="bold">2002 glibc 2.3</text><text x="810" y="307" font-size="25" fill="#2B2620" font-weight="normal">NEWS 记录 malloc 重写</text><text x="810" y="348" font-size="25" fill="#2B2620" font-weight="normal">基于 dlmalloc 2.7.0</text><text x="810" y="389" font-size="25" fill="#2B2620" font-weight="normal">更早 glibc 已有 arena</text><text x="810" y="430" font-size="25" fill="#2B2620" font-weight="normal">并非 2006 首次整合</text><path d="M1120,720 L1145,720" stroke="#C15F3C" stroke-width="4" fill="none"/><path d="M1131,711 L1145,720 L1131,729" fill="none" stroke="#C15F3C" stroke-width="4"/><text x="1144.5" y="712.0" font-size="22" fill="#6B5D4F" font-weight="normal"></text><rect x="1145" y="215" width="335" height="470" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="1170" y="259" font-size="30" fill="#C15F3C" font-weight="bold">2017 glibc 2.26</text><text x="1170" y="307" font-size="25" fill="#2B2620" font-weight="normal">DJ Delorie 等</text><text x="1170" y="348" font-size="25" fill="#2B2620" font-weight="normal">per-thread tcache</text><text x="1170" y="389" font-size="25" fill="#2B2620" font-weight="normal">减少热点 arena 锁访问</text><text x="1170" y="430" font-size="25" fill="#2B2620" font-weight="normal">缓存成本与检查同步演进</text><path d="M1480,720 L1505,720" stroke="#C15F3C" stroke-width="4" fill="none"/><path d="M1491,711 L1505,720 L1491,729" fill="none" stroke="#C15F3C" stroke-width="4"/><text x="1504.5" y="712.0" font-size="22" fill="#6B5D4F" font-weight="normal"></text><rect x="1505" y="215" width="335" height="470" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="1530" y="259" font-size="30" fill="#C15F3C" font-weight="bold">后续 持续演进</text><text x="1530" y="307" font-size="25" fill="#2B2620" font-weight="normal">指针保护 / 检查改进</text><text x="1530" y="348" font-size="25" fill="#2B2620" font-weight="normal">运行时与业务专用池</text><text x="1530" y="389" font-size="25" fill="#2B2620" font-weight="normal">负载改变，约束重估</text><text x="1530" y="430" font-size="25" fill="#2B2620" font-weight="normal">不是通用 allocator 消失</text><rect x="65" y="790" width="1790" height="205" rx="18" fill="#FBF8F2" stroke="#D8CCBA" stroke-width="2"/><text x="90" y="834" font-size="30" fill="#C15F3C" font-weight="bold">平行路线：不是后来者只能复制前人的形状</text><text x="90" y="882" font-size="24" fill="#2B2620" font-weight="normal">jemalloc：多 arena + size classes + thread caches；CPU 绑定是配置选择。</text><text x="90" y="922" font-size="24" fill="#2B2620" font-weight="normal">TCMalloc：区分 gperftools 的线程缓存与现代 Google TCMalloc 的 per-CPU 模式。</text><text x="90" y="962" font-size="24" fill="#2B2620" font-weight="normal">mimalloc：按页组织空闲链与线程局部管理；通用接口下仍有不同取舍。</text><text x="65" y="1030" font-size="23" fill="#6B5D4F" font-weight="normal">一手依据：Doug Lea A Memory Allocator；glibc 2.3 NEWS；glibc 2.26 发布记录与 tcache 提交讨论。</text></svg>