<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Noto Sans CJK SC"><rect width="1920" height="1080" fill="#F5F0E8"/><text x="65" y="75" font-size="44" fill="#2B2620" font-weight="bold">跨领域同构：迁移问题结构，不复制具体实现</text><text x="65" y="125" font-size="25" fill="#6B5D4F" font-weight="normal">五个维度：资源单位、索引、池边界、信息反查、局部化；相似角色并不意味着机制一一等价。</text><rect x="65" y="175" width="265" height="139" fill="#E8DFD0" stroke="#D8CCBA"/><text x="81" y="214" font-size="25" fill="#C15F3C" font-weight="bold">比较维度</text><rect x="330" y="175" width="380" height="139" fill="#E8DFD0" stroke="#D8CCBA"/><text x="346" y="214" font-size="24" fill="#C15F3C" font-weight="bold">ptmalloc</text><rect x="710" y="175" width="380" height="139" fill="#E8DFD0" stroke="#D8CCBA"/><text x="726" y="214" font-size="24" fill="#C15F3C" font-weight="bold">JVM GC</text><rect x="1090" y="175" width="380" height="139" fill="#E8DFD0" stroke="#D8CCBA"/><text x="1106" y="214" font-size="24" fill="#C15F3C" font-weight="bold">Linux SLUB</text><rect x="1470" y="175" width="385" height="139" fill="#E8DFD0" stroke="#D8CCBA"/><text x="1486" y="214" font-size="24" fill="#C15F3C" font-weight="bold">数据库 / K8s</text><rect x="65" y="314" width="265" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="81" y="353" font-size="25" fill="#2B2620" font-weight="normal">资源单位</text><rect x="330" y="314" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="346" y="353" font-size="24" fill="#2B2620" font-weight="normal">chunk</text><text x="346" y="387" font-size="24" fill="#2B2620" font-weight="normal">虚拟字节块</text><rect x="710" y="314" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="726" y="353" font-size="24" fill="#2B2620" font-weight="normal">Object</text><text x="726" y="387" font-size="24" fill="#2B2620" font-weight="normal">运行时对象</text><rect x="1090" y="314" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1106" y="353" font-size="24" fill="#2B2620" font-weight="normal">对象 / slab 页</text><text x="1106" y="387" font-size="24" fill="#2B2620" font-weight="normal">区分单元与承载</text><rect x="1470" y="314" width="385" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1486" y="353" font-size="24" fill="#2B2620" font-weight="normal">buffer frame / Pod</text><text x="1486" y="387" font-size="24" fill="#2B2620" font-weight="normal">页帧 / 调度任务</text><rect x="65" y="453" width="265" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="81" y="492" font-size="25" fill="#2B2620" font-weight="normal">空闲与定位</text><rect x="330" y="453" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="346" y="492" font-size="24" fill="#2B2620" font-weight="normal">bin / tcache</text><text x="346" y="526" font-size="24" fill="#2B2620" font-weight="normal">地址相邻 ≠ 链表相邻</text><rect x="710" y="453" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="726" y="492" font-size="24" fill="#2B2620" font-weight="normal">分配区 / 空闲表</text><text x="726" y="526" font-size="24" fill="#2B2620" font-weight="normal">Generation 不是 bin</text><rect x="1090" y="453" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1106" y="492" font-size="24" fill="#2B2620" font-weight="normal">freelist / partial</text><text x="1106" y="526" font-size="24" fill="#2B2620" font-weight="normal">按对象类别组织</text><rect x="1470" y="453" width="385" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1486" y="492" font-size="24" fill="#2B2620" font-weight="normal">hash/LRU/queue</text><text x="1486" y="526" font-size="24" fill="#2B2620" font-weight="normal">定位、替换、候选</text><rect x="65" y="592" width="265" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="81" y="631" font-size="25" fill="#2B2620" font-weight="normal">池与边界</text><rect x="330" y="592" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="346" y="631" font-size="24" fill="#2B2620" font-weight="normal">arena / heap</text><text x="346" y="665" font-size="24" fill="#2B2620" font-weight="normal">线程缓存为旁路</text><rect x="710" y="592" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="726" y="631" font-size="24" fill="#2B2620" font-weight="normal">Heap / regions</text><text x="726" y="665" font-size="24" fill="#2B2620" font-weight="normal">由 GC 实现决定</text><rect x="1090" y="592" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1106" y="631" font-size="24" fill="#2B2620" font-weight="normal">kmem_cache / perCPU</text><text x="1106" y="665" font-size="24" fill="#2B2620" font-weight="normal">不是进程 arena</text><rect x="1470" y="592" width="385" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1486" y="631" font-size="24" fill="#2B2620" font-weight="normal">pool / Node</text><text x="1486" y="665" font-size="24" fill="#2B2620" font-weight="normal">锁边界 / 调度边界</text><rect x="65" y="731" width="265" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="81" y="770" font-size="25" fill="#2B2620" font-weight="normal">信息反查</text><rect x="330" y="731" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="346" y="770" font-size="24" fill="#2B2620" font-weight="normal">指针 → chunk</text><text x="346" y="804" font-size="24" fill="#2B2620" font-weight="normal">头中尺寸与标志</text><rect x="710" y="731" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="726" y="770" font-size="24" fill="#2B2620" font-weight="normal">runtime 类型信息</text><text x="726" y="804" font-size="24" fill="#2B2620" font-weight="normal">GC 还负责可达性</text><rect x="1090" y="731" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1106" y="770" font-size="24" fill="#2B2620" font-weight="normal">cache / 地址元数据</text><text x="1106" y="804" font-size="24" fill="#2B2620" font-weight="normal">kmem_cache_free≠kfree</text><rect x="1470" y="731" width="385" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1486" y="770" font-size="24" fill="#2B2620" font-weight="normal">page id / Pod spec</text><text x="1486" y="804" font-size="24" fill="#2B2620" font-weight="normal">索引与调度缓存</text><rect x="65" y="870" width="265" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="81" y="909" font-size="25" fill="#2B2620" font-weight="normal">局部化代价</text><rect x="330" y="870" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="346" y="909" font-size="24" fill="#2B2620" font-weight="normal">tcache + 多 arena</text><text x="346" y="943" font-size="24" fill="#2B2620" font-weight="normal">缓存滞留 / 碎片</text><rect x="710" y="870" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="726" y="909" font-size="24" fill="#2B2620" font-weight="normal">TLAB 等</text><text x="726" y="943" font-size="24" fill="#2B2620" font-weight="normal">分配快不等于GC免费</text><rect x="1090" y="870" width="380" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1106" y="909" font-size="24" fill="#2B2620" font-weight="normal">per-CPU 缓存</text><text x="1106" y="943" font-size="24" fill="#2B2620" font-weight="normal">并发规则仍存在</text><rect x="1470" y="870" width="385" height="139" fill="#FBF8F2" stroke="#D8CCBA"/><text x="1486" y="909" font-size="24" fill="#2B2620" font-weight="normal">分片 / 缓存</text><text x="1486" y="943" font-size="24" fill="#2B2620" font-weight="normal">不能直接等同无锁</text><text x="65" y="1030" font-size="23" fill="#6B5D4F" font-weight="normal">数据库默认页：InnoDB 常见 16 KB，PostgreSQL 常见 8 KB；K8s 调度不是一个 glibc 式内存分配器。</text></svg>